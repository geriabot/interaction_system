# The language-dependent resources of the interaction system for one language: Spanish.
#
# Every language has one file like this in config/languages/, with exactly the same keys (the
# loader refuses a file with a key missing or extra, or a phrase whose {placeholders} differ from
# English's; test/test_languages.py checks every file). The `language` parameter of the
# interaction intelligence selects the file by `name`, `code`, an alias or the file name (any
# case). How to add a language: docs/ADDING_A_LANGUAGE.md. The comments of each key are in
# english.yaml.

name: Spanish
code: es
aliases: ["español", "castellano", "spa"]

speech:
  stt_language: es
  piper_voice: es_ES-sharvard-medium
  piper_speaker: -1
  mms_voice: spa

# Only the whole utterance counts (normalised: "¡Para, para!" is "para para", a repeated
# command): "Para." stops, "Para mí un café." or "No, para el martes." do not (the model decides
# them). Left out on purpose: "no" (an answer), "alto" and "salir" (answers to a question),
# "olvídalo" and "déjalo" (may drop only the last value, or mean "leave it as it is"),
# "terminar" (the role play's way to end the practice, evaluated: roleplay_intro).
cancel_commands:
  - "para"
  - "para ya"
  - "para por favor"
  - "por favor para"
  - "basta"
  - "basta ya"
  - "ya basta"
  - "cancela"
  - "cancelar"
  - "cancélalo"
  - "cancela por favor"
  - "déjalo ya"
  - "dejémoslo"
  - "detente"

# Only fallbacks (english.yaml): "vale" and "correcto" confirmed by the author (2026-10-30)
yes_words: ["sí", "si", "vale", "correcto", "claro", "de acuerdo", "sí por favor"]
no_words: ["no", "no gracias", "qué va"]

# Replies that report a step done: see english.yaml (step_done_words).
step_done_words: ["hecho", "ya está", "ya lo he hecho", "ya lo hice", "hecho ya", "ya", "listo", "lista", "terminado", "terminada", "vale hecho", "ok hecho"]

# Ordinales por posición (english.yaml), con sus variantes de género
ordinal_words: ["primero|primera|primer", "segundo|segunda", "tercero|tercera|tercer",
                "cuarto|cuarta", "quinto|quinta", "sexto|sexta"]
last_words: ["último", "última"]

# Palabras de una respuesta que duda entre opciones (english.yaml)
hedge_words: ["o", "u", "entre", "quizá", "quizás", "tal vez"]

# Palabras que niegan un valor dicho a su lado (english.yaml)
negation_words: ["no", "ni", "nunca", "jamás", "tampoco", "nada", "sino", "excepto", "salvo",
                 "en vez de", "en lugar de"]

# Palabras de una respuesta que se refieren al ítem anterior del cuestionario (english.yaml)
previous_item_words: ["anterior", "la de antes", "la otra", "la primera", "el primero",
                      "cambia mi respuesta", "mi respuesta a", "la última", "lo de antes"]

# Palabras que nunca terminan un valor dicho solo (english.yaml)
trailing_words: ["el", "la", "los", "las", "un", "una", "y", "o", "de", "del", "a", "al", "en",
                 "que", "es", "eh", "em"]

# Only a whole utterance made of these is noise (english.yaml). Left out on purpose: "próxima
# semana" and "hasta la próxima (vez / semana)", which a user may say as an answer or a goodbye
asr_noise_phrases:
  - "gracias por ver"
  - "gracias por ver el vídeo"
  - "gracias por verlo"
  - "gracias por su atención"
  - "suscríbete"
  - "no olvides suscribirte"
  - "no olvides"
  - "dale like"
  - "dale me gusta"
  - "subtítulos"
  - "subtítulos por la comunidad de amara.org"
  - "subtítulos realizados por la comunidad de amara.org"
  - "amara"
  - "música"
  - "silencio"
  - "aplausos"
  - "continuará"
  - "nos vemos en el próximo"
  - "próximo vídeo"
  - "próximos vídeos"
  - "eh"
  - "mm"

ack_phrases: ["Anotado.", "Hecho.", "Perfecto.", "Entendido.", "De acuerdo."]

# Muletillas mientras se prepara la respuesta, en el orden de la escalera (a los 2, 5, 9 y 14 s;
# la última se repite cada filler_repeat_s); filler_phrases / phrases.filler las sustituyen
filler_phrases: ["Mmm…", "Un momento…", "Déjame pensarlo un momento…", "Ya casi lo tengo…",
                 "Sigo con ello, un segundito…"]

