# The questions of the interaction system to the model, for behavior_architecture's
# interpretation server (its parameter questions_file). Each one is a method of LLMDialogClient
# that asks the model; the server builds its prompt and schema with PromptBuilder, from the
# templates of prompts.yaml (the server's templates_file) and the arguments that the client
# sends in the context (interaction_intelligence/interpretation_context.py), in the class
# DialogueQuestion of the question module interaction_intelligence.interpretation_questions.
#
#   template    the template of prompts.yaml that the prompt fills (PromptBuilder also inserts
#               the shared rules, address_rule and list_slot_rule, and the [CONTEXT] block)
#   max_tokens  the token cap of the answer when the request gives none (the client sends its
#               own with every call; judge_teach_back: 120 + 60 per key point, set by the class)
#   parse       text: a spoken line, asked without a schema; allow_empty: an empty line is
#               returned too (the client asks again for a line too short to be said)
#   validate    object: an understanding question, asked with its schema; the class returns
#               the model's text without reading it
#   variants    reasoning: the questions on which the model may reason (the client's
#               REASONING_QUESTIONS, with reasoning "critical"), answered on the route
#               `reasoning` (the same model, with think on)
#
# The answer of every question is the model's text, {"text": <the text>}: the client reads it,
# validates it, retries and falls back as it did with the former gateway's answers. No question
# has a retry or a fallback in the server: the client keeps its own.

questions:

  # ==== Task level ====

  classify_task_mode:
    class: DialogueQuestion
    template: classify_task_mode
    max_tokens: 50
    validate: object
  choose_dialogue_behavior:
