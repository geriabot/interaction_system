/interaction_orchestrator:
  ros__parameters:
    control_cycle_rate_ms: 50

    # Limits of every dialogue, written to the blackboard of the behavior
    # (max_turns, max_silence, max_stalled, max_attempts and max_off_task are the defaults of the
    # requests that leave them unset; 0 = unlimited, except max_attempts)
    wait_timeout: 15.0          # silence of the user before each prompt that the robot is waiting (s)
    max_silence: 90.0           # continuous silence of the user that ends the dialogue (s)
    max_stalled: 4              # user turns in a row without progress that end the dialogue
    max_turns: 0                # user turns of a dialogue
    max_attempts: 3             # per element: explanations, helps with a step, askings of a slot,
                                # repetitions of a quiz question
    max_off_task: 6             # requests in a row outside the task (grounded QA) that end the
                                # dialogue (outcome breakdown, reason "Off-task: ...")
    tts_timeout: 60.0           # longest utterance (s)
    intelligence_timeout: 30.0  # longest wait for a skill of the intelligence (s): the hard
                                # limit; past it, the error closing (outcome error)
    reasoning_intelligence_timeout: 300.0  # the same when the model may reason (DialogTask
                                # reasoning not 0): reasoning is not cut, only a hung model
                                # (reasoning_timeout, at most two such calls in one skill)
    reply_budget: 20.0          # time the intelligence may spend asking the model for the reply
                                # to a user turn, from the end of the turn (s); once spent, the
                                # pending questions fall back, so that the robot answers within
                                # it when the model hangs; 0 = no budget
    opening_budget: 30.0        # the same for the opening (it may design the frame or list the
                                # key points, and generate the longest text: an explanation)
    user_speaking_topic: "/user_speaking"  # barge-in (Bool); "" disables it
    filler_after_s: 2.0         # a reply not ready after this many seconds: the robot starts
                                # the ladder of fixed fillers ("Hmm..." at 2 s, then 5, 9 and 14 s,
                                # each with its own phrase); the default of the requests that
                                # leave it unset; 0 = no fillers
    filler_repeat_s: 8.0        # after the ladder, one more filler (the last phrase) every this
                                # many seconds; 0 = none after the ladder

    # The catalog of dialogue behaviors. A request names one with dialog_mode, or the
    # intelligence chooses the one the task needs, over the whole catalog (or none). Either way
    # the request must provide its needs (what the intelligence's selection.py checks:
    # question_bank, steps, scene, material, instrument, reference, topic); otherwise it is not feasible
    dialogue_behaviors:
      behaviors: ["Explanation", "Quiz", "Procedure", "Roleplay", "GroundedQA", "Questionnaire", "TopicChat", "SlotFilling"]

      SlotFilling:
        behavior_id: 0
        mode: "slot_filling"
        needs: [""]
        explanation: "The robot asks the user for data it must record: an order, a booking, a registration, a form. It COLLECTS those values (also a preference or decision among options it presents) and reads them back for confirmation. Not for the items of a questionnaire or a rating scale, the answers to test questions, or questions the user asks."
        node_name: "interaction_slot_filling"  # As in interaction_behaviors_config.yaml

      Explanation:
        behavior_id: 1
        mode: "explanation"
        needs: ["reference"]  # a reference text or the key points (what is explained)
        explanation: "The robot tells the user something they must understand or remember (what it is, what will happen, or how to do it before the user does it) and checks it: it EXPLAINS given content and explains again if needed. Only when there is nothing to collect from the user, and not when the user comes to ask their own questions."
        node_name: "interaction_explanation"

      Quiz:
        behavior_id: 2
        mode: "quiz"
        needs: ["question_bank"]
        explanation: "The robot asks questions that have a right answer, to see what the user knows or remembers: it ASKS the questions of a question bank, grades each answer and gives the score (tests, quizzes, cognitive exercises, vocabulary or recall practice, trivia)."
        node_name: "interaction_quiz"

      Procedure:
        behavior_id: 3
        mode: "procedure"
        needs: ["steps"]
        explanation: "The user does something now, step by step, and the robot GUIDES them through it (not steps the robot carries out by itself), helping when the user is stuck and repeating, going back or skipping steps on request: physical exercises, assembly, recipes, using a device or a screen, checklists."
        node_name: "interaction_procedure"

      Roleplay:
        behavior_id: 4
        mode: "roleplay"
        needs: ["scene"]
        explanation: "The robot plays a character so that the user practises a situation: it PLAYS that character in a scene (a job interview, a customer, a conversation in another language, a difficult talk), and then scores the user against a rubric."
        node_name: "interaction_roleplay"

      GroundedQA:
        behavior_id: 5
        mode: "grounded_qa"
        needs: ["material"]
        explanation: "The user asks and the robot answers from given information: it ANSWERS the user's questions about a topic, only from the information it is given (a reception desk, a museum, a station, a shop, opening hours, prices), says when it does not have the information, and declines what is outside the task. Only when the user is the one who asks; nothing to collect, explain or test."
        node_name: "interaction_grounded_qa"

      Questionnaire:
        behavior_id: 6
        mode: "questionnaire"
        needs: ["instrument"]
        explanation: "The robot reads the items of a questionnaire, scale or survey, each with its answer options: it ADMINISTERS a standardized instrument (a satisfaction or experience survey, a pain or strain rating scale, screening questions, a validated instrument), reads each item and its options as written, records the option the user chooses and computes the score."
        node_name: "interaction_questionnaire"

      TopicChat:
        behavior_id: 7
        mode: "topic_chat"
        needs: ["topic"]
        explanation: "The robot and the user talk about a topic set for them, with nothing to collect, explain or test (companionship, reminiscence: their village, a photograph, their work): the robot TALKS with the user, comments on what the user tells and asks open questions on the topic, steers back to it gently, avoids the topics it is told to avoid, and closes with a short summary and a goodbye."
        node_name: "interaction_topic_chat"
