llm_manager_node:
  ros__parameters:
    default_provider: "ollama"
    default_model: ""
    max_concurrent: 4
    silent_mode: false

    ollama:
      enable: true
      host: "127.0.0.1"
      port: 11434
      model: "qwen2.5:7b"
      timeout: 120.0
      # Reasoning models think before answering when true (slower); a level
      # ("low") for the models that cannot switch it off (gpt-oss).
      think: false
      # Context window of every request (the same in E0a's phases A and B and in E1).
      num_ctx: 8192

    gemini:
      enable: false
      # Leave empty — the provider picks up GEMINI_API_KEY from the environment.
      api_key: ""
      model: "gemini-2.5-flash"
      timeout: 60.0

    claude:
      enable: false
      # Leave empty — the provider picks up ANTHROPIC_API_KEY from the environment.
      api_key: ""
      model: "claude-haiku-5-5"
      timeout: 60.0
      # Thinking effort (low keeps spoken replies fast).
      effort: "low"

    openai:
      enable: false
      # Leave empty — the provider picks up OPENAI_API_KEY from the environment.
      api_key: ""
      model: "gpt-6-luna"
      timeout: 60.0
      # Reasoning effort (none keeps spoken replies fast).
      reasoning_effort: "none"
      # Optional OpenAI-compatible server URL; empty = api.openai.com.
      base_url: ""

interaction_intelligence:
  ros__parameters:
    # Topics. What the user says: /listened_text (simple_hri's transcriptions) and
    # /transcription (typed text, e.g. from the GUI).
    transcription_topics: ["/listened_text", "/transcription"]
    # The state of the user (emotion), from the perception subsystem. Off: the emotion detector is
    # preliminary work, not validated (interaction_perception's README); set it to
    # "/interaction_perception/get_user_state" to try it.
    user_state_service: ""

    # The language of the conversation: a language file of interaction_intelligence
    # (config/languages/*.yaml: English, Spanish), by name or code. It sets the language of the
    # generated replies and every language-dependent resource (fixed phrases, acknowledgments,
    # fillers, exact stop commands, speech settings). A language without a file stops the node;
    # how to add one: docs/ADDING_A_LANGUAGE.md.
    language: "English"

    # Maximum number of turns kept in the dialog history buffer.
    # When exceeded, the oldest half is dropped to bound memory usage.
    history_max_turns: 200

    # Acknowledgment phrases injected by the system (not the LLM) after each
    # successful slot extraction (slot-filling only).
    # Leave empty ([""]) to use those of the language file of `language`
    # above; set an explicit list here to override them.
    ack_phrases: [""]
    # Set to false to drop the acknowledgments entirely (a capable model's
    # reply already reads naturally without them).
    ack_enabled: true

    # Longest wait for one call to the LLM (s). A call that times out is not repeated, and the
    # other questions of the same skill fail at once (the model is taken as unresponsive); the
    # reply's time budget (reply_budget, an orchestrator parameter) can cut a call shorter.
    llm_timeout: 15.0
    # Prompt spoken when the user doesn't respond within wait_timeout seconds.
    # Empty = the phrase of the language file of `language`; set to override.
    timeout_prompt: ""

    # LLM Manager binding. Empty → node picks its own defaults.
    llm_provider: ""
    llm_model: ""

    # Logging.
    silent_mode: false
    # Set to "" to disable transcript logging.
    conversation_log_path: "/tmp/dialog_conversations.log"
    # Rotate transcript when it exceeds this size. 0 = never rotate.
    conversation_log_max_mb: 10.0

interaction_orchestrator:
  ros__parameters:
    # Timing.
    wait_timeout: 15.0
    tts_timeout: 60.0
    # The wait for the model: the intelligence may spend reply_budget seconds asking it for the
    # reply to a user turn (opening_budget for the opening); once spent, the pending questions fall
    # back, so a hung model never keeps the user waiting longer. intelligence_timeout is the hard
    # limit of every request to the intelligence: past it, the error closing. 0 = no budget.
    reply_budget: 20.0
    opening_budget: 30.0
    intelligence_timeout: 30.0

    # Limits of a dialogue (the defaults of the requests that leave them unset).
    max_silence: 90.0
    max_stalled: 4
    max_turns: 0
    max_attempts: 3
    max_off_task: 6

    # Set to "" to disable barge-in.
    user_speaking_topic: "/user_speaking"

    # Conversational fillers: a reply not ready after filler_after_s seconds is preceded by a
    # ladder of fixed fillers whose wording changes as the wait grows (after 2, 5, 9 and 14 s),
    # then by the last one every filler_repeat_s seconds. 0 = none.
    filler_after_s: 2.0
    filler_repeat_s: 8.0

