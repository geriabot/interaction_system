# Runtime parameters for the LLM Manager node (provider selection and config).
llm_manager_node:
  ros__parameters:

    # Default provider used when a session request does not specify one.
    # Must match one of the enabled providers below: "ollama", "gemini", "claude" or "openai".
    default_provider: "ollama"

    # Default model override. Leave empty to use the provider's own default.
    default_model: ""

    # Maximum number of concurrent inference threads.
    max_concurrent: 4

    # Disable informational logs when true.
    silent_mode: false

    ollama:
      # Set to true to enable the Ollama provider and connect at startup.
      enable: true
      host: "127.0.0.1"
      port: 11434
      # Model to pre-load into VRAM on startup.
      model: "qwen2.5:7b"
      # Request timeout in seconds for inference calls.
      timeout: 120.0
      # Let reasoning models (qwen3.5, deepseek-r1...) think before answering.
      # Slower; false keeps spoken replies fast. Ignored by other models. A level
      # ("low") for the models that cannot switch it off (gpt-oss); a model that
      # thinks gets 1024 tokens more than the cap of each request.
      think: false
      # Context window of every request, in tokens (the server's own default
      # depends on its version; a longer prompt would be cut silently).
      num_ctx: 8192

    gemini:
      # Set to true to enable the Gemini provider and connect at startup.
      enable: false
      # API key for Google Gemini. Prefer setting the GEMINI_API_KEY
      # environment variable and leaving this field empty.
      api_key: ""
      model: "gemini-2.5-flash"
      # Request timeout in seconds for inference calls.
      timeout: 60.0
      # Optional server with Gemini's REST API instead of Google's (e.g. a local
      # stand-in for testing); empty uses Google's API.
      base_url: ""

    claude:
      # Set to true to enable the Anthropic Claude provider and connect at startup.
      enable: false
      # Claude API key (console.anthropic.com). Prefer setting the
      # ANTHROPIC_API_KEY environment variable and leaving this field empty.
      api_key: ""
      model: "claude-haiku-5-5"
      # Request timeout in seconds for inference calls.
      timeout: 60.0
      # Thinking effort: low | medium | high | xhigh | max. "low" keeps spoken
      # replies fast; empty omits it (for older models without effort support).
      effort: "low"

    openai:
      # Set to true to enable the OpenAI provider and connect at startup.
      enable: false
      # OpenAI API key (platform.openai.com). Prefer setting the OPENAI_API_KEY
      # environment variable and leaving this field empty.
      api_key: ""
      model: "gpt-6-luna"
      # Request timeout in seconds for inference calls.
      timeout: 60.0
      # none | low | medium | high | xhigh | max. "none" keeps spoken replies
      # fast; empty omits it (for models without reasoning).
      reasoning_effort: "none"
      # Optional: an OpenAI-compatible server (vLLM, LM Studio, OpenRouter...),
      # e.g. "http://127.0.0.1:1234/v1". Empty = api.openai.com.
      base_url: ""
