# Layer 1 of the debugging before E0a (doc/DEBUGGING.md): every strategy branch and every shared
# mechanism of the method, its expected outcome, and the scripted tests that cover it in English
# and in Spanish. The scripted LLM gives the correct answers, so any failure of these tests is an
# error of the program or its logic. Gate: every test passes, and every row is covered in both
# languages or says why it needs no scripted test (`layer1`).
#
# Ids: those of paper/MECHANISM_COVERAGE_AUDIT_2026-10-30.md (S silence, C cancellation, N no
# progress, O outcomes, F fillers, B barge-in, L limits, SF slot filling, EX explanation, Q quiz,
# P procedure, R role play, G grounded QA, QN questionnaire, SYS system), plus the mechanisms
# added after it (S7, C13, C14, R12) and the model-failure scenarios of E3 (FAIL).
#
# tests: "<alias>::<test function>"; the alias says the file and the languages it runs in
# (`files` below; a test of a file that runs in both languages covers both). `python3
# debug/coverage_matrix.py` checks that every test named exists, and prints the matrix and the rows not
# covered in a language; debug/test_debug.py runs the same check with the light tests.
# layer1: why a row has no scripted test (the model decides it, nothing of the program; or it is
# checked elsewhere): such a row is not a gap of layer 1.

