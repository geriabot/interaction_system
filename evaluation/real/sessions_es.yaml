# DRAFT, TO BE REVIEWED BY THE RESEARCHERS before the first session: the conditions, the
# models, the scenarios, and the wording of every card and of every detour.
#
# The sessions with real participants, in Spanish (real_sessions.py; doc/REAL_SESSIONS.md):
# healthy adults; E4 tries only the method with the local model (decided 2026-10-29: the
# comparison with the LLM-led conversation and the cloud model is made in simulation, E1), so
# each participant has four conversations, each in a different scenario, in an order
# counterbalanced from the participant's number (real_sessions.py plan). Other conditions can
# be enabled for other studies.
#
#   conditions   the conditions compared, in this order (the order of the Latin square): the
#                control of the conversation (bounded: the method, main.launch.py; llm_led: the
#                LLM-led conversation, the `monolithic` ablation, llm_led.launch.py) and the
#                system model: an Ollama model, or a cloud one written provider/model (openai/...,
#                gemini/...; its dated version, never "<pin>"). A condition with
#                `enabled: false` is left out of the plans. With two conditions the orders are AB
#                and BA; with three, the six orders of a balanced Latin square (Williams design).
#   trials_per_condition  scenarios per condition and participant (E4: 4, with one condition)
#   scenarios    the pool: ids of experiments/scenarios/e4_es.yaml (the request sent to
#                the robot and the ground truth come from there), none about health or care.
#                Each has the task card the participant reads (Spanish, informal "tú", short,
#                readable on a screen) and one detour: something to try at some point to take the
#                robot out of its task (kind: off_task, an unrelated question; decline, a request
#                the robot should decline; not_allowed, a value the task does not allow). The card
#                follows the scenario's user_goal, so that its ground truth (`expect`) still scores
#                the conversation; names and addresses are fictitious, and the footer of every
#                card asks the participant to use them and never their own data, so that nothing
#                that identifies the participant enters the conversation (nor reaches a cloud
#                provider).
#   card_footer, detour_label  the text shown under every card, and before its detour
#   check_phrase what the robot says in the Speak check (real_sessions.py check speak) and in the
#                pre-session check
#   launch       the speech engines and their language; the voice, its settings, the filler delay,
#                the microphone and the speech-recognition model are the configuration of the
#                campaign (real/configs/), not this file's
#
# A campaign (real/campaigns/<name>.yaml) runs with this file (the study design: conditions,
# scenarios, cards) and one configuration; its participants are stored apart, in
# ~/.ros/interaction_real/<campaign>/. A pilot is a campaign.
#   barge_in     whether the robot stops talking when the participant starts speaking: the lip
#                activity detector on the camera (live and local, no images stored, never the
#                emotion detector). Decided after the pilot; the same for every trial of a
#                participant. The panel's checkbox (real_sessions.py --barge-in) overrides it.
#   camera_topic the camera image of the lip activity detector, when barge_in is on
#
# The participants see and hear Spanish: the cards, the footer, the label and the check phrase
# are in Spanish; everything else is in English.
#
# A cloud model gets the text that the speech recognition transcribes on this computer (never
# the audio): a trial of a cloud condition needs --allow-cloud, and the consent form must say so.
name: real_sessions_es
scenarios_file: ../experiments/scenarios/e4_es.yaml   # E4: one shared mechanism per scenario
language: Spanish
barge_in: false   # future work: no camera driver nor perception dependencies yet (doc/REAL_SESSIONS.md#barge-in)
# Parameter overrides for one system model can go in model_params: {<model>: {...}}. None: the
# local model answers every question (no routes)
camera_topic: /camera/image_raw

conditions:
  bounded:
    control: bounded
    model: "qwen3:8b"          # the local model: provisional until E0a chooses it
  llm_led:
    control: llm_led
    model: "openai/<pin>"         # the large cloud model of E1: write its dated version
    enabled: false                # E4 tries only the method with the local model
  llm_led_local:                  # optional: separates the effect of the control from the model's
    control: llm_led
    model: "qwen3:8b"
    enabled: false
trials_per_condition: 4         # four conversations per participant, all with the method

# The speech capability on the computer of the robot (simple_hri): its engines and language. How
# the robot sounds and the speech hardware (the Piper voice and its settings, the filler delay,
# the microphone, the speech-recognition model) are NOT here: they are the configuration of the
# campaign (real/configs/<name>.yaml), the one source of truth, frozen once a campaign uses it
# (real/campaigns.py; doc/REAL_SESSIONS.md#campaigns-and-configurations)
launch: {speech: simple_hri, language: es, stt: faster_whisper, tts: piper}
ollama: {host: 127.0.0.1, port: 11434, timeout: 120.0}
limits: {wait_timeout: 15.0, max_silence: 90.0}   # the system's defaults: the silence handling is part of what E4 observes
max_turns: 25                    # the turn limit of every conversation (as in the experiments)
dialogue_timeout: 900            # s: the conversation is cancelled after this

check_phrase: "Hola. Esto es una prueba del altavoz del robot. Si me oyes bien, avisa a la persona que dirige la sesión."
detour_label: "Además:"
card_footer:
  - "Usa los datos inventados de esta tarjeta: no digas datos personales reales (tu nombre, tu dirección, tu teléfono...)."
  - "Habla con naturalidad, como lo harías con una persona."
  - "Si el robot no te entiende, repítelo con otras palabras."
  - "La conversación termina cuando el robot se despide."

scenarios:
  - id: sf_coffee
    title: "En la cafetería"
    card:
      - "El robot es el camarero de una cafetería. Pídele:"
      - "• un café con leche mediano, con leche de avena,"
      - "• a nombre de Laura."
      - "• A mitad del pedido, dile «Para, déjalo». Cuando te pregunte si quieres terminar, no le digas ni sí ni no: dale el dato que te había pedido y sigue con el pedido."
      - "Cuando el robot te repita el pedido, dile si está bien. Si algo está mal, corrígelo."
    detour:
      kind: off_task
      text: "En algún momento, pregúntale al robot qué tiempo va a hacer mañana."

  - id: ex_bus
    title: "¿Cómo llego en autobús?"
    card:
      - "El robot te va a explicar cómo ir en autobús desde la residencia hasta el centro de día."
      - "• La primera vez que te lo explique, dile que no te has enterado bien de en qué parada tienes que bajarte."
      - "• Cuando te lo vuelva a explicar y te pida que lo cuentes con tus palabras, cuéntaselo, pero di que te bajas en la tercera parada."
      - "• Cuando te corrija, cuéntaselo bien."
    detour:
      kind: decline
      text: "En algún momento, pídele al robot que te pida un taxi."

  - id: qz_geography
    title: "Preguntas de geografía"
    card:
      - "El robot te va a hacer tres preguntas de geografía."
      - "• A la primera, responde bien: Roma."
      - "• Desde la segunda, no respondas: cada vez que te pregunte, háblale de otra cosa (lo que has desayunado, el tiempo que hace...), hasta que el robot termine la conversación."
    detour:
      kind: decline
      text: "Al principio, pídele al robot que te diga las respuestas antes de empezar."

  - id: pr_tea
    title: "Preparar un té"
    card:
      - "El robot te va a guiar para preparar un té (haz como que lo preparas)."
      - "• Haz cada paso y dile cuándo lo has hecho."
      - "• Cuando te diga que dejes reposar el té, quédate en silencio, sin decir nada, hasta que el robot vuelva a hablarte; entonces dile que ya está."
      - "• Tú no tomas el té con leche ni con azúcar: en el último paso, dile que te lo quieres saltar."
    detour:
      kind: off_task
      text: "En algún momento, pregúntale al robot cuál es su comida favorita."

  - id: rp_interview
    title: "Ensayar una entrevista de trabajo"
    card:
      - "El robot hará de encargado de una librería que te entrevista para un trabajo."
      - "• Responde como alguien a quien le encantan los libros y que ha trabajado dos veranos en un supermercado."
      - "• Responde con claridad y muestra que quieres el trabajo, pero no des ejemplos concretos."
      - "• En tu segunda respuesta, quédate pensando un rato en silencio antes de contestar."
      - "• Más adelante, dile «¿Podemos parar?» y, cuando te pregunte si quieres terminar, dile que no, que sigáis."
    detour:
      kind: off_task
      text: "En algún momento, pregúntale al robot qué libro te recomienda leer este verano."

  - id: sf_pizza
    title: "Pedir una pizza"
    card:
      - "El robot toma pedidos en una pizzería. Pide:"
      - "• una pizza grande con champiñones y aceitunas,"
      - "• a domicilio, en la Calle Mayor 5."
      - "• Cuando te pida un teléfono de contacto, dile que prefieres no darlo."
      - "Cuando el robot te repita el pedido, dile si está bien. Si algo está mal, corrígelo."
    detour:
      kind: not_allowed
      text: "Intenta añadir piña a la pizza (no está en la carta). Si el robot no te deja, sigue con tu pedido."

  - id: qa_museum
    title: "En la entrada del museo"
    card:
      - "Estás en la entrada de un museo de ciencias y el robot atiende a los visitantes. Pregúntale:"
      - "• si el museo abre los lunes; cuando te responda, comenta «vaya, qué pena»,"
      - "• cuánto cuesta la entrada para una persona de 70 años, y pídele que te repita la respuesta,"
      - "• si hay cafetería."
      - "Cuando no tengas más preguntas, díselo."
    detour:
      kind: off_task
      text: "En algún momento, pregúntale al robot qué opina del último partido de fútbol."

  - id: qn_museum_satisfaction
    title: "Encuesta de satisfacción"
    card:
      - "Acabas de visitar un museo y el robot te va a hacer una encuesta de cuatro frases. Responde así:"
      - "• has disfrutado mucho de la visita,"
      - "• la información era bastante fácil de entender,"
      - "• en la tercera frase, pregúntale primero qué quiere decir; después di «algo entre un poco y bastante» y, cuando te repita las opciones, di «un poco»,"
      - "• recomendarías el museo mucho."
    detour:
      kind: decline
      text: "En algún momento, pídele al robot que te diga qué puntuación has dado en total."
