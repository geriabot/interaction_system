# The task cards of sessions_es.yaml translated into English, for readers who do not read Spanish
# (reviewers): the participants only ever see the Spanish cards. Same ids, same lines in the same
# order; make_cards.py writes both versions (cards/es, cards/en). When a Spanish card changes, change
# its translation here too.
detour_label: "Also:"
card_footer:
  - "Use the made-up data on this card: do not say any real personal data (your name, your address, your phone number...)."
  - "Speak naturally, as you would with a person."
  - "If the robot does not understand you, say it again in other words."
  - "The conversation ends when the robot says goodbye."

scenarios:
  - id: sf_coffee
    title: "At the café"
    card:
      - "The robot is the waiter of a café. Order:"
      - "• a medium latte, with oat milk,"
      - "• under the name Laura."
      - "• Halfway through the order, tell it «Stop, forget it». When it asks whether you want to finish, say neither yes nor no: give it the detail it had asked you for and carry on with the order."
      - "When the robot reads the order back, tell it whether it is right. If something is wrong, correct it."
    detour: "At some point, ask the robot what the weather will be like tomorrow."

  - id: ex_bus
    title: "How do I get there by bus?"
    card:
      - "The robot will explain how to go by bus from the care home to the day centre."
      - "• The first time it explains it, tell it you did not quite get at which stop you have to get off."
      - "• When it explains it again and asks you to tell it in your own words, do so, but say you get off at the third stop."
      - "• When it corrects you, tell it correctly."
    detour: "At some point, ask the robot to call you a taxi."

  - id: qz_geography
    title: "Geography questions"
    card:
      - "The robot will ask you three geography questions."
      - "• Answer the first one correctly: Rome."
      - "• From the second one on, do not answer: every time it asks, talk about something else (what you had for breakfast, the weather...), until the robot ends the conversation."
    detour: "At the start, ask the robot to tell you the answers before you begin."

  - id: pr_tea
    title: "Making a tea"
    card:
      - "The robot will guide you to make a tea (pretend you are making it)."
      - "• Do each step and tell it when you have done it."
      - "• When it tells you to let the tea steep, stay silent, without saying anything, until the robot speaks to you again; then tell it you are done."
      - "• You do not take your tea with milk or sugar: at the last step, tell it you want to skip it."
    detour: "At some point, ask the robot what its favourite food is."

  - id: rp_interview
    title: "Practising a job interview"
    card:
      - "The robot will play the manager of a bookshop who interviews you for a job."
      - "• Answer as someone who loves books and has worked two summers in a supermarket."
      - "• Answer clearly and show that you want the job, but do not give concrete examples."
      - "• In your second answer, stay silent for a while, thinking, before you answer."
      - "• Later on, ask it «Can we stop?» and, when it asks whether you want to finish, say no, let's carry on."
    detour: "At some point, ask the robot which book it recommends you read this summer."

  - id: sf_pizza
    title: "Ordering a pizza"
    card:
      - "The robot takes orders at a pizzeria. Order:"
      - "• a large pizza with mushrooms and olives,"
      - "• for delivery, to Calle Mayor 5."
      - "• When it asks you for a contact phone number, tell it you would rather not give it."
      - "When the robot reads the order back, tell it whether it is right. If something is wrong, correct it."
    detour: "Try to add pineapple to the pizza (it is not on the menu). If the robot does not let you, carry on with your order."

  - id: qa_museum
    title: "At the museum entrance"
    card:
      - "You are at the entrance of a science museum and the robot attends to the visitors. Ask it:"
      - "• whether the museum opens on Mondays; when it answers, comment «oh, what a shame»,"
      - "• how much a ticket costs for a 70-year-old person, and ask it to repeat the answer,"
      - "• whether there is a café."
      - "When you have no more questions, tell it."
    detour: "At some point, ask the robot what it thinks of the last football match."

  - id: qn_museum_satisfaction
    title: "Satisfaction survey"
    card:
      - "You have just visited a museum and the robot will give you a survey of four statements. Answer like this:"
      - "• you enjoyed the visit very much,"
      - "• the information was quite easy to understand,"
      - "• for the third statement, first ask it what it means; then say «something between a little and quite a lot» and, when it repeats the options, say «a little»,"
      - "• you would recommend the museum very much."
    detour: "At some point, ask the robot to tell you your total score."
