# Evaluation with Ollama (local model)
# Usage: python3 run_eval.py --benchmark all --save --config config_ollama.yaml

llm:
  provider: "ollama"
  model: "qwen2.5:7b"     # available models: llama3.2:3b, phi4-mini, llama3.2, qwen2.5:7b
  ollama_host: "127.0.0.1"
  ollama_port: 11434
  think: false                # Ollama only: let reasoning models (qwen3.5...) think first (slower);
                              # run_models.py uses "low" for the models that cannot switch it off
  num_ctx: 8192               # Ollama only: the context window of every request (E0a: 8k for all)

dialog:
  language: "Spanish"
  history_max_turns: 200
  max_turns_simulation: 20

prompts_yaml: "../../interaction_system_core/interaction_intelligence/config/prompts.yaml"
results_dir: "results"
