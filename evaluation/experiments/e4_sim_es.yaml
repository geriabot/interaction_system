# The simulated twin of the study with real participants (E4): the eight scenarios of the task
# cards (scenarios/e4_es.yaml), each with its shared mechanism provoked by the same events the
# participants do from the card, with the method and the local model (the only condition of E4,
# decided 2026-10-29), with the same limits. Comparing these runs with the sessions of real
# participants (real/sessions_es.yaml) per scenario, that is per mechanism, shows whether what
# the simulation predicts happens with people.
#
# Paid calls (the simulated user only): run_experiment.py --dry-run counts them; the run needs
# --allow-cloud.
name: e4_sim_es
scenarios: scenarios/e4_es.yaml
personas_file: personas.yaml
# The personas closest to healthy adults who follow a card, and the one that tries more detours
# (every persona says the card's detour: it is an event of the scenario)
personas: [cooperative, terse, self_correcting, boundary_testing]
repetitions: 3
language: Spanish
# The local model (provisional until E0a chooses the model (one model for every question, no routes))
models: [qwen3:8b]
conditions:
  # The method: the Behavior Trees with the default parameters (no routes: one model)
  bounded: {}
simulator:
  # As in E1: another family than the system's (Qwen)
  provider: gemini
  # gemini-2.5-flash-lite: the most faithful user simulator among the Gemini models still served,
  # by Zhou et al. 2026 (COLM, Table 4, User-Sim Index: 69.6, against 62.4 for gemini-3-flash and
  # 61.9 for gemini-2.5-flash). The first choice, gemini-2.0-flash (74.7), is no longer served
  # (checked 2026-10-29); capability does not predict fidelity, so the newer Flash models, not in
  # the table, are not preferred
  model: gemini-2.5-flash-lite
  temperature: 0.7
ollama: {host: 127.0.0.1, port: 11434, timeout: 120.0}
# The limits of the real sessions: the silence handling is part of what E4 observes
limits: {wait_timeout: 15.0, max_silence: 90.0}
dialogue_timeout: 900
max_turns: 25
