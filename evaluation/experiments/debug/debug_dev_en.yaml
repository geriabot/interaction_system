# DEBUGGING FILE, NOT AN EXPERIMENT: layer 2 of the debugging before E0a (doc/DEBUGGING.md).
# Its results are never reported, and it is in no campaign: the control panel lists only the
# files of experiments/, not of this folder. It runs the method (bounded, default parameters)
# with real local models on the GPU server, nothing in the cloud, one repetition, recording every
# call of the system's model (record_model_calls) so that each flagged dialogue can be attributed
# with debug/triage.py: C program, P prompt or method, S simulator, M model. Exit: a full pass
# with no C and no P, first with qwen3:8b, then with llama3.1:8b (another family, so that the
# prompts are not tailored to Qwen). Run one model at a time (--only-model), on the GPU server's
# lane (--hardware experiments/hardware/single_gpu.yaml --lane local): the system's model and the
# simulated user (gemma3:12b) are both resident on its GPU (OLLAMA_MAX_LOADED_MODELS=2).
#
# The development scenarios of E0a in English (every strategy, three each), with the personas of
# E0a: what E0a runs next, so that its program and prompt errors are found before it.
name: debug_dev_en
scenarios: ../scenarios/e0a_dev.yaml
personas_file: ../personas.yaml
personas: [cooperative, mild_cognitive_impairment, boundary_testing]
language: English
repetitions: 1
# mistral-nemo:12b: the held-out family (doc/DEBUGGING.md, "Exit, then freeze"): it fixes nothing;
# a failure of it alone is the model's and changes no prompt. Not gemma: it is the simulated user.
models: [qwen3:8b, llama3.1:8b, mistral-nemo:12b]
conditions:
  # The method: the Behavior Trees with the default parameters (no routes: one model)
  bounded: {}
simulator:
  # An open model of a third family (neither Qwen nor Llama), on the same GPU server as the
  # system's model (both fit in 24 GB): the open simulator of the single_gpu profile
  provider: ollama
  model: gemma3:12b
  temperature: 0.7
# Every call of the system's model in each dialogue (model_calls), for debug/triage.py
record_model_calls: true
ollama: {host: 127.0.0.1, port: 11434, timeout: 120.0}
limits: {wait_timeout: 60.0}   # as e0a_dialogues.yaml
dialogue_timeout: 900
max_turns: 25
