# E1 with the roles of the two cloud providers swapped (the variant of E1): the large system model
# from Google and the simulated user from OpenAI (E1 has them the other way round). A check that
# the results do not depend on which provider plays which role (simulator, judge, large model),
# on a fixed subset (4 scenarios of each strategy, listed below; 3 personas). The judge is the one
# chosen in E0b (doc/JUDGE_VALIDATION.md), never of Google's family here, since Gemini is the system.
#
# Paid calls: run_experiment.py --dry-run counts them; the run needs --allow-cloud. A Gemini
# system model needs the google-genai package in the environment of the LLM gateway.
name: e1_role_swap
scenarios: scenarios/dialogues.yaml
personas_file: personas.yaml
# The scenarios: four of each strategy, chosen by id so that the subset keeps the mechanisms that
# only one scenario of E1 provokes (decided 2026-10-30; until then the first four of each
# strategy in file order, which left out the explanation that fails, the stuck step, the step
# repeated and the step back, among others): slot filling with a planned correction (sf_library);
# the explanation not understood, the one said back with a wrong point, the decline answered with
# a targeted question and the one that fails (ex_walker); the quiz answers in the user's own
# words, a number in words and "I don't remember"; the procedure question, repeat and skip, back
# and stuck step; the role play ended by the limit, by the user, by the scene and with a coach
# hint; the questionnaire answer between options, the clarification with a reversed item, the
# declined item and the repeated item
scenario_ids: [sf_coffee, sf_clinic, sf_pizza, sf_library,
               ex_fasting, ex_bus, ex_fire, ex_walker,
               qz_geography, qz_memory, qz_animals, qz_health,
               pr_handwash, pr_breathing, pr_plants, pr_alarm,
               rp_interview, rp_doctor, rp_restaurant, rp_return,
               qa_museum, qa_station, qa_hospital_reception, qa_library,
               qn_museum_satisfaction, qn_robot_service, qn_loneliness, qn_event_feedback]
personas: [cooperative, older_adult, boundary_testing]
repetitions: 1
language: English
# The local model of E1 (provisional until E0a chooses it), and the large cloud model (write the dated versions before running;
# the run refuses an unpinned <pin>)
models: [qwen3:8b, "gemini/<pin>"]
conditions:
  # The method: the Behavior Trees with the default parameters (no routes: one model)
  bounded: {}
  llm_led:
    ablation: monolithic
    skill_modules: ["interaction_ablations.skills"]
simulator:
  provider: openai
  # Pin it before the run; by fidelity as a user simulator (Zhou et al. 2026, COLM, Table 4):
  # gpt-5.1 73.5, gpt-4o-mini 72.1, gpt-5-mini 71.5
  model: "<pin>"
  temperature: 0.7      # null for OpenAI models that only accept their default temperature
ollama: {host: 127.0.0.1, port: 11434, timeout: 120.0}
limits: {wait_timeout: 60.0}
# The wait for the model, opened in every condition alike (decided 2026-10-30): the criteria of
# E1 are task success and staying in the frame, not latency, and a cloud model that reasons
# before answering can take many seconds per call; the method asks two or three narrow questions per turn and the
# LLM-led conversation one, so the method's 20 s budget per reply would cut normal turns of the
# method only. No budget per reply or opening (0); a call waits up to 90 s (several times a
# reasoning cloud model's normal call, below the gateway's 120 s so that a call that hangs is
# not asked again; finite, since the gateway's Gemini backend has no limit of its own) and a
# request up to 300 s. Latency is measured with every model answering,
# and reported and compared descriptively, not as a criterion. E0a, E3 and E4 keep the defaults.
model_wait: {reply_budget: 0.0, opening_budget: 0.0, llm_timeout: 90.0, intelligence_timeout: 300.0}
# Only a guard against a stuck dialogue (one that reaches it counts as failed), so it must not end
# a slow but normal one: up to 25 turns of up to three requests to a model that may take tens of
# seconds per call (the default 900 s is 36 s per turn)
dialogue_timeout: 3600
max_turns: 25
