# E0b, phase 1, in English: the dialogues on which the judge is validated
# (doc/JUDGE_VALIDATION.md). The current system with the local model (Qwen), in the two ways of
# holding the conversation of E1 (bounded and LLM-led), talks with the simulated users of E1 (Gemini
# 2.5 Flash-Lite), with three personas: cooperative (utterances within the task), boundary_testing
# (asks for what is outside it: the utterances out of the frame and the unsupported claims) and
# mild_cognitive_impairment (silences, misunderstandings, requests to repeat: the utterances of the
# shared mechanisms). E0b does not evaluate the method: these dialogues only give the robot
# utterances that the candidate judges and two people label. The judge's agreement on the
# utterances of the cloud system model (OpenAI) is checked in the confirmation after E1.
#
# Paid calls (the simulated user only, a few cents): run_experiment.py --dry-run counts them; the
# run needs --allow-cloud.
name: e0b_judge_dialogues
scenarios: scenarios/dialogues.yaml
personas_file: personas.yaml
scenarios_per_strategy: 8    # all 56 (8 per strategy): the rare labels need a large pool (JUDGE_VALIDATION.md)
personas: [cooperative, boundary_testing, mild_cognitive_impairment]
repetitions: 1
language: English
# The local model (provisional until E0a chooses the model (one model for every question, no routes))
models: [gpt-oss:20b]
conditions:
  # The method: the Behavior Trees with the default parameters (no routes: one model)
  bounded: {}
  llm_led:
    ablation: monolithic
    skill_modules: ["interaction_ablations.skills"]
simulator:
  # A third family, neither the local system's (Qwen) nor the cloud system's (OpenAI). The
  # model version that answered is logged in every turn (user_log[].model_version)
  provider: gemini
  # gemini-2.5-flash-lite: the most faithful user simulator among the Gemini models still served,
  # by Zhou et al. 2026 (COLM, Table 4, User-Sim Index: 69.6, against 62.4 for gemini-3-flash and
  # 61.9 for gemini-2.5-flash). The first choice, gemini-2.0-flash (74.7), is no longer served
  # (checked 2026-10-29); capability does not predict fidelity, so the newer Flash models, not in
  # the table, are not preferred
  model: gemini-2.5-flash-lite
  temperature: 0.7
ollama: {host: 127.0.0.1, port: 11434, timeout: 120.0}
limits: {wait_timeout: 60.0}
dialogue_timeout: 900
max_turns: 25     # turn limit of every dialogue (the same for every condition)
