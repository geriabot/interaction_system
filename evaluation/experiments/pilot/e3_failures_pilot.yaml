# PILOT FILE, NOT AN EXPERIMENT (doc/PILOT.md): its results are never reported. It is derived
# from the experiment file it pilots (pilot_of) when it is loaded: the same conditions, limits,
# wait for the model, simulator, timeouts and launch options; only the dialogues below, the
# models (the pilot's system model, qwen2.5:32b, for every local model and every cloud system
# model) and the stand-ins of the cloud providers change. The stand-ins (scripts/pilot_standin.py,
# started by scripts/run_pilot.py) answer in the providers' own REST shapes: the simulated user is
# a goal-driven script, the judges are synthetic, the cloud system cells are qwen2.5:32b, so the
# pilot makes no paid call. A pilot finding may only fix a program or pipeline error; anything
# that would change the method, its prompts or a scenario is recorded for the author.
#
# E3, the model failures. The failures are planned by the scenarios (scenarios/e3_failures.yaml),
# so the pilot takes the smallest subset of these test scenarios that injects every kind of
# failure (error, invalid, crash, freeze, hang) and covers every strategy and both conditions:
# the cancellation with the model down (f_cancel_exact_down) and with its reading broken
# (f_cancel_reply_error), a crash (f_skill_crash), a frozen intelligence (f_intelligence_timeout),
# a hung call answered with the fallback (f_hang_fallback), the fallbacks of grounded answers,
# explanation and questionnaire (f_qa_verify, f_ex_judge, f_qn_map), and two sustained failures,
# also in B (n4_roleplay, n4_procedure). One persona each, in turn (12 dialogues). Test
# scenarios: a finding may only fix a program or pipeline error.
pilot_of: ../e3_failures.yaml
name: e3_failures_pilot
models: {"<local>": qwen2.5:32b}
pairs:
  - [f_cancel_exact_down, cooperative]
  - [f_cancel_reply_error, terse]
  - [f_skill_crash, older_adult]
  - [f_intelligence_timeout, cooperative]
  - [f_hang_fallback, terse]
  - [f_qa_verify, older_adult]
  - [f_ex_judge, cooperative]
  - [f_qn_map, terse]
  - [n4_roleplay, older_adult]
  - [n4_procedure, cooperative]
repetitions: 1
standins: {gemini_base_url: "http://127.0.0.1:8766", openai_base_url: "http://127.0.0.1:8766/v1"}
