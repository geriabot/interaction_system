# E1, the main experiment: the bounded conversation (the method: one Behavior Tree per
# strategy, the LLM asked narrow questions) against the LLM-led conversation (the LLM runs the
# whole strategy with the same rules, scope rules and material: the monolithic ablation), each
# with a small local model and with a large cloud model (a 2x2 design). Same orchestrator,
# speech, silences, turn limit, simulated users and scenarios: only who controls the
# conversation and the model change. The claim it tests: a small local model in the bounded
# conversation matches the large model leading the conversation on task success, and stays in
# the frame of the task and faithful to its material where the LLM-led conversation does not.
#
# English only, so that the experiment can be replicated (decided 2026-10-30: the method does not
# depend on the language, and the Spanish variant was dropped; the transfer to Spanish is observed
# with real users in E4, and the comparison with the LLM-led conversation in English only is a
# limitation stated in the paper). The repetitions are fixed by the power analysis of the pilot,
# before running.
#
# Paid calls (the cloud system model and the simulated user): run_experiment.py --dry-run
# counts them; the run needs --allow-cloud. The conditions of the cloud model need no GPU.
name: e1_bounded_vs_llm_led
scenarios: scenarios/dialogues.yaml
personas_file: personas.yaml
personas: [cooperative, terse, self_correcting, older_adult, non_native,
           mild_cognitive_impairment, uncooperative, boundary_testing]
repetitions: 1
language: English
# The local model (qwen3:8b, thinking off: provisional, for debugging, until E0a chooses the model (one model for every question, no routes)),
# and the large cloud model
# (provider/model: write the dated version of the current large model before running, e.g.
# openai/gpt-...-YYYY-MM-DD; the run refuses an unpinned <pin>)
models: [qwen3:8b, "openai/<pin>"]
conditions:
  # The method: the Behavior Trees with the default parameters (no routes: one model)
  bounded: {}
  llm_led:
    ablation: monolithic
    skill_modules: ["interaction_ablations.skills"]
simulator:
  # A third family, neither the local system's (Qwen) nor the cloud system's (OpenAI). The
  # model version that answered is logged in every turn (user_log[].model_version)
  provider: gemini
  # gemini-2.5-flash-lite: the most faithful user simulator among the Gemini models still served,
  # by Zhou et al. 2026 (COLM, Table 4, User-Sim Index: 69.6, against 62.4 for gemini-3-flash and
  # 61.9 for gemini-2.5-flash). The first choice, gemini-2.0-flash (74.7), is no longer served
  # (checked 2026-10-29); capability does not predict fidelity, so the newer Flash models, not in
  # the table, are not preferred
  model: gemini-2.5-flash-lite
  temperature: 0.7
ollama: {host: 127.0.0.1, port: 11434, timeout: 120.0}
limits: {wait_timeout: 60.0}
# The wait for the model, opened in every condition alike (decided 2026-10-30): the criteria of
# E1 are task success and staying in the frame, not latency, and a cloud model that reasons
# before answering can take many seconds per call; the method asks two or three narrow questions per turn and the
# LLM-led conversation one, so the method's 20 s budget per reply would cut normal turns of the
# method only. No budget per reply or opening (0); a call waits up to 90 s (several times a
# reasoning cloud model's normal call, below the gateway's 120 s so that a call that hangs is
# not asked again; finite, since the gateway's Gemini backend has no limit of its own) and a
# request up to 300 s. Latency is measured with every model answering,
# and reported and compared descriptively, not as a criterion. E0a, E3 and E4 keep the defaults.
model_wait: {reply_budget: 0.0, opening_budget: 0.0, llm_timeout: 90.0, intelligence_timeout: 300.0}
# Only a guard against a stuck dialogue (one that reaches it counts as failed), so it must not end
# a slow but normal one: up to 25 turns of up to three requests to a model that may take tens of
# seconds per call (the default 900 s is 36 s per turn)
dialogue_timeout: 3600
max_turns: 25     # turn limit of every dialogue (the same for every condition)
