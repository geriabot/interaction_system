# The development scenarios of E0a (phase B) in Spanish (Spain): the Spanish version of
# e0a_dev.yaml, with the same ids, the same structure, the same events and the same ground truth.
# Everything the robot or the user says or reads is translated; the slot names, the JSON keys and
# the ids of the goal items stay as they are (they are identifiers), and the canonical values, the
# conditions, the expected frames, the options and the values of the goal items use the Spanish
# values. Like e0a_dev.yaml, they are used only to choose the local model and are disjoint from the
# scenarios of E1-E4 and from the examples of the system's prompts. The keys, the goal items and
# the domains are described at the top of e0a_dev.yaml.

scenarios:

  # ==== Rellenar un formulario (slot filling) ====

  - id: sf_dev_cake
    strategy: slot_filling
    goal:
      task_description: "Tomar nota del encargo de una tarta de celebración"
      dialog_mode: slot_filling
      domain: pastelería
      frame_schema_json: >
        {"slots": [
          {"name": "flavour", "type": "str",
           "canonical_values": ["chocolate", "limón", "zanahoria", "almendra"]},
          {"name": "portions", "type": "int", "minimum": 6, "maximum": 30},
          {"name": "pickup_day", "type": "str", "canonical_values": ["viernes", "sábado", "domingo"]},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      Quieres una tarta para 12 personas y la recogerás el sábado. Te llamas Julia Moreno.
      Cuando te pregunten el sabor, di de limón. Cuando el robot te haga la siguiente pregunta,
      di primero que has cambiado de idea y la quieres de almendra en vez de limón, y luego
      contesta a esa pregunta. Confirma el encargo cuando el robot te lo repita y esté bien; corrígelo si está
      mal.
    goal_items:
      - {id: flavour, value: limón, then: almendra}
      - {id: portions, value: 12}
      - {id: pickup_day, value: sábado}
      - {id: customer_name, value: Julia Moreno}
    expect:
      outcome: success
      frame: {flavour: almendra, portions: 12, pickup_day: sábado, customer_name: Julia Moreno}

  - id: sf_dev_hair
    strategy: slot_filling
    goal:
      task_description: "Dar una cita en la peluquería"
      dialog_mode: slot_filling
      domain: peluquería
      frame_schema_json: >
        {"slots": [
          {"name": "service", "type": "str",
           "canonical_values": ["corte", "tinte", "lavar y secar", "arreglo de barba"]},
          {"name": "day", "type": "str",
           "canonical_values": ["martes", "miércoles", "jueves", "viernes", "sábado"]},
          {"name": "hour", "type": "int", "minimum": 9, "maximum": 19},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      Quieres cita para cortarte el pelo el miércoles a las 11 de la mañana. Te llamas Andrés
      Gil. Confirma cuando el robot te lo repita y esté bien; corrígelo si está mal. Si el robot
      te pregunta si quieres dejarlo, di que no y sigue con la cita.
    goal_items:
      - {id: service, value: corte}
      - {id: day, value: miércoles}
      - {id: hour, value: 11}
      - {id: customer_name, value: Andrés Gil}
    expect:
      outcome: success
      frame: {service: corte, day: miércoles, hour: 11, customer_name: Andrés Gil}
    events:
      - {turn: 2, kind: cancel, text: "Espera, para."}
      - {turn: 3, kind: text, text: "No, no, sigamos con la cita."}

  - id: sf_dev_plumber
    strategy: slot_filling
    goal:
      task_description: "Pedir una visita del fontanero"
      dialog_mode: slot_filling
      domain: fontanería
      frame_schema_json: >
        {"slots": [
          {"name": "problem", "type": "str",
           "canonical_values": ["fuga de agua", "atasco", "sin agua caliente"]},
          {"name": "leak_place", "type": "str", "canonical_values": ["baño", "techo", "pared"],
           "condition_slot": "problem", "condition_value": "fuga de agua"},
          {"name": "urgent", "type": "bool"},
          {"name": "contact_name", "type": "str"}]}
    user_goal: >
      Tienes una fuga de agua: cae agua del techo. Es urgente. Te llamas Elena Sanz. Confirma
      cuando el robot te lo repita y esté bien; corrígelo si está mal.
    goal_items:
      - {id: problem, value: fuga de agua}
      - {id: leak_place, value: techo}
      - {id: urgent, value: "sí"}
      - {id: contact_name, value: Elena Sanz}
    expect:
      outcome: success
      frame: {problem: fuga de agua, leak_place: techo, urgent: true, contact_name: Elena Sanz}

  # ==== Explicación (cada una con un error de comprensión previsto, que se corrige) ====

  - id: ex_dev_laundrette
    strategy: explanation
    goal:
      task_description: "Explicar cómo lavar un edredón en la lavandería de autoservicio"
      dialog_mode: explanation
      domain: lavandería
      resources_json: >
        [{"name": "instrucciones", "description": "cómo usar la lavandería",
          "content": "Los edredones y las mantas van en las lavadoras grandes, la 4 y la 5. Se paga en la máquina central: elige el número de tu lavadora y mete 5 euros. La ropa de color se lava a 40 grados. Cuando termine el lavado, deja la puerta abierta para que se seque el tambor."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"Los edredones y las mantas van en las lavadoras grandes, la 4 y la 5\", \"Se paga en la máquina central: elegir el número de la lavadora y meter 5 euros\", \"La ropa de color se lava a 40 grados\", {\"point\": \"Dejar la puerta abierta al terminar el lavado\", \"critical\": false}]}"}]
    user_goal: >
      Quieres lavar un edredón de color. Escucha las instrucciones y pregunta una vez cuánto
      cuesta un lavado. Cuando el robot te pida que lo cuentes con tus palabras, cuéntalo todo
      bien menos la temperatura: crees que la ropa de color se lava a 60 grados. Cuando te
      corrija, cuéntalo bien.
    goal_items:
      - {id: question_price, value: cuánto cuesta un lavado}
      - {id: machines, value: "el edredón va en las lavadoras grandes, la 4 o la 5"}
      - {id: payment, value: se pagan 5 euros en la máquina central eligiendo el número de lavadora}
      - {id: temperature, value: la ropa de color a 60 grados, then: la ropa de color a 40 grados}
    expect:
      outcome: success
      understood: true

  - id: ex_dev_campsite
    strategy: explanation
    goal:
      task_description: "Explicar las normas del camping a un cliente que acaba de llegar"
      dialog_mode: explanation
      domain: camping
      resources_json: >
        [{"name": "normas", "description": "normas del camping",
          "content": "El horario de silencio es de 11 de la noche a 8 de la mañana. Las barbacoas solo se permiten en la zona de barbacoas que hay junto a la recepción. No se pueden hacer hogueras en ninguna parte del camping. Las duchas funcionan con fichas que se venden en recepción."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"El horario de silencio es de 11 de la noche a 8 de la mañana\", \"Barbacoas solo en la zona de barbacoas junto a la recepción\", \"No se pueden hacer hogueras en ninguna parte del camping\", {\"point\": \"Las fichas de las duchas se venden en recepción\", \"critical\": false}]}"}]
    user_goal: >
      Acabas de llegar al camping. La primera vez que el robot te explique las normas, di que no
      te has quedado con el horario de silencio. Cuando el robot te pida que le cuentes las
      normas, cuéntalas todas bien menos el horario de silencio: crees que empieza a medianoche.
      Cuando te corrija, cuéntalas bien.
    goal_items:
      - {id: clarification, value: no te has quedado con el horario de silencio}
      - {id: quiet_hours, value: silencio de medianoche a 8 de la mañana, then: silencio de 11 de la noche a 8 de la mañana}
      - {id: barbecues, value: barbacoas solo en la zona junto a la recepción}
      - {id: campfires, value: no se pueden hacer hogueras en ninguna parte}
    expect:
      outcome: success
      understood: true

  - id: ex_dev_beach_flags
    strategy: explanation
    goal:
      task_description: "Explicar qué significan las banderas de los socorristas en la playa"
      dialog_mode: explanation
      domain: playa
      resources_json: >
        [{"name": "banderas", "description": "banderas de los socorristas",
          "content": "La bandera verde significa que el baño está permitido. La bandera amarilla significa que puedes bañarte con precaución, sin alejarte de la orilla. La bandera roja significa que está prohibido bañarse. La bandera morada significa que hay medusas en el agua."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"Bandera verde: el baño está permitido\", \"Bandera amarilla: bañarse con precaución, cerca de la orilla\", \"Bandera roja: está prohibido bañarse\", {\"point\": \"Bandera morada: hay medusas en el agua\", \"critical\": false}]}"}]
    user_goal: >
      Estás en la playa con tus nietos. Escucha la explicación. Cuando el robot te pida que se lo
      cuentes, cuéntalo todo bien menos la bandera amarilla: crees que significa que está
      prohibido bañarse. Cuando te corrija, di bien lo de la bandera amarilla.
    goal_items:
      - {id: green, value: "bandera verde: se puede bañar"}
      - {id: yellow, value: "bandera amarilla: está prohibido bañarse", then: "bandera amarilla: bañarse con precaución, cerca de la orilla"}
      - {id: red, value: "bandera roja: está prohibido bañarse"}
    expect:
      outcome: success
      understood: true

  # ==== Juego de preguntas (quiz) ====

  - id: qz_dev_planets
    strategy: quiz
    goal:
      task_description: "Un pequeño juego de preguntas sobre los planetas"
      dialog_mode: quiz
      domain: club de astronomía
      resources_json: >
        [{"name": "preguntas", "description": "banco de preguntas",
          "content": "[{\"question\": \"¿Qué planeta está más cerca del Sol?\", \"answer\": \"Mercurio\"}, {\"question\": \"¿Cuántas lunas tiene Marte?\", \"answer\": \"2\"}, {\"question\": \"¿Qué planeta es famoso por sus grandes anillos?\", \"answer\": \"Saturno\"}]"}]
    user_goal: >
      Estás haciendo un juego de preguntas. Responde bien a la primera pregunta (Mercurio), mal a
      la segunda (di que tiene una luna) y bien a la tercera (Saturno).
    goal_items:
      - {id: q1, value: Mercurio}
      - {id: q2, value: una}
      - {id: q3, value: Saturno}
    expect:
      outcome: success
      quiz_correct: [true, false, true]

  - id: qz_dev_road
    strategy: quiz
    goal:
      task_description: "Un juego de preguntas de educación vial"
      dialog_mode: quiz
      domain: clase de educación vial
      resources_json: >
        [{"name": "preguntas", "description": "banco de preguntas",
          "content": "[{\"question\": \"¿De qué color es la señal de stop?\", \"answer\": \"Roja\"}, {\"question\": \"¿Qué forma tiene la señal de ceda el paso?\", \"answer\": \"Un triángulo invertido\"}, {\"question\": \"¿Por qué lado de la carretera se conduce en el Reino Unido?\", \"answer\": \"Por la izquierda\"}]"}]
    user_goal: >
      Responde mal a la primera pregunta (di amarilla), bien a la segunda con tus palabras (un
      triángulo con la punta hacia abajo) y bien a la tercera (por la izquierda).
    goal_items:
      - {id: q1, value: amarilla}
      - {id: q2, value: un triángulo con la punta hacia abajo}
      - {id: q3, value: por la izquierda}
    expect:
      outcome: success
      quiz_correct: [false, true, true]
    events:
      - {turn: 2, kind: silence}

  - id: qz_dev_calendar
    strategy: quiz
    goal:
      task_description: "Un juego de preguntas sobre el calendario y la hora"
      dialog_mode: quiz
      resources_json: >
        [{"name": "preguntas", "description": "banco de preguntas",
          "content": "[{\"question\": \"¿Cuántos días tiene un año bisiesto?\", \"answer\": \"366\"}, {\"question\": \"¿Qué mes tiene menos días?\", \"answer\": \"Febrero\"}, {\"question\": \"¿Cuántas horas hay en dos días?\", \"answer\": \"48\"}]"}]
    user_goal: >
      Responde bien a la primera pregunta (366), bien a la segunda (febrero) y mal a la tercera
      (di cuarenta).
    goal_items:
      - {id: q1, value: "366"}
      - {id: q2, value: febrero}
      - {id: q3, value: cuarenta}
    expect:
      outcome: success
      quiz_correct: [true, true, false]
    events:
      - {turn: 2, kind: text, text: "Perdona, ¿me puedes repetir la pregunta?"}

  # ==== Procedimiento ====

  - id: pr_dev_lamp
    strategy: procedure
    goal:
      task_description: "Guiar al usuario para cambiar la bombilla de una lámpara de mesa"
      dialog_mode: procedure
      domain: arreglos en casa
      resources_json: >
        [{"name": "pasos", "description": "cambiar una bombilla",
          "content": "[\"Apaga la lámpara y desenchúfala\", {\"step\": \"Espera a que la bombilla vieja se enfríe\", \"duration_s\": 90}, \"Desenrosca la bombilla vieja en sentido contrario a las agujas del reloj\", {\"step\": \"Enrosca la bombilla nueva en el sentido de las agujas del reloj hasta que quede firme\", \"check\": \"la bombilla no se mueve\"}, \"Enchufa la lámpara y enciéndela\"]"}]
    user_goal: >
      Estás cambiando la bombilla de tu lámpara de mesa. Haz cada paso y di cuándo lo has hecho.
      Cuando el robot te diga que esperes a que se enfríe la bombilla, espera hasta que vuelva a
      hablarte y entonces di que ya está fría.
    goal_items:
      - {id: step_1, value: hecho}
      - {id: step_2, value: la bombilla ya está fría}
      - {id: step_3, value: hecho}
      - {id: step_4, value: hecho}
      - {id: step_5, value: hecho}
    expect:
      outcome: success
      step_status: [done, done, done, done, done]
    # 90 s: the grace of the step's duration is exercised (see e0a_dev.yaml)
    events:
      - {turn: 2, kind: silence}

  - id: pr_dev_button
    strategy: procedure
    goal:
      task_description: "Guiar al usuario para coser un botón de una camisa"
      dialog_mode: procedure
      domain: costura
      resources_json: >
        [{"name": "pasos", "description": "coser un botón",
          "content": "[\"Enhebra la aguja y haz un nudo al final del hilo\", \"Pasa la aguja de abajo arriba por la tela y por un agujero del botón\", \"Pasa la aguja de arriba abajo por el agujero de enfrente\", \"Enrolla el hilo tres veces alrededor de las puntadas, por debajo del botón\", \"Haz un nudo por el revés de la tela y corta el hilo\"]"}]
    user_goal: >
      Estás cosiendo un botón que se le ha caído a tu camisa. Haz cada paso y di cuándo lo has
      hecho. En el cuarto paso, di que no consigues enrollar el hilo por debajo del botón, tres
      veces seguidas (incluso después de la ayuda). Luego sigue con el último paso y termina.
    goal_items:
      - {id: step_1, value: hecho}
      - {id: step_2, value: hecho}
      - {id: step_3, value: hecho}
      - {id: step_4, value: no consigues enrollar el hilo por debajo del botón (tres veces)}
      - {id: step_5, value: hecho}
    expect:
      outcome: success
      step_status: [done, done, done, stuck, done]

  - id: pr_dev_boat
    strategy: procedure
    goal:
      task_description: "Guiar al usuario para hacer un barco de papel"
      dialog_mode: procedure
      domain: manualidades
      resources_json: >
        [{"name": "pasos", "description": "barco de papel",
          "content": "[\"Dobla la hoja de papel por la mitad, de arriba abajo\", \"Dobla las dos esquinas de arriba hacia la línea del centro\", \"Dobla hacia arriba las tiras de abajo, por los dos lados, para hacer un gorro de papel\", \"Separa con cuidado los dos lados del gorro para abrir el barco\", {\"step\": \"Decora el barco con rotuladores de colores\", \"optional\": true}]"}]
    user_goal: >
      Estás haciendo un barco de papel. Haz cada paso y di cuándo lo has hecho. No quieres
      decorarlo: cuando llegue el último paso, di que te lo quieres saltar.
    goal_items:
      - {id: step_1, value: hecho}
      - {id: step_2, value: hecho}
      - {id: step_3, value: hecho}
      - {id: step_4, value: hecho}
      - {id: step_5, value: te lo quieres saltar}
    expect:
      outcome: success
      step_status: [done, done, done, done, skipped]
    events:
      - {turn: 2, kind: text, text: "Perdona, ¿me lo puedes repetir?"}

  # ==== Juego de rol ====

  - id: rp_dev_neighbour
    strategy: roleplay
    goal:
      task_description: "Practicar cómo pedirle a un vecino que baje la televisión por la noche"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "escena", "description": "escena del juego de rol",
          "content": "{\"scenario\": \"Llamas a la puerta del vecino de arriba, que tiene la televisión muy alta por la noche\", \"role\": \"El vecino: al principio un poco a la defensiva, pero razonable\", \"user_goal\": \"Ponerse de acuerdo para tener noches más tranquilas\", \"criteria\": [\"Explica el problema con calma\", \"Propone una solución\"], \"max_exchanges\": 6}"}]
    user_goal: >
      Vives debajo de un vecino que tiene la televisión muy alta pasada la medianoche, y no
      puedes dormir. Explica el problema con calma y con educación, pero no propongas nunca una solución
      ni un acuerdo: limítate a repetir que el ruido es un problema y espera a que el vecino
      proponga algo. Sigue hasta que el robot dé por terminada la práctica.
    goal_items:
      - {id: problem, value: la televisión muy alta pasada la medianoche}
      - {id: effect, value: no puedes dormir}
    expect:
      outcome: success
      criteria: ["Explica el problema con calma", "Propone una solución"]
      weak_criterion: "Propone una solución"

  - id: rp_dev_mechanic
    strategy: roleplay
    goal:
      task_description: "Practicar cómo dejar el coche en el taller para que lo arreglen"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "escena", "description": "escena del juego de rol",
          "content": "{\"scenario\": \"Un taller de coches un lunes por la mañana\", \"role\": \"El mecánico: con mucho trabajo, responde con pocas palabras\", \"user_goal\": \"Dejar el coche para que lo arreglen\", \"criteria\": [\"Describe el problema\", \"Pregunta el precio\", \"Pregunta cuándo estará listo el coche\"], \"max_exchanges\": 6}"}]
    user_goal: >
      Desde la semana pasada, tu coche hace un ruido como de roce metálico al frenar. Describe el
      problema con claridad y pregunta cuánto costará el arreglo, pero no preguntes nunca cuándo
      estará listo el coche: si el mecánico lo menciona, di solo «vale». A mitad de la práctica,
      pide ayuda al robot una vez («¿qué digo ahora?») y luego sigue hasta el final.
    goal_items:
      - {id: problem, value: un ruido de roce metálico al frenar}
      - {id: since, value: desde la semana pasada}
      - {id: price, value: preguntas cuánto costará el arreglo}
      - {id: help, value: pides ayuda una vez}
    expect:
      outcome: success
      criteria: ["Describe el problema", "Pregunta el precio", "Pregunta cuándo estará listo el coche"]
      weak_criterion: "Pregunta cuándo estará listo el coche"

  - id: rp_dev_market
    strategy: roleplay
    goal:
      task_description: "Practicar cómo comprar algo en un mercadillo"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "escena", "description": "escena del juego de rol",
          "content": "{\"scenario\": \"Un puesto de un mercadillo un domingo por la mañana\", \"role\": \"El vendedor de una silla antigua de madera: simpático, pide 40 euros pero está dispuesto a bajar el precio\", \"user_goal\": \"Comprar la silla más barata\", \"criteria\": [\"Saluda al vendedor\", \"Hace una contraoferta\", \"Cierra el trato con educación\"], \"max_exchanges\": 6}"}]
    user_goal: >
      Te gusta una silla antigua de madera. Saluda al vendedor y pregúntale el precio. No regatees:
      acepta enseguida el primer precio, sin ninguna contraoferta, y cierra el trato con
      educación. Después de tres respuestas tuyas, di que te gustaría dejar ya la práctica.
    goal_items:
      - {id: greeting, value: saludas al vendedor}
      - {id: price, value: preguntas el precio de la silla}
      - {id: accept, value: aceptas el primer precio}
      - {id: stop, value: te gustaría dejar la práctica}
    expect:
      outcome: success
      criteria: ["Saluda al vendedor", "Hace una contraoferta", "Cierra el trato con educación"]
      weak_criterion: "Hace una contraoferta"

  # ==== Preguntas sobre un material (grounded QA) ====

  - id: qa_dev_theatre
    strategy: grounded_qa
    goal:
      task_description: Responder a las preguntas del público en el vestíbulo del teatro
      dialog_mode: grounded_qa
      domain: teatro
      resources_json: '[{"name": "information", "description": "what the robot may answer from", "content":
        "La obra El guardián del faro se representa de jueves a domingo a las 20:00, con una función más
        los domingos a las 17:00. Las entradas cuestan 18 euros en el patio de butacas y 12 euros en el
        anfiteatro. El descanso dura 20 minutos. Los abrigos se pueden dejar gratis en el guardarropa."},
        {"name": "handover", "description": "who can help", "content": "Los acomodadores pueden ayudarte
        con eso."}]'
    user_goal: Vas al teatro. Pregunta a qué hora empieza la obra el domingo por la tarde. Después pregunta
      si los actores firman autógrafos al terminar la función. Después pregúntale al robot de qué equipo
      de fútbol es. Después di que no tienes más preguntas.
    goal_items:
      - {id: q1, value: la hora de la función del domingo por la tarde}
      - {id: q2, value: autógrafos de los actores al terminar la función}
      - {id: q3, value: el equipo de fútbol del robot}
    expect:
      outcome: success
      qa_resolutions:
      - answered
      - abstained
      - declined
      # The key facts each answered question must state (score_runs.py; null: not answered)
      qa_facts:
      - ["17:00"]
      - null
      - null

  - id: qa_dev_ski
    strategy: grounded_qa
    goal:
      task_description: Responder a las preguntas de los esquiadores en la estación de esquí
      dialog_mode: grounded_qa
      domain: estación de esquí
      resources_json: '[{"name": "information", "description": "what the robot may answer from", "content":
        "Los remontes abren todos los días de 9:00 a 16:30. El forfait de un día cuesta 45 euros para adultos
        y 30 euros para menores de 12 años. La escuela de esquí admite niños a partir de 4 años. Los esquís
        y las botas se alquilan en la tienda que hay junto al remonte principal."}, {"name": "handover",
        "description": "who can help", "content": "El personal de venta de forfaits puede ayudarte con
        eso."}]'
    user_goal: Primero pregúntale al robot si deberías invertir tus ahorros en acciones. Después pregunta
      cuánto cuesta el forfait de un día para un niño de ocho años y, cuando el robot te responda, pídele
      que te repita la respuesta. Después pregunta si hay un puesto de primeros auxilios en las pistas.
      Después di que no tienes más preguntas.
    goal_items:
      - {id: q1, value: invertir tus ahorros en acciones}
      - {id: q2, value: el precio del forfait de un día para un niño de ocho años}
