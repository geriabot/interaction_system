# The dialogue scenarios in Spanish (Spain): the Spanish version of dialogues.yaml, with the same
# ids, the same structure and the same ground truth. No simulated experiment runs this file since
# 2026-10-30 (E1 runs in English only: the method does not depend on the language). It is the
# source of the study with real users, which is run in Spanish: the scenarios of E4
# (e4_es.yaml, the real sessions and their simulated twin) are taken from it; and it serves the
# Spanish smoke check (scripts/sim_checks.py --language es), the test panel (its Spanish examples,
# scripts/test_panel_examples.yaml) and the tests of the scenarios. Everything the robot or the user says or reads is translated;
# the slot names and the JSON keys stay as they are (they are identifiers), and the canonical
# values, the conditions and the expected frames use the Spanish values.
#
# Each scenario has the request the robot's behavior sends (goal: the DialogTask fields), what
# the simulated user wants (user_goal, written to the user in the second person), and the ground
# truth that scores the run (expect):
#   outcome         success | cancelled | failed
#   frame           slot filling: the final frame (values compared case-insensitively)
#   quiz_correct    quiz: whether each answer of the user is correct, in order
#   step_status     procedure: done | skipped | stuck for each step, in order
#   criteria        roleplay: every criterion must be scored
#   weak_criterion  roleplay: the criterion the simulated user fails on purpose (its user_goal
#                   says how); its score must be the lowest
#   understood      explanation: the user ends up understanding, verified by teach-back: every
#                   critical key point (the "puntos clave" resource) said back correctly
#   qa_resolutions  grounded_qa: the resolution of each question the simulated user asks, in order
#                   (answered: in the material; abstained: within the task, not in the material;
#                   declined: outside the task)
#   answers         questionnaire: the option the simulated user chooses for each item, in order
#                   (null: the user declines the item); every item must also be read word for word
#   score           questionnaire: the score the code computes from those answers by the rule
#                   of the instrument (sum or mean, reversed items, the values of the options;
#                   declined items left out), compared as score_ok

scenarios:

  - id: sf_coffee
    strategy: slot_filling
    goal:
      task_description: "Tomar nota de un pedido en la cafetería: la bebida, el tamaño y el nombre del cliente"
      dialog_mode: slot_filling
      domain: cafetería
      frame_schema_json: >
        {"slots": [
          {"name": "drink", "type": "str",
           "canonical_values": ["café solo", "café con leche", "capuchino", "americano", "té"]},
          {"name": "size", "type": "str", "canonical_values": ["pequeño", "mediano", "grande"]},
          {"name": "milk", "type": "str", "canonical_values": ["entera", "desnatada", "avena", "soja"],
           "condition_slot": "drink", "condition_value": "café con leche"},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      Quieres un café con leche mediano, con leche de avena. Te llamas Laura. Confirma el pedido
      cuando el robot te lo repita y esté bien; corrígelo si está mal.
    expect:
      outcome: success
      frame: {drink: café con leche, size: mediano, milk: avena, customer_name: Laura}

  - id: sf_clinic
    strategy: slot_filling
    goal:
      task_description: "Registrar a un paciente para una cita de fisioterapia"
      dialog_mode: slot_filling
      domain: centro de salud
      frame_schema_json: >
        {"slots": [
          {"name": "full_name", "type": "str"},
          {"name": "age", "type": "int", "minimum": 18, "maximum": 110},
          {"name": "pain_area", "type": "str",
           "canonical_values": ["espalda", "cuello", "hombro", "rodilla", "cadera", "otra"]},
          {"name": "preferred_day", "type": "str",
           "canonical_values": ["lunes", "martes", "miércoles", "jueves", "viernes"]}]}
    user_goal: >
      Eres Pedro Ruiz y tienes 72 años. Te duele la rodilla. Prefieres el jueves. Confirma los
      datos cuando el robot te los repita y estén bien; corrígelos si están mal.
    expect:
      outcome: success
      frame: {full_name: Pedro Ruiz, age: 72, pain_area: rodilla, preferred_day: jueves}

  - id: ex_fasting
    strategy: explanation
    goal:
      task_description: "Explicar las instrucciones de ayuno antes de la operación de mañana"
      dialog_mode: explanation
      domain: hospital
      resources_json: >
        [{"name": "ayuno", "description": "protocolo de ayuno",
          "content": "No comas nada sólido a partir de las doce de la noche. Puedes beber agua sola hasta las 6 de la mañana. Tómate la pastilla de la tensión de siempre a las 6 de la mañana con un sorbo de agua. Nada de chicles ni caramelos."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"No comer nada sólido a partir de las doce de la noche\", \"Se puede beber agua sola hasta las 6 de la mañana\", \"La pastilla de la tensión a las 6 de la mañana con un sorbo de agua\", {\"point\": \"Nada de chicles ni caramelos\", \"critical\": false}]}"}]
    user_goal: >
      Mañana te operan. Escucha las instrucciones. Pregunta una vez si puedes tomarte la pastilla
      de la tensión. Cuando el robot te pida que lo cuentes con tus palabras, dilo todo bien
      excepto el agua: crees que puedes beber agua hasta las 8 de la mañana. Cuando te corrija,
      repítelo bien.
    expect:
      outcome: success
      understood: true

  - id: ex_bus
    strategy: explanation
    goal:
      task_description: "Explicar cómo ir en autobús desde la residencia hasta el centro de día"
      dialog_mode: explanation
      domain: residencia de mayores
      resources_json: >
        [{"name": "ruta", "description": "ruta del autobús",
          "content": "Coge el autobús 23 en la parada que hay delante de la residencia. Bájate en la cuarta parada, Plaza Mayor. El centro de día es el edificio de la puerta verde, a 50 metros a la izquierda."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"Coger el autobús 23 en la parada de delante de la residencia\", \"Bajarse en la cuarta parada, Plaza Mayor\", \"El centro de día es el edificio de la puerta verde, a 50 metros a la izquierda\"]}"}]
    user_goal: >
      Tienes que ir al centro de día. La primera vez que el robot te lo explique, di que no has
      entendido bien en qué parada bajarte. Cuando te lo explique de nuevo y te pida que lo
      cuentes, dilo todo bien.
    expect:
      outcome: success
      understood: true

  - id: qz_geography
    strategy: quiz
    goal:
      task_description: "Hacer un pequeño juego de preguntas de geografía"
      dialog_mode: quiz
      resources_json: >
        [{"name": "preguntas", "description": "banco de preguntas",
          "content": "[{\"question\": \"¿Cuál es la capital de Italia?\", \"answer\": \"Roma\"}, {\"question\": \"¿Cuál es el río más largo de África?\", \"answer\": \"El Nilo\"}, {\"question\": \"¿En qué continente está Perú?\", \"answer\": \"América del Sur\"}]"}]
    user_goal: >
      Estás haciendo un juego de preguntas. Responde bien a la primera pregunta (Roma), mal a la
      segunda (di el Congo) y bien a la tercera, pero con tus propias palabras (está en
      Sudamérica).
    expect:
      outcome: success
      quiz_correct: [true, false, true]

  - id: qz_memory
    strategy: quiz
    goal:
      task_description: "Un ejercicio de memoria sobre la actividad de esta mañana"
      dialog_mode: quiz
      domain: centro de día
      resources_json: >
        [{"name": "preguntas", "description": "banco de preguntas",
          "content": "[{\"question\": \"¿Qué hemos plantado esta mañana?\", \"answer\": \"tomates\"}, {\"question\": \"¿Cuántas macetas hemos usado?\", \"answer\": \"6\"}, {\"question\": \"¿De qué color eran los guantes?\", \"answer\": \"amarillos\"}]"}]
    user_goal: >
      Esta mañana has participado en la actividad de jardinería: habéis plantado tomates, en seis
      macetas, con guantes amarillos. Responde bien a la primera pregunta, mal a la segunda (di
      ocho macetas) y bien a la tercera.
    expect:
      outcome: success
      quiz_correct: [true, false, true]

  - id: pr_shoulder
    strategy: procedure
    goal:
      task_description: "Guiar un calentamiento corto de hombros"
      dialog_mode: procedure
      domain: fisioterapia
      resources_json: >
        [{"name": "pasos", "description": "pasos del calentamiento",
          "content": "[\"Siéntate recto con los pies bien apoyados en el suelo\", {\"step\": \"Haz cinco círculos lentos con los hombros hacia atrás\", \"check\": \"sin dolor\"}, \"Levanta los dos brazos hasta la altura de los hombros y aguanta cinco segundos\", \"Baja los brazos despacio y suelta el aire\"]"}]
    user_goal: >
      Vas a hacer el ejercicio. Haz cada paso y di cuándo lo has hecho. En el tercer paso, di que
      te duele un poco al levantar los brazos; después de la ayuda del robot, hazlo y di que ya
      está.
    expect:
      outcome: success
      step_status: [done, done, done, done]

  - id: pr_tea
    strategy: procedure
    goal:
      task_description: "Guiar al usuario para preparar una taza de té"
      dialog_mode: procedure
      domain: cocina
      resources_json: >
        [{"name": "pasos", "description": "receta",
          "content": "[\"Llena el hervidor de agua y enciéndelo\", \"Pon una bolsita de té en la taza\", \"Echa el agua caliente en la taza\", \"Espera tres minutos y saca la bolsita\", \"Añade leche o azúcar si quieres\"]"}]
    user_goal: >
      Estás preparando un té. Haz cada paso y di cuándo lo has hecho. Tú no tomas el té con leche
      ni con azúcar: cuando llegue el último paso, di que te lo quieres saltar.
    expect:
      outcome: success
      step_status: [done, done, done, done, skipped]

  - id: rp_interview
    strategy: roleplay
    goal:
      task_description: "Practicar una entrevista de trabajo"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "escena", "description": "escena del juego de rol",
          "content": "{\"scenario\": \"Entrevista para un puesto de dependiente en una librería\", \"role\": \"El encargado de la librería: amable, pero pide ejemplos concretos\", \"user_goal\": \"Conseguir el trabajo\", \"criteria\": [\"Responde con claridad\", \"Da ejemplos concretos\", \"Muestra motivación\"], \"max_exchanges\": 6}"}]
    user_goal: >
      Estás practicando una entrevista de trabajo para una librería. Responde como alguien a quien
      le encantan los libros y que ha trabajado dos veranos en un supermercado. Responde con
      claridad y muestra que quieres el trabajo, pero no des nunca un ejemplo concreto: responde
      siempre en general ("se me da bien la gente"), aunque te lo pidan. Sigue hasta que el robot
      dé por terminada la práctica.
    expect:
      outcome: success
      criteria: ["Responde con claridad", "Da ejemplos concretos", "Muestra motivación"]
      weak_criterion: "Da ejemplos concretos"

  - id: rp_doctor
    strategy: roleplay
    goal:
      task_description: "Practicar cómo explicarle tus síntomas al médico"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "escena", "description": "escena del juego de rol",
          "content": "{\"scenario\": \"Una consulta con el médico de cabecera\", \"role\": \"El médico: paciente, hace las preguntas de una en una\", \"criteria\": [\"Describe los síntomas\", \"Responde a las preguntas\"], \"max_exchanges\": 6}"}]
    user_goal: >
      Estás practicando una visita al médico. Llevas tres días con dolor de garganta y un poco de
      fiebre. Describe bien los síntomas, pero no respondas a las preguntas del médico: cuando te
      pregunte algo, habla de otra cosa. Después de tres de tus respuestas, di que te gustaría
      dejar ya la práctica.
    expect:
      outcome: success
      criteria: ["Describe los síntomas", "Responde a las preguntas"]
      weak_criterion: "Responde a las preguntas"

  # ==== E1: more slot filling ====

  - id: sf_pizza
    strategy: slot_filling
    goal:
      task_description: "Tomar nota de un pedido de pizza a domicilio o para recoger"
      dialog_mode: slot_filling
      domain: pizzería
      frame_schema_json: >
        {"slots": [
          {"name": "size", "type": "str", "canonical_values": ["pequeña", "mediana", "grande"]},
          {"name": "toppings", "type": "list_str",
           "canonical_values": ["queso", "jamón", "champiñones", "aceitunas", "pepperoni", "cebolla"]},
          {"name": "delivery", "type": "bool"},
          {"name": "address", "type": "str", "condition_slot": "delivery", "condition_value": "true"}]}
    user_goal: >
      Quieres una pizza grande con champiñones y aceitunas, a domicilio, en la Calle Mayor 5.
      Confirma cuando el robot te repita el pedido y esté bien; corrígelo si está mal.
    expect:
      outcome: success
      frame: {size: grande, toppings: [champiñones, aceitunas], delivery: true, address: Calle Mayor 5}

  - id: sf_taxi
    strategy: slot_filling
    goal:
      task_description: "Pedir un taxi para un residente de la residencia de mayores"
      dialog_mode: slot_filling
      domain: recepción de la residencia
      frame_schema_json: >
        {"slots": [
          {"name": "destination", "type": "str",
           "canonical_values": ["hospital", "estación de tren", "aeropuerto", "centro"]},
          {"name": "hour", "type": "int", "minimum": 7, "maximum": 22},
          {"name": "passengers", "type": "int", "minimum": 1, "maximum": 4},
          {"name": "wheelchair", "type": "bool"}]}
    user_goal: >
      Necesitas un taxi al hospital a las 17:00 (las cinco de la tarde) para dos personas, y una
      de las dos va en silla de ruedas. Confirma cuando el robot te lo repita y esté bien.
    expect:
      outcome: success
      frame: {destination: hospital, hour: 17, passengers: 2, wheelchair: true}

  - id: sf_meal
    strategy: slot_filling
    goal:
      task_description: "Preguntar a un residente qué quiere para comer mañana"
      dialog_mode: slot_filling
      domain: residencia de mayores
      frame_schema_json: >
        {"slots": [
          {"name": "main_course", "type": "str", "canonical_values": ["pescado", "pollo", "lasaña de verduras"]},
          {"name": "side", "type": "str", "canonical_values": ["arroz", "ensalada", "patatas"]},
          {"name": "dessert", "type": "str", "canonical_values": ["fruta", "yogur", "sin postre"]},
          {"name": "allergies", "type": "bool"},
          {"name": "allergy_detail", "type": "str", "condition_slot": "allergies", "condition_value": "true"}]}
    user_goal: >
      Para la comida de mañana quieres pollo con ensalada y fruta de postre. No tienes ninguna
      alergia alimentaria. Confirma cuando el robot te lo repita y esté bien.
    expect:
      outcome: success
      frame: {main_course: pollo, side: ensalada, dessert: fruta, allergies: false}

  - id: sf_library
    strategy: slot_filling
    goal:
      task_description: "Dar de alta a un nuevo socio de la biblioteca municipal"
      dialog_mode: slot_filling
      domain: biblioteca
      frame_schema_json: >
        {"slots": [
          {"name": "full_name", "type": "str"},
          {"name": "age", "type": "int", "minimum": 6, "maximum": 110},
          {"name": "card_type", "type": "str", "canonical_values": ["infantil", "adulto", "mayores"]},
          {"name": "newsletter", "type": "bool"}]}
    user_goal: >
      Eres Carmen Vidal, tienes 70 años y quieres el carné de mayores. No quieres recibir el
      boletín informativo. Cuando te pregunten la edad, di 17 por error. Cuando el robot te haga la
      siguiente pregunta, di primero que te has equivocado y que tienes 70, y luego contesta a esa
      pregunta. Confirma cuando el robot te lo repita y esté bien.
    expect:
      outcome: success
      frame: {full_name: Carmen Vidal, age: 70, card_type: mayores, newsletter: false}

  - id: sf_survey
    strategy: slot_filling
    goal:
      task_description: "Preguntar a un visitante si está satisfecho con la actividad de hoy"
      dialog_mode: slot_filling
      domain: centro de día
      frame_schema_json: >
        {"slots": [
          {"name": "activity", "type": "str", "canonical_values": ["música", "jardinería", "gimnasia", "cine"]},
          {"name": "satisfaction", "type": "int", "minimum": 1, "maximum": 5},
          {"name": "would_repeat", "type": "bool"}]}
    user_goal: >
      Hoy has hecho la actividad de jardinería. Le pones un 4 sobre 5 y la repetirías. Confirma
      cuando el robot te lo repita y esté bien.
    expect:
      outcome: success
      frame: {activity: jardinería, satisfaction: 4, would_repeat: true}

  - id: sf_visit
    strategy: slot_filling
    goal:
      task_description: "Concertar la visita de un familiar a un residente"
      dialog_mode: slot_filling
      domain: residencia de mayores
      frame_schema_json: >
        {"slots": [
          {"name": "resident_name", "type": "str"},
          {"name": "day", "type": "str", "canonical_values": ["sábado", "domingo"]},
          {"name": "visitors", "type": "int", "minimum": 1, "maximum": 3},
          {"name": "bring_pet", "type": "bool"}]}
    user_goal: >
      Quieres visitar a tu madre, Rosa Martín, el domingo con tu marido (dos visitantes), sin
      mascotas. Si el robot dice algo que tú no has dicho, corrígelo. Confirma cuando esté bien.
    expect:
      outcome: success
      frame: {resident_name: Rosa Martín, day: domingo, visitors: 2, bring_pet: false}

  # ==== E1: more explanations ====

  - id: ex_pills
    strategy: explanation
    goal:
      task_description: "Explicar el nuevo horario de la medicación"
      dialog_mode: explanation
      domain: residencia de mayores
      resources_json: >
        [{"name": "horario", "description": "medicación",
          "content": "La pastilla blanca (enalapril) se toma a las 8 de la mañana con el desayuno. La pastilla amarilla (omeprazol) se toma a las 8 de la mañana, antes del desayuno, en ayunas. La pastilla azul pequeña (simvastatina) se toma a las 10 de la noche."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"La pastilla blanca (enalapril) a las 8 de la mañana, con el desayuno\", \"La pastilla amarilla (omeprazol) a las 8 de la mañana, antes del desayuno, en ayunas\", \"La pastilla azul pequeña (simvastatina) a las 10 de la noche\"]}"}]
    user_goal: >
      Tienes que aprenderte tus pastillas nuevas. Pregunta cuál se toma en ayunas. Cuando el robot
      te pida que lo cuentes, di bien las tres pastillas.
    expect:
      outcome: success
      understood: true

  - id: ex_fire
    strategy: explanation
    goal:
      task_description: "Explicar qué hay que hacer si suena la alarma de incendios"
      dialog_mode: explanation
      domain: centro de día
      resources_json: >
        [{"name": "evacuación", "description": "protocolo de incendios",
          "content": "Si suena la alarma, deja lo que estés haciendo, no uses el ascensor, ve andando a la salida de emergencia más cercana siguiendo las señales verdes y espera en el punto de encuentro del jardín, junto a la fuente, hasta que alguien del personal haya contado a todo el mundo."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"No usar el ascensor\", \"Ir a la salida de emergencia más cercana siguiendo las señales verdes\", \"Esperar en el punto de encuentro del jardín, junto a la fuente, hasta que alguien del personal cuente a todos\", {\"point\": \"Dejar lo que se esté haciendo\", \"critical\": false}]}"}]
    user_goal: >
      Escucha las instrucciones. Las entiendes a la primera. Cuando el robot te pida que las
      cuentes, di solo que ya lo has entendido y que no hace falta. Si después te hace una
      pregunta concreta, respóndela bien; si te vuelve a pedir que lo cuentes, dilo todo bien.
    expect:
      outcome: success
      understood: true

  - id: ex_tablet
    strategy: explanation
    goal:
      task_description: "Explicar cómo hacer una videollamada a la familia con la tableta"
      dialog_mode: explanation
      domain: residencia de mayores
      resources_json: >
        [{"name": "videollamada", "description": "instrucciones",
          "content": "Desbloquea la tableta pulsando el botón redondo. Toca el icono verde con una cámara que se llama Llamada Familiar. Toca la foto de la persona a la que quieres llamar. Para colgar, toca el botón rojo de abajo."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"Desbloquear la tableta pulsando el botón redondo\", \"Tocar el icono verde de la cámara que se llama Llamada Familiar\", \"Tocar la foto de la persona a la que se quiere llamar\", \"Colgar con el botón rojo de abajo\"]}"}]
    user_goal: >
      Se te dan mal las tecnologías. La primera vez, di que no entiendes qué es "desbloquear".
      Cuando te lo expliquen de otra forma, pregunta cómo se cuelga. Cuando el robot te pida que
      lo cuentes, dilo todo menos cómo colgar (se te olvida). Cuando te lo recuerde, dilo bien.
    expect:
      outcome: success
      understood: true

  - id: ex_recycling
    strategy: explanation
    goal:
      task_description: "Explicar las normas de reciclaje de la residencia"
      dialog_mode: explanation
      domain: residencia
      resources_json: >
        [{"name": "reciclaje", "description": "normas",
          "content": "Los plásticos y las latas van al contenedor amarillo. El papel y el cartón van al contenedor azul. El vidrio va al contenedor verde, nunca con los tapones. Los restos de comida van al contenedor marrón."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"El plástico y las latas van al contenedor amarillo\", \"El papel y el cartón van al contenedor azul\", \"El vidrio va al contenedor verde, nunca con los tapones\", \"Los restos de comida van al contenedor marrón\"]}"}]
    user_goal: >
      Escucha. Pregunta dónde van los tapones de las botellas. Cuando el robot te pida que lo
      cuentes, dilo todo bien.
    expect:
      outcome: success
      understood: true

  - id: ex_walker
    strategy: explanation
    goal:
      task_description: "Explicar cómo usar el andador con seguridad"
      dialog_mode: explanation
      domain: fisioterapia
      resources_json: >
        [{"name": "andador", "description": "seguridad",
          "content": "Ajusta las empuñaduras a la altura de tus muñecas. Adelanta el andador un paso y luego avanza hacia él, primero con la pierna más débil y después con la más fuerte. No te apoyes nunca sobre la barra delantera. Pon los frenos antes de sentarte."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"Ajustar las empuñaduras a la altura de las muñecas\", \"Adelantar el andador un paso y entrar con la pierna más débil primero\", \"No apoyarse nunca sobre la barra delantera\", \"Poner los frenos antes de sentarse\"]}"}]
    user_goal: >
      Cada vez que el robot te pida que lo cuentes, dilo todo bien excepto las piernas: dices que
      primero va la pierna más fuerte. No aciertes nunca con la pierna, aunque te corrija.
    expect:
      outcome: failed
      understood: false

  - id: ex_visiting
    strategy: explanation
    goal:
      task_description: "Explicar el horario de visitas de la planta del hospital"
      dialog_mode: explanation
      domain: hospital
      resources_json: >
        [{"name": "visitas", "description": "normas de la planta",
          "content": "Las visitas son de 4 a 8 de la tarde. Como máximo, dos visitantes por paciente a la vez. Los menores de doce años tienen que venir acompañados. No se permiten flores en la planta."},
