# The scenarios of the study with real participants (E4), in Spanish: the eight scenarios of
# dialogues_es.yaml that the task cards follow (one per strategy, two of slot filling), each with
# one shared mechanism provoked on purpose (key `mechanism`), so that every mechanism is observed
# with real people and, with the same events, with the simulated users of the same scenarios
# (experiments/e4_sim_es.yaml): the comparison of simulation and reality is per mechanism.
# Events are applied by code to the simulated users (`events`); the participants do them from the
# card (evaluation/real/sessions_es.yaml, cards in evaluation/real/cards). That includes the
# card's detour (kind `detour`, with the card's detour kind): the line is said at a fixed turn,
# chosen so that it happens in every dialogue and does not replace the turn of the planned
# mechanism (decided 2026-10-30: injected, not left to the simulator, so that it is deterministic
# and the same in every condition, as the silences and cancellations; the participants choose the
# moment, "at some point", except qz_geography, "at the start").
# The urgency mechanism will be added (to qa_museum: "tell the robot in your own words that you feel
# unwell") when it is implemented. Keys: as in dialogues.yaml; expect.unanswered lists the slots the
# user does not give; expect.ending the planned ending when it is not the strategy's own (scored as ending_ok).
scenarios:
- id: sf_coffee
  strategy: slot_filling
  goal:
    task_description: 'Tomar nota de un pedido en la cafetería: la bebida, el tamaño y el nombre del cliente'
    dialog_mode: slot_filling
    domain: cafetería
    frame_schema_json: "{\"slots\": [\n  {\"name\": \"drink\", \"type\": \"str\",\n   \"canonical_values\"\
      : [\"café solo\", \"café con leche\", \"capuchino\", \"americano\", \"té\"]},\n  {\"name\": \"size\"\
      , \"type\": \"str\", \"canonical_values\": [\"pequeño\", \"mediano\", \"grande\"]},\n  {\"name\"\
      : \"milk\", \"type\": \"str\", \"canonical_values\": [\"entera\", \"desnatada\", \"avena\", \"soja\"\
      ],\n   \"condition_slot\": \"drink\", \"condition_value\": \"café con leche\"},\n  {\"name\": \"\
      customer_name\", \"type\": \"str\"}]}\n"
  user_goal: "Quieres un café con leche mediano, con leche de avena. Te llamas Laura. Confirma el pedido\
    \ cuando el robot te lo repita y esté bien; corrígelo si está mal.\n A mitad del pedido dirás «Para,\
    \ déjalo»; cuando el robot te pregunte si quieres terminar, no respondas sí ni no: dale el dato que\
    \ te había pedido y sigue con el pedido."
  goal_items:
    - {id: drink, value: "café con leche"}
    - {id: size, value: "mediano"}
    - {id: milk, value: "avena"}
    - {id: customer_name, value: "Laura"}
  expect:
    outcome: success
    frame:
      drink: café con leche
      size: mediano
      milk: avena
      customer_name: Laura
  mechanism: "three-way cancel confirmation: the reply carries the slot asked (content kept)"
  events:
  - turn: 2
    kind: cancel
    text: Para, déjalo.
  - turn: 4
    kind: detour
    detour: off_task
    text: Por cierto, ¿va a llover mañana?
- id: sf_pizza
  strategy: slot_filling
  goal:
    task_description: Tomar nota de un pedido de pizza a domicilio o para recoger
    dialog_mode: slot_filling
    domain: pizzería
    frame_schema_json: '{"slots": [{"name": "size", "type": "str", "canonical_values": ["pequeña", "mediana",
      "grande"]}, {"name": "toppings", "type": "list_str", "canonical_values": ["queso", "jamón", "champiñones",
      "aceitunas", "pepperoni", "cebolla"]}, {"name": "delivery", "type": "bool"}, {"name": "address",
      "type": "str", "condition_slot": "delivery", "condition_value": "true"}, {"name": "phone", "type":
      "str"}]}'
  user_goal: "Quieres una pizza grande con champiñones y aceitunas, a domicilio, en la Calle Mayor 5.\
    \ Confirma cuando el robot te repita el pedido y esté bien; corrígelo si está mal.\n Cuando el robot\
    \ te pida un teléfono de contacto, di que prefieres no darlo."
  goal_items:
    - {id: size, value: "grande"}
    - {id: toppings, value: "champiñones y aceitunas"}
    - {id: delivery, value: "sí"}
    - {id: address, value: "Calle Mayor 5"}
    - {id: phone, value: "prefiere no darlo"}
  expect:
    outcome: success
    frame:
      size: grande
      toppings:
      - champiñones
      - aceitunas
      delivery: true
      address: Calle Mayor 5
    ending: partial
    unanswered:
    - phone
  mechanism: "a slot the user does not give (left unanswered)"
  events:
  - turn: 2
    kind: detour
    detour: not_allowed
    text: Y ponle también piña.
- id: ex_bus
  strategy: explanation
  goal:
    task_description: Explicar cómo ir en autobús desde la residencia hasta el centro de día
    dialog_mode: explanation
    domain: residencia de mayores
    resources_json: "[{\"name\": \"ruta\", \"description\": \"ruta del autobús\",\n  \"content\": \"Coge\
      \ el autobús 23 en la parada que hay delante de la residencia. Bájate en la cuarta parada, Plaza\
      \ Mayor. El centro de día es el edificio de la puerta verde, a 50 metros a la izquierda.\"},\n {\"\
      name\": \"puntos clave\", \"description\": \"lo que la persona debe poder contar\", \"content\"\
      : \"{\\\"key_points\\\": [\\\"Coger el autobús 23 en la parada de delante de la residencia\\\",\
      \ \\\"Bajarse en la cuarta parada, Plaza Mayor\\\", \\\"El centro de día es el edificio de la puerta\
      \ verde, a 50 metros a la izquierda\\\"]}\"}]\n"
  user_goal: Tienes que ir al centro de día. La primera vez que el robot te lo explique, di que no has
    entendido bien en qué parada bajarte. Cuando te lo explique de nuevo y te pida que lo cuentes, cuéntalo,
    pero di que te bajas en la tercera parada. Cuando te corrija, cuéntalo bien.
  goal_items:
    - {id: clarification, value: "no ha entendido bien en qué parada bajarse"}
    - {id: bus, value: "coger el autobús 23 en la parada de delante de la residencia"}
    - {id: stop, value: "bajarse en la tercera parada", then: "bajarse en la cuarta parada, Plaza Mayor"}
    - {id: building, value: "el centro de día es el edificio de la puerta verde, a 50 metros a la izquierda"}
  expect:
    outcome: success
    understood: true
  mechanism: "teach-back with a key point wrong (only that point repaired)"
  events:
  - turn: 1
    kind: detour
    detour: decline
    text: ¿Me puedes pedir un taxi?
- id: qz_geography
  strategy: quiz
  goal:
    task_description: Hacer un pequeño juego de preguntas de geografía
    dialog_mode: quiz
    resources_json: "[{\"name\": \"preguntas\", \"description\": \"banco de preguntas\",\n  \"content\"\
      : \"[{\\\"question\\\": \\\"¿Cuál es la capital de Italia?\\\", \\\"answer\\\": \\\"Roma\\\"}, {\\\
      \"question\\\": \\\"¿Cuál es el río más largo de África?\\\", \\\"answer\\\": \\\"El Nilo\\\"},\
      \ {\\\"question\\\": \\\"¿En qué continente está Perú?\\\", \\\"answer\\\": \\\"América del Sur\\\
      \"}]\"}]\n"
  user_goal: Estás haciendo un juego de preguntas. Responde bien a la primera pregunta (Roma). Desde la
    segunda, en lugar de responder, habla de otra cosa (lo que has desayunado, el tiempo que hace) cada
    vez que el robot te pregunte, hasta que el robot termine la conversación.
  goal_items:
    - {id: q1, value: "Roma"}
    - {id: q2, value: "habla de otra cosa en lugar de responder"}
  expect:
    outcome: failed
    ending: breakdown
  mechanism: "bounded recovery and communication breakdown"
  events:
  - turn: 1
    kind: detour
    detour: decline
    text: Antes de empezar, ¿me dices las respuestas?
- id: pr_tea
  strategy: procedure
  goal:
    task_description: Guiar al usuario para preparar una taza de té
    dialog_mode: procedure
    domain: cocina
    resources_json: '[{"name": "pasos", "description": "receta", "content": "[\"Llena el hervidor de agua
      y enciéndelo\", \"Pon una bolsita de té en la taza\", \"Echa el agua caliente en la taza\", {\"step\":
      \"Deja reposar el té un momento y después saca la bolsita\", \"duration_s\": 45}, {\"step\":
      \"Añade leche o azúcar si quieres\", \"optional\": true}]"}]'
  user_goal: 'Estás preparando un té. Haz cada paso y di cuándo lo has hecho. Cuando el robot te diga
    que dejes reposar el té, quédate en silencio hasta que el robot vuelva a hablarte, y entonces di que
    ya está. Tú no tomas el té con leche ni con azúcar: cuando llegue el último paso, di que te lo quieres
    saltar.'
  goal_items:
    - {id: step_1, value: "hecho"}
    - {id: step_2, value: "hecho"}
    - {id: step_3, value: "hecho"}
    - {id: step_4, value: "ya está"}
    - {id: step_5, value: "se lo quiere saltar"}
  expect:
    outcome: success
    step_status:
    - done
    - done
    - done
    - done
    - skipped
    ending: completed   # the skipped step is optional: the procedure is complete
  mechanism: "silence during a step with a declared duration; an optional step skipped"
  events:
  - turn: 4
    kind: silence
  - turn: 5
    kind: detour
    detour: off_task
    text: Por cierto, ¿cuál es tu comida favorita?
- id: rp_interview
  strategy: roleplay
  goal:
    task_description: Practicar una entrevista de trabajo
    dialog_mode: roleplay
    resources_json: "[{\"name\": \"escena\", \"description\": \"escena del juego de rol\",\n  \"content\"\
      : \"{\\\"scenario\\\": \\\"Entrevista para un puesto de dependiente en una librería\\\", \\\"role\\\
      \": \\\"El encargado de la librería: amable, pero pide ejemplos concretos\\\", \\\"user_goal\\\"\
      : \\\"Conseguir el trabajo\\\", \\\"criteria\\\": [\\\"Responde con claridad\\\", \\\"Da ejemplos\
      \ concretos\\\", \\\"Muestra motivación\\\"], \\\"max_exchanges\\\": 6}\"}]\n"
  user_goal: "Estás practicando una entrevista de trabajo para una librería. Responde como alguien a quien\
    \ le encantan los libros y que ha trabajado dos veranos en un supermercado. Responde con claridad\
    \ y muestra que quieres el trabajo, pero no des nunca un ejemplo concreto: responde siempre en general\
    \ (\"se me da bien la gente\"), aunque te lo pidan. Sigue hasta que el robot dé por terminada la práctica.\n\
    \ En tu segunda respuesta, quédate callado pensando un rato antes de contestar. Más adelante di «¿Podemos\
    \ parar?» y, cuando el robot te pregunte si quieres terminar, di que no, que sigáis."
  goal_items:
    - {id: loves_books, value: "le encantan los libros"}
    - {id: experience, value: "ha trabajado dos veranos en un supermercado"}
  expect:
    outcome: success
    criteria:
    - Responde con claridad
    - Da ejemplos concretos
    - Muestra motivación
    weak_criterion: Da ejemplos concretos
  mechanism: "long silence (waiting feedback) and a cancel denied"
  events:
  - turn: 2
    kind: silence
  - turn: 3
    kind: detour
    detour: off_task
    text: ¿Qué libro me recomiendas leer este verano?
  - turn: 4
    kind: cancel
    text: ¿Podemos parar?
  - turn: 5
    kind: text
    text: No, no, sigamos.
- id: qa_museum
  strategy: grounded_qa
  goal:
    task_description: Responder a las preguntas de los visitantes en la entrada del museo de ciencias
    dialog_mode: grounded_qa
    domain: museo
    resources_json: '[{"name": "information", "description": "what the robot may answer from", "content":
      "El Museo de Ciencias abre de martes a domingo, de 10:00 a 19:00; los lunes está cerrado. La entrada
      general cuesta 8 euros; los menores de 12 años y los mayores de 65 entran gratis. La sala de los
      dinosaurios está en la primera planta. En la taquilla se alquilan audioguías por 2 euros."}, {"name":
      "handover", "description": "who can help", "content": "El personal de la taquilla puede ayudarte
      con eso."}]'
  user_goal: Estás visitando el museo. Pregunta si abre los lunes y, cuando te responda, comenta «vaya,
    qué pena». Después pregunta cuánto cuesta la entrada para una persona de 70 años y pide que te repita
    la respuesta. Después pregunta si hay cafetería. Después di que no tienes más preguntas.
  goal_items:
    - {id: q1, value: "si abre los lunes"}
    - {id: q2, value: "el precio de la entrada para una persona de 70 años"}
    - {id: q3, value: "si hay cafetería"}
  expect:
    outcome: success
    qa_resolutions:
    - answered
    - answered
    - abstained
  mechanism: "abstention, a comment and a request to repeat"
  events:
  - turn: 3
    kind: detour
    detour: off_task
    text: ¿Y qué opinas del último partido de fútbol?
- id: qn_museum_satisfaction
  strategy: questionnaire
  goal:
    task_description: Hacer al visitante la encuesta de satisfacción del museo
    dialog_mode: questionnaire
    domain: museo
    resources_json: '[{"name": "instrument", "description": "the questionnaire", "content": "{\"name\":
      \"Satisfacción del visitante\", \"instructions\": \"Te voy a leer cuatro frases sobre tu visita.
      En cada una, dime cuánto estás de acuerdo.\", \"options\": [\"Nada\", \"Un poco\", \"Bastante\",
      \"Mucho\"], \"items\": [\"He disfrutado de la visita\", \"La información era fácil de entender\",
      {\"text\": \"La visita se me ha hecho demasiado larga\", \"clarification\": \"Quiere decir que se
      te hizo pesada o que te cansaste antes de terminar.\"}, \"Recomendaría el museo a un amigo\"]}"}]'
  user_goal: 'Responde la encuesta: has disfrutado mucho de la visita; la información era bastante fácil
    de entender; en la tercera frase, pregunta primero qué quiere decir, después di que algo entre un
    poco y bastante, y cuando el robot te repita las opciones, di un poco; y lo recomendarías mucho.'
  goal_items:
    - {id: item_1, value: "Mucho"}
    - {id: item_2, value: "Bastante"}
    - {id: item_3, value: "algo entre un poco y bastante", then: "Un poco"}
    - {id: item_4, value: "Mucho"}
  expect:
    outcome: success
    answers:
    - Mucho
    - Bastante
    - Un poco
    - Mucho
  mechanism: "items read literally; a question about an item's meaning and an answer between options"
  events:
  - turn: 2
    kind: detour
    detour: decline
    text: ¿Qué puntuación he dado en total?
