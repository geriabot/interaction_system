    goal_items:
      - {id: customer_name, value: Ramón Pastor}
    expect:
      mechanisms: {unanswered_ok: true, events_applied: 2, closing_said: true}
      outcome: success
      frame: {item: sun lounger, customer_name: Ramón Pastor}
      # The slot the user leaves empty; the address, conditioned on it, is not asked: it must
