          {"name": "item", "type": "str", "canonical_values": ["folding chair", "sun lounger", "parasol"]},
          {"name": "delivery", "type": "str", "canonical_values": ["home delivery", "collect in store"]},
          {"name": "address", "type": "str", "condition_slot": "delivery", "condition_value": "home delivery"},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      You want a sun lounger. You have not decided how to get it home, so you do not answer that.
      Your name is Ramón Pastor. Confirm when the robot reads it back and it is right; correct it
