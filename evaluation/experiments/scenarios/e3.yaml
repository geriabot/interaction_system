    strategy: slot_filling
    goal:
      task_description: "Book a guided tour of the castle: which tour, the language of the guide and the visitor's name"
      dialog_mode: slot_filling
      domain: castle
      # No frame_schema_json: the LLM designs the frame from the task and audits it against
      # the resources; the slot names are not known, so the values are scored (frame_values)
      resources_json: >
        [{"name": "tours", "description": "what the castle offers",
          "content": "Guided tours: the towers tour, the gardens tour and the dungeons tour. The guides speak Spanish, English or French. The tours start at 11:00 and at 16:00."}]
    user_goal: >
      You want the gardens tour with a guide who speaks French, at 11:00. Your name is Nuria
      Campos. If the robot asks for anything else, say you do not mind. Confirm when the robot
      reads it back and it is right; correct it if it is wrong.
    goal_items:
      - {id: tour, value: gardens tour}
      - {id: language, value: French}
      - {id: visitor_name, value: Nuria Campos}
    expect:
      mechanisms: {events_applied: 0, closing_said: true}
      outcome: success
      # Each value must be the value of some slot of the designed frame (any name)
      frame_values: [gardens, French, Nuria Campos]
    mechanism: "slot filling without a schema: the frame designed by the LLM and audited against the resources"

  - id: m_sf_condition_unanswered
    strategy: slot_filling
    goal:
      task_description: "Take an order of garden furniture"
