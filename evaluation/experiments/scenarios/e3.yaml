      unanswered: [delivery]
      ending: partial
    mechanism: "a slot conditioned on a slot the user leaves unanswered is not asked"
    events:
      - {turn: 1, kind: text, text: "A sun lounger, please."}
      - {turn: 2, kind: text, text: "I haven't decided that yet, leave it out for now."}

  - id: m_ex_llm_key_points
