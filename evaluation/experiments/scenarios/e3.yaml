  - id: m_ex_teach_back_one_wrong
    strategy: explanation
    goal:
      task_description: "Explain how to take the hotel's shuttle bus to the airport"
      dialog_mode: explanation
      domain: hotel
      resources_json: >
        [{"name": "instructions", "description": "the airport shuttle",
          "content": "The airport shuttle leaves from the side entrance of the hotel. It runs every thirty minutes from six in the morning. Show your room key to the driver; the trip is free for guests."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"The shuttle leaves from the side entrance of the hotel\", \"It runs every thirty minutes\", \"Show your room key to the driver\"]}"}]
    user_goal: >
      You are a guest who needs to get to the airport. After the robot corrects what you said
      wrong, say it all back correctly when it asks you again.
    expect:
      mechanisms: {tb_marked_wrong: true, tb_others_correct: true, tb_repair_only_wrong: true,
                   tb_closed_consistent: true, events_applied: 1, closing_said: true}
      outcome: success
      understood: true
      ending: completed
      # The turn of the planted restatement and the key points it gets wrong (1-based)
      teach_back: {turn: 1, wrong: [2]}
    mechanism: "teach-back with one key point said back wrong: marked wrong, only that point explained again, not closed as understood until it is right"
    events:
      - {turn: 1, kind: text, text: "So the bus goes from the side entrance, it comes once an hour, and I show the driver my room key."}

