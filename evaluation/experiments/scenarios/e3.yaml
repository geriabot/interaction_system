  # ==== The strategies' own mechanisms (against their specification) ====
  # Each one is checked from the record (analysis/strategy_checks.py): the key in expect that
  # names the planted moment (out_of_range, report_contradicts, repeat, teach_back) says which
  # robot reply is read; its columns are listed in expect.mechanisms.

  - id: m_sf_out_of_range
    strategy: slot_filling
    goal:
      task_description: "Sell tickets for a boat trip on the bay"
      dialog_mode: slot_filling
      domain: boat trips
      frame_schema_json: >
        {"slots": [
          {"name": "trip", "type": "str", "canonical_values": ["morning trip", "sunset trip"]},
          {"name": "tickets", "type": "int", "minimum": 1, "maximum": 8}]}
    user_goal: >
      You want four tickets for the sunset trip. At first the number comes out wrong (forty);
      when the robot asks again, you say four. Confirm when the robot reads it back and it is
      right; correct it if it is wrong.
    expect:
      mechanisms: {range_rejected: true, events_applied: 2, closing_said: true}
      outcome: success
      frame: {trip: sunset trip, tickets: 4}
      ending: completed
      # The turn of the out-of-range value and its slot: the robot's reply to it must leave the
      # slot empty (range_rejected) and say the allowed range (range_said, reported)
      out_of_range: {turn: 1, slot: tickets}
    mechanism: "a number outside the allowed range: not recorded, the range said, asked again; then the valid value"
    events:
      - {turn: 1, kind: text, text: "40 tickets for the sunset trip, please."}
      - {turn: 2, kind: text, text: "Oh, sorry, I meant 4."}

