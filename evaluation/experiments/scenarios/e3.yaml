  - id: m_pr_check_contradicted
    strategy: procedure
    goal:
      task_description: "Guide the user to change the filter of a water filter jug"
      dialog_mode: procedure
      domain: kitchen
      resources_json: >
        [{"name": "steps", "description": "changing the filter",
          "content": "[\"Rinse the new filter under the cold tap\", {\"step\": \"Push the filter into the jug until it clicks\", \"check\": \"the filter clicks into place\"}, \"Fill the jug and pour away the first water\"]"}]
    user_goal: >
      You are changing the filter of your water jug. Do each step and say when you have done it.
      When the robot helps you with the filter that did not click, try again: now it clicks; say
      it is done.
    goal_items:
      - {id: step_2, value: it clicked}
      - {id: step_3, value: done}
    expect:
      mechanisms: {contradiction_not_done: true, events_applied: 2, closing_said: true}
      outcome: success
      step_status: [done, done, done]
      ending: completed
      # The turn of the report that contradicts the step's check, and the step (1-based): the
      # robot's reply to it must keep that step open (not done)
      report_contradicts: {turn: 2, step: 2}
    mechanism: "a report that contradicts the step's check: a problem (help), not done"
    events:
      - {turn: 1, kind: text, text: "Done, it's rinsed."}
      - {turn: 2, kind: text, text: "Done, I pushed it in, but it didn't click, it's still loose."}

  - id: m_rp_repeat
    strategy: roleplay
    goal:
      task_description: "Practise checking in at a hotel reception"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "scene", "description": "roleplay scene",
          "content": "{\"scenario\": \"The reception of a small hotel in the evening\", \"role\": \"The receptionist: friendly, asks for the name of the booking\", \"user_goal\": \"Check in for a two-night stay\", \"criteria\": [\"Gives the name of the booking\", \"Asks at what time breakfast is served\", \"Thanks the receptionist\"], \"max_exchanges\": 6}"}]
    user_goal: >
      You are practising checking in at a hotel: your booking is under the name Elena Vidal, for
      two nights. You do not hear the receptionist well at first. Then give your name, ask at
      what time breakfast is served and thank the receptionist. Go on until the robot ends the
      practice.
    goal_items:
      - {id: booking_name, value: Elena Vidal}
      - {id: breakfast, value: asks the breakfast time}
    expect:
      mechanisms: {repeat_literal: true, repeat_rephrased: true, rp_exchanges: 3,
                   events_applied: 3, closing_said: true}
      outcome: success
      criteria: [Gives the name of the booking, Asks at what time breakfast is served, Thanks the receptionist]
      ending: completed
      # The turns of the two requests to repeat: the first is answered with the character's
      # last line word for word, the second in other words; neither is an exchange
      repeat: {turns: [2, 3]}
    mechanism: "a request to repeat in a role play: the line word for word, then in other words; repeats are not exchanges"
    events:
      - {turn: 1, kind: text, text: "Good evening, I have a room booked for two nights."}
      - {turn: 2, kind: text, text: "Pardon? I didn't catch what you said."}
      - {turn: 3, kind: text, text: "I still don't get it, can you say it some other way?"}
