# The scenarios of E3 (robustness of the shared mechanisms), in English; e3_es.yaml is the
# Spanish version (same ids, same structure, same ground truth), not run by an experiment (E3 runs
# in English only, decided 2026-10-30) but used by the test panel and the tests. Each scenario is built around one
# mechanism (key `mechanism`) and provokes it with events applied by code at fixed user turns, so
# that it happens in every dialogue and is the same in every condition; the simulated user only
# plays the rest. They are new scenarios rather than the E1 scenarios with events added (decided
# 2026-10-30): an event must land on a known element (a closed-choice slot, the read-back, the step
# with a duration), and the E1 scenarios plan their own changes of content at turns the events
# would collide with. Domains are disjoint from the E0a development scenarios.
#
# The groups, by the prefix of the id: cancellation (c_, a_), confirmation of the data (d_),
# recovery and breakdown (r_, b_, n_), silence and endings (s_, t_), and the strategies' own
# mechanisms against their specification (m_: an out-of-range number, a frame designed by the LLM,
# a slot conditioned on an unanswered one, key points listed by the LLM, teach-back with planted
# wrong points, a report contradicting a step's check, a request to repeat in a role play). The
# method runs every scenario; each condition of e3_mechanisms*.yaml that is not the method runs
# the scenarios of its mechanism (scenario_ids). The turn of an event counts the user's turns from 1: the robot's first utterance
# carries the first element (slot question, quiz question, step, item...), so turn k answers it
# when the earlier turns made progress. Silence: a silence event leaves the user silent until the
# robot speaks again (with wait_timeout 15 s and max_silence 90 s, one event is one prompt; three
# in a row reach "Whenever you're ready"; four end the dialogue as user_silent).
#
# Keys: as in dialogues.yaml (goal, user_goal, goal_items, expect, events). expect.ending is the
# planned ending (scored as ending_ok); expect.mechanisms what the shared mechanisms must do by
# their specification (analysis/mechanisms.py: confirmation questions, silent waits, events
# applied, closing line; scored as mechanisms_ok); expect.unanswered lists the slots left empty;
# goal.max_stalled / goal.max_turns are the request's own limits when the mechanism needs them.
# The m_ scenarios name the planted moment in expect (out_of_range, report_contradicts, repeat,
# teach_back; frame_values when the frame has no schema): analysis/strategy_checks.py reads the
# robot's reply to it, and its columns go in expect.mechanisms like the shared ones.
# goal_items list only what the simulated user must say itself (not the lines of the events), so
# that the adherence check does not count a line said by an event as never revealed.
scenarios:

  # ==== Cancellation: requests that must end as cancelled (with the confirmation) ====

  - id: c_taxi_exact_closed
    strategy: slot_filling
    goal:
      task_description: "Book a taxi"
      dialog_mode: slot_filling
      domain: taxi company
      frame_schema_json: >
        {"slots": [
          {"name": "vehicle", "type": "str",
           "canonical_values": ["standard car", "van", "wheelchair-accessible car"]},
          {"name": "pickup", "type": "str",
           "canonical_values": ["now", "in one hour", "this evening"]}]}
    user_goal: >
      You want a wheelchair-accessible taxi now, but you change your mind: after your first
      answer you ask to cancel, and when the robot asks whether you want to stop, you say yes.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 3, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "an exact stop command while a closed-choice slot is asked (strict mode), confirmed"
    events:
      - {turn: 1, kind: text, text: "A wheelchair-accessible car, please."}
      - {turn: 2, kind: cancel, text: "Cancel."}
      - {turn: 3, kind: text, text: "Yes."}

  - id: c_optician_exact_open
    strategy: slot_filling
    goal:
      task_description: "Book an eye test at the optician's"
      dialog_mode: slot_filling
      domain: optician
      frame_schema_json: >
        {"slots": [
          {"name": "customer_name", "type": "str"},
          {"name": "phone", "type": "str"}]}
    user_goal: >
      You want to book an eye test; your name is Pablo Ortega. After your first answer you ask
      to stop, and when the robot asks whether you want to stop, you say yes.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 3, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "an exact stop command while an open slot is asked, confirmed"
    events:
      - {turn: 1, kind: text, text: "My name is Pablo Ortega."}
      - {turn: 2, kind: cancel, text: "Stop."}
      - {turn: 3, kind: text, text: "Yes, please."}

  - id: c_gym_phrase_closed
    strategy: slot_filling
    goal:
      task_description: "Book a place in a class at the sports centre"
      dialog_mode: slot_filling
      domain: gym
      frame_schema_json: >
        {"slots": [
          {"name": "class", "type": "str",
           "canonical_values": ["yoga", "spinning", "pilates", "aquagym"]},
          {"name": "day", "type": "str",
           "canonical_values": ["monday", "wednesday", "friday"]}]}
    user_goal: >
      You want a spinning class, but after your first answer you decide to leave the booking for
      another day; when the robot asks whether you want to stop, you say yes.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 3, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "a request to stop in other words while a closed-choice slot is asked (strict mode, decided by the LLM), confirmed"
    events:
      - {turn: 1, kind: text, text: "Spinning, please."}
      - {turn: 2, kind: cancel, text: "Wait, stop, I'd rather leave the booking for another day."}
      - {turn: 3, kind: text, text: "Yes."}

  - id: c_quiz_phrase
    strategy: quiz
    goal:
      task_description: "A short quiz about rivers and mountains"
      dialog_mode: quiz
      resources_json: >
        [{"name": "questions", "description": "quiz bank",
          "content": "[{\"question\": \"What is the longest river in Spain?\", \"answer\": \"the Tagus\"}, {\"question\": \"Which is the highest mountain in Europe outside the Caucasus?\", \"answer\": \"Mont Blanc\"}, {\"question\": \"Into which sea does the Ebro flow?\", \"answer\": \"the Mediterranean\"}]"}]
    user_goal: >
      Answer the first question. Then you get tired and ask to finish the quiz; when the robot
      asks whether you want to stop, you say yes.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 2, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "a request to stop in other words during a quiz, confirmed"
    events:
      - {turn: 2, kind: cancel, text: "I'm tired, can we end the quiz now?"}
      - {turn: 3, kind: text, text: "Yes, that's enough for today."}

  - id: c_procedure_phrase
    strategy: procedure
    goal:
      task_description: "Guide the user to repot a houseplant"
      dialog_mode: procedure
      domain: gardening
      resources_json: >
        [{"name": "steps", "description": "repotting a plant",
          "content": "[\"Put some fresh compost at the bottom of the new pot\", \"Take the plant out of the old pot holding it by the base\", \"Place the plant in the new pot and fill the sides with compost\", \"Water the plant a little\"]"}]
    user_goal: >
      You are repotting a plant. Do the first step and say so. Then you decide not to go on;
      when the robot asks whether you want to stop, you say yes.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 2, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "a request to stop in other words during a procedure, confirmed"
    events:
      - {turn: 2, kind: cancel, text: "I'm going to leave it here, I don't feel like going on with this."}
      - {turn: 3, kind: text, text: "Yes."}

  # ==== Cancellation: requests that do not end the conversation ====

  - id: c_explanation_denied
    strategy: explanation
    goal:
      task_description: "Explain how to renew the library card"
      dialog_mode: explanation
      domain: public library
      resources_json: >
        [{"name": "instructions", "description": "renewing the card",
          "content": "Library cards are renewed at the information desk on the ground floor. Bring an identity document and the old card. The renewal is free and the new card is ready on the spot."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Renew it at the information desk on the ground floor\", \"Bring an identity document and the old card\", {\"point\": \"It is free and ready on the spot\", \"critical\": false}]}"}]
    user_goal: >
      You want to renew your library card. After the robot's first explanation you hesitate and
      wonder whether to leave it; when the robot asks whether you want to stop, you say no and go
      on. When it asks you to say it in your own words, say it all correctly.
    expect:
      mechanisms: {cancel_asked: 1, cancel_denied: 1, events_applied: 2, closing_said: true}
      outcome: success
      understood: true
      ending: completed
    mechanism: "an ambiguous request to stop, denied: the robot resumes with what it had asked"
    events:
      - {turn: 1, kind: cancel, text: "I don't know... maybe we should leave it."}
      - {turn: 2, kind: text, text: "No, no, go on, please."}

  - id: c_florist_content_kept
    strategy: slot_filling
    goal:
      task_description: "Take an order of flowers to be delivered"
      dialog_mode: slot_filling
      domain: florist
      frame_schema_json: >
        {"slots": [
          {"name": "flowers", "type": "str",
           "canonical_values": ["roses", "tulips", "sunflowers"]},
          {"name": "recipient_name", "type": "str"}]}
    user_goal: >
      You want to send tulips to Carmen Ruiz. Confirm the order when the robot reads it back and
      it is right; correct it if it is wrong.
    expect:
      mechanisms: {cancel_asked: 1, cancel_denied: 1, events_applied: 3, closing_said: true}
      outcome: success
      frame: {flowers: tulips, recipient_name: Carmen Ruiz}
      ending: completed
    mechanism: "an ambiguous request to stop whose confirmation is answered with the value asked: only a yes stops, so the robot resumes and asks again (since 2026-11-01)"
    events:
      - {turn: 1, kind: text, text: "Some tulips, please."}
      - {turn: 2, kind: cancel, text: "Oh, maybe I should just forget about it..."}
      - {turn: 3, kind: text, text: "They are for Carmen Ruiz."}

  # ==== Apparent cancellations: cancel-like words that belong to the task ====

  - id: a_bank_cancel_value
    strategy: slot_filling
    goal:
      task_description: "Take a request at the bank's front desk"
      dialog_mode: slot_filling
      domain: bank
      frame_schema_json: >
        {"slots": [
          {"name": "request", "type": "str",
           "canonical_values": ["open an account", "cancel a card", "change the address"]},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      You lost your bank card and want it cancelled. Your name is Javier Soto. Confirm when the
      robot reads it back and it is right; correct it if it is wrong.
    goal_items:
      - {id: customer_name, value: Javier Soto}
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 1, closing_said: true}
      outcome: success
      frame: {request: cancel a card, customer_name: Javier Soto}
      ending: completed
    mechanism: "an apparent cancellation: the value of a closed-choice slot (strict mode)"
    events:
      - {turn: 1, kind: text, text: "I need to cancel my card, I've lost it."}

  - id: a_newspaper_stop_value
    strategy: slot_filling
    goal:
      task_description: "Take a request to pause the newspaper delivery"
      dialog_mode: slot_filling
      domain: newsagent
      frame_schema_json: >
        {"slots": [
          {"name": "days_paused", "type": "int", "minimum": 1, "maximum": 30},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      You are going away and want the newspaper delivery paused for ten days. Your name is Elena
      Prieto. Confirm when the robot reads it back and it is right; correct it if it is wrong.
    goal_items:
      - {id: customer_name, value: Elena Prieto}
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 1, closing_said: true}
      outcome: success
      frame: {days_paused: 10, customer_name: Elena Prieto}
      ending: completed
    mechanism: "an apparent cancellation: a stop word inside the value of an open slot"
    events:
      - {turn: 1, kind: text, text: "Please stop the paper for ten days, I'm going away."}

  - id: a_quiz_stop_answer
    strategy: quiz
    goal:
      task_description: "A short quiz about getting around the city"
      dialog_mode: quiz
      resources_json: >
        [{"name": "questions", "description": "quiz bank",
          "content": "[{\"question\": \"What do you call the place where a bus picks up passengers?\", \"answer\": \"a bus stop\"}, {\"question\": \"What do you need to travel on the underground?\", \"answer\": \"a ticket\"}, {\"question\": \"What colour is a taxi in New York?\", \"answer\": \"yellow\"}]"}]
    user_goal: >
      Answer every question correctly (a bus stop, a ticket, yellow).
    goal_items:
      - {id: q2, value: a ticket}
      - {id: q3, value: yellow}
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 1, closing_said: true}
      outcome: success
      quiz_correct: [true, true, true]
      ending: completed
    mechanism: "an apparent cancellation: a stop word as a quiz answer"
    events:
      - {turn: 1, kind: text, text: "That's a bus stop."}

  - id: a_microwave_cancel_step
    strategy: procedure
    goal:
      task_description: "Guide the user to reheat a dish in the microwave"
      dialog_mode: procedure
      domain: kitchen
      resources_json: >
        [{"name": "steps", "description": "reheating a dish",
          "content": "[\"Put the dish in the microwave and close the door\", \"Press the cancel button to clear the old timer\", \"Set two minutes and press start\", \"Take the dish out carefully, it will be hot\"]"}]
    user_goal: >
      You are reheating a dish. Do each step and say when you have done it.
    goal_items:
      - {id: step_1, value: done}
      - {id: step_3, value: done}
      - {id: step_4, value: done}
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 1, closing_said: true}
      outcome: success
      step_status: [done, done, done, done]
      ending: completed
    mechanism: "an apparent cancellation: a cancel word in the report of a step"
    events:
      - {turn: 2, kind: text, text: "Done, I've pressed cancel."}

  # ==== Confirmation of the data: corrections and questions at the read-back ====

  - id: d_cinema_correct
    strategy: slot_filling
    goal:
      task_description: "Sell tickets for the cinema"
      dialog_mode: slot_filling
      domain: cinema
      frame_schema_json: >
        {"slots": [
          {"name": "film", "type": "str",
           "canonical_values": ["The Lighthouse", "Summer Rain", "The Last Train"]},
          {"name": "session", "type": "str", "canonical_values": ["17:00", "19:30", "22:00"]},
          {"name": "tickets", "type": "int", "minimum": 1, "maximum": 10}]}
    user_goal: >
      You want three tickets for The Lighthouse at 19:30. Confirm when the robot reads the order
      back and it is right; correct it if it is wrong.
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 2, closing_said: true}
      outcome: success
      frame: {film: The Lighthouse, session: "19:30", tickets: 3}
      ending: completed
    mechanism: "a correction at the read-back (a number)"
    events:
      - {turn: 1, kind: text, text: "Two tickets for The Lighthouse at 19:30."}
      - {turn: 2, kind: text, text: "No, sorry, three tickets, not two."}

  - id: d_bike_correct
    strategy: slot_filling
    goal:
      task_description: "Hire out a bicycle"
      dialog_mode: slot_filling
      domain: bike hire
      frame_schema_json: >
        {"slots": [
          {"name": "bike", "type": "str",
           "canonical_values": ["city bike", "electric bike", "tandem"]},
          {"name": "hours", "type": "int", "minimum": 1, "maximum": 8},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      You want a city bike for three hours; your name is Lucía Vidal. Confirm when the robot reads
      it back and it is right; correct it if it is wrong.
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 2, closing_said: true}
      outcome: success
      frame: {bike: city bike, hours: 3, customer_name: Lucía Vidal}
      ending: completed
    mechanism: "a correction at the read-back (a closed-choice value)"
    events:
      - {turn: 1, kind: text, text: "An electric bike for three hours. My name is Lucía Vidal."}
      - {turn: 2, kind: text, text: "Oh wait, not electric, a city bike."}

  - id: d_pool_list_correct
    strategy: slot_filling
    goal:
      task_description: "Book activities at the swimming pool"
      dialog_mode: slot_filling
      domain: swimming pool
      frame_schema_json: >
        {"slots": [
          {"name": "activities", "type": "list_str",
           "canonical_values": ["swimming lessons", "aquagym", "free swim", "sauna"]},
          {"name": "day", "type": "str", "canonical_values": ["saturday", "sunday"]}]}
    user_goal: >
      You want free swim and aquagym on Saturday. Confirm when the robot reads it back and it is
      right; correct it if it is wrong.
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 2, closing_said: true}
      outcome: success
      frame: {activities: [free swim, aquagym], day: saturday}
      ending: completed
    mechanism: "a correction at the read-back that removes and adds items of a list"
    events:
      - {turn: 1, kind: text, text: "Free swim and the sauna on Saturday."}
      - {turn: 2, kind: text, text: "Actually, take out the sauna and put aquagym instead."}

  - id: d_post_question
    strategy: slot_filling
    goal:
      task_description: "Take a parcel at the post office counter"
      dialog_mode: slot_filling
      domain: post office
      frame_schema_json: >
        {"slots": [
          {"name": "destination", "type": "str", "canonical_values": ["national", "international"]},
          {"name": "weight_kg", "type": "float", "minimum": 0.1, "maximum": 30},
          {"name": "insured", "type": "bool"}]}
      resources_json: >
        [{"name": "delivery times", "description": "what the robot may answer from",
          "content": "National parcels arrive in two working days. International parcels arrive in five to eight working days."}]
    user_goal: >
      You are sending an international parcel of 2 kilos, with insurance. Confirm when the robot
      reads it back and it is right; correct it if it is wrong.
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 2, closing_said: true}
      outcome: success
      frame: {destination: international, weight_kg: 2, insured: true}
      ending: completed
    mechanism: "a question at the read-back: answered from the resources, then the confirmation asked again"
    events:
      - {turn: 1, kind: text, text: "An international parcel of two kilos, with insurance."}
      - {turn: 2, kind: text, text: "Wait, how long does it take to arrive?"}

  # ==== Recovery per element ====

  - id: r_sf_ladder
    strategy: slot_filling
    goal:
      task_description: "Register a visitor at the reception of an office building"
      dialog_mode: slot_filling
      domain: office reception
      frame_schema_json: >
        {"slots": [
          {"name": "visitor_name", "type": "str"},
          {"name": "company", "type": "str", "canonical_values": ["Norte Logistics", "Arco Design", "Vela Legal"]}]}
    user_goal: >
      You are visiting; your name is Marta Gil. When the robot asks which company you are
      visiting, you are not able to answer. Confirm the registration when the robot reads it back.
    expect:
      mechanisms: {events_applied: 5, closing_said: true}
      outcome: success
      frame: {visitor_name: Marta Gil}
      unanswered: [company]
      ending: partial
    mechanism: "the recovery ladder of a slot: asked again, asked as a closed question, left unanswered"
    events:
      - {turn: 1, kind: text, text: "I'm Marta Gil."}
      - {turn: 2, kind: text, text: "Yellow window seven the river."}
      - {turn: 3, kind: text, text: "Table the of green across."}
      - {turn: 4, kind: text, text: "Over Tuesday the paper moon."}
      - {turn: 5, kind: text, text: "Kettle along the north blue."}

  - id: r_quiz_unanswered
    strategy: quiz
    goal:
      task_description: "A short quiz about the human body"
      dialog_mode: quiz
      resources_json: >
        [{"name": "questions", "description": "quiz bank",
          "content": "[{\"question\": \"How many lungs does a person have?\", \"answer\": \"two\"}, {\"question\": \"Which organ pumps the blood?\", \"answer\": \"the heart\"}, {\"question\": \"What is the largest bone in the body?\", \"answer\": \"the femur\"}]"}]
    user_goal: >
      Answer the first question correctly (two). You cannot follow the second question at all.
      Answer the third question correctly (the femur).
    expect:
      mechanisms: {events_applied: 3, closing_said: true}
      outcome: success
      ending: partial
    mechanism: "the recovery ladder of a quiz question: literal repeat, simpler words, left unanswered"
    events:
      - {turn: 2, kind: text, text: "Sorry, what? I didn't catch that."}
      - {turn: 3, kind: text, text: "I still don't understand what you're asking."}
      - {turn: 4, kind: text, text: "No, sorry, I can't follow you."}

  - id: r_questionnaire_between
    strategy: questionnaire
    goal:
      task_description: "Ask the visitor the satisfaction survey of the botanical garden"
      dialog_mode: questionnaire
      domain: botanical garden
      resources_json: '[{"name": "instrument", "description": "the questionnaire", "content": "{\"name\":
        \"Garden visit\", \"instructions\": \"I will ask you three short questions about your visit.\",
        \"options\": [\"Not at all\", \"A little\", \"Quite\", \"Very\"], \"items\": [\"How much did you enjoy
        the greenhouse?\", \"How clear were the signs on the paths?\", \"How likely are you to come back?\"]}"}]'
    user_goal: >
      Answer the survey: you enjoyed the greenhouse very much; for the second question you
      cannot decide between two options; you are quite likely to come back.
    expect:
      mechanisms: {events_applied: 3, closing_said: true}
      outcome: success
      answers: ["Very", null, "Quite"]
      # The score computed by code (sum of the answered items: 4 + 3)
      score: 7
      ending: partial
    mechanism: "the recovery ladder of a questionnaire item: answers between options, then the item without an answer"
    events:
      - {turn: 2, kind: text, text: "Somewhere between a little and quite, I'd say."}
      - {turn: 3, kind: text, text: "I can't choose, between those two."}
      - {turn: 4, kind: text, text: "Honestly, half one and half the other."}

  # ==== Communication breakdown: max_stalled turns in a row without progress ====

  - id: b_slot_filling
    strategy: slot_filling
    goal:
      task_description: "Book a table at the restaurant"
      dialog_mode: slot_filling
      domain: restaurant
      frame_schema_json: >
        {"slots": [
          {"name": "guests", "type": "int", "minimum": 1, "maximum": 12},
          {"name": "time", "type": "str", "canonical_values": ["13:30", "14:30", "21:00"]}]}
    user_goal: >
      You want a table for four at 21:00. When the robot reads the booking back, you get confused
      and cannot answer.
    expect:
      mechanisms: {events_applied: 5, closing_said: true}
      outcome: failed
      ending: breakdown
    mechanism: "breakdown in slot filling: four unclear answers in a row to the read-back (while gathering, the ladder leaves the slot unanswered first, which is progress)"
    events:
      - {turn: 1, kind: text, text: "A table for four at 21:00, please."}
      - {turn: 2, kind: text, text: "Yellow window seven the river."}
      - {turn: 3, kind: text, text: "Table the of green across."}
      - {turn: 4, kind: text, text: "Over Tuesday the paper moon."}
      - {turn: 5, kind: text, text: "Kettle along the north blue."}

  - id: b_explanation
    strategy: explanation
    goal:
      task_description: "Explain how to use the hearing loop at the town hall"
      dialog_mode: explanation
      domain: town hall
      resources_json: >
        [{"name": "instructions", "description": "the hearing loop",
          "content": "The counters with a blue ear sign have a hearing loop. Switch your hearing aid to the T position and sit in front of the sign."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Use a counter with a blue ear sign\", \"Switch the hearing aid to the T position\"]}"}]
    user_goal: >
      You are confused and cannot say anything that makes sense.
    expect:
      mechanisms: {events_applied: 4, closing_said: true}
      outcome: failed
      ending: breakdown
    mechanism: "breakdown in an explanation: four unintelligible replies in a row"
    events:
      - {turn: 1, kind: text, text: "Yellow window seven the river."}
      - {turn: 2, kind: text, text: "Table the of green across."}
      - {turn: 3, kind: text, text: "Over Tuesday the paper moon."}
      - {turn: 4, kind: text, text: "Kettle along the north blue."}

  - id: b_procedure
    strategy: procedure
    goal:
      task_description: "Guide the user to set the alarm on a bedside clock"
      dialog_mode: procedure
      domain: bedroom
