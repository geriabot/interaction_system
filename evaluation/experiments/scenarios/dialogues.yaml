      - {id: refund, value: "asks for the money back, not a voucher"}
      - {id: help, value: "asks for help once"}
    expect:
      outcome: success
      criteria: ["Explains the problem", "Stays polite but firm", "Asks for the refund"]
      weak_criterion: "Stays polite but firm"

