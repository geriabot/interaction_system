# The dialogue scenarios of the experiments (E1 uses all of them; E0b, the role swap of E1 and the noise of E3 a subset).
# None of them is used to choose the local model (E0a has its own development scenarios), and no
# example of the system's prompts may come from them.
#
# Each scenario has the request the robot's behavior sends (goal: the DialogTask fields), what
# the simulated user wants (user_goal, written to the user in the second person), and the ground
# truth that scores the run (expect):
#   outcome         success | cancelled | failed
#   frame           slot filling: the final frame (values compared case-insensitively)
#   quiz_correct    quiz: whether each answer of the user is correct, in order
#   step_status     procedure: done | skipped | stuck for each step, in order
#   criteria        roleplay: every criterion must be scored
#   weak_criterion  roleplay: the criterion the simulated user fails on purpose (its user_goal
#                   says how); its score must be the lowest
#   understood      explanation: the user ends up understanding, verified by teach-back: every
#                   critical key point (the "key points" resource) said back correctly
#   qa_resolutions  grounded_qa: the resolution of each question the simulated user asks, in order
#                   (answered: in the material; abstained: within the task, not in the material;
#                   declined: outside the task)
#   answers         questionnaire: the option the simulated user chooses for each item, in order
#                   (null: the user declines the item); every item must also be read word for word
#   score           questionnaire: the score the code computes from those answers by the rule
#                   of the instrument (sum or mean, reversed items, the values of the options;
#                   declined items left out), compared as score_ok

scenarios:

  - id: sf_coffee
    strategy: slot_filling
    goal:
      task_description: "Take a coffee order: the drink, its size and the customer's name"
      dialog_mode: slot_filling
      domain: coffee shop
      frame_schema_json: >
        {"slots": [
          {"name": "drink", "type": "str",
           "canonical_values": ["espresso", "latte", "cappuccino", "americano", "tea"]},
          {"name": "size", "type": "str", "canonical_values": ["small", "medium", "large"]},
          {"name": "milk", "type": "str", "canonical_values": ["whole", "skimmed", "oat", "soy"],
           "condition_slot": "drink", "condition_value": "latte"},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      You want a medium latte with oat milk. Your name is Laura. Confirm the order when the
      robot reads it back and it is right; correct it if it is wrong.
    goal_items:
      - {id: drink, value: "latte"}
      - {id: size, value: "medium"}
      - {id: milk, value: "oat"}
      - {id: customer_name, value: "Laura"}
    expect:
      outcome: success
      frame: {drink: latte, size: medium, milk: oat, customer_name: Laura}

  - id: sf_clinic
    strategy: slot_filling
    goal:
      task_description: "Register a patient for a physiotherapy appointment"
      dialog_mode: slot_filling
      domain: health centre
      frame_schema_json: >
        {"slots": [
          {"name": "full_name", "type": "str"},
          {"name": "age", "type": "int", "minimum": 18, "maximum": 110},
          {"name": "pain_area", "type": "str",
           "canonical_values": ["back", "neck", "shoulder", "knee", "hip", "other"]},
          {"name": "preferred_day", "type": "str",
           "canonical_values": ["monday", "tuesday", "wednesday", "thursday", "friday"]}]}
    user_goal: >
      You are Pedro Ruiz, 72 years old. Your knee hurts. You prefer Thursday. Confirm the data
      when the robot reads it back and it is right; correct it if it is wrong.
    goal_items:
      - {id: full_name, value: "Pedro Ruiz"}
      - {id: age, value: 72}
      - {id: pain_area, value: "knee"}
      - {id: preferred_day, value: "thursday"}
    expect:
      outcome: success
      frame: {full_name: Pedro Ruiz, age: 72, pain_area: knee, preferred_day: thursday}

  - id: ex_fasting
    strategy: explanation
    goal:
      task_description: "Explain the fasting instructions before tomorrow's surgery"
      dialog_mode: explanation
      domain: hospital
      resources_json: >
        [{"name": "fasting", "description": "fasting protocol",
          "content": "No solid food from midnight. Clear water is allowed until 6 am. Take the usual blood pressure pill at 6 am with a sip of water. No chewing gum or sweets."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"No solid food from midnight\", \"Clear water is allowed until 6 am\", \"Take the blood pressure pill at 6 am with a sip of water\", {\"point\": \"No chewing gum or sweets\", \"critical\": false}]}"}]
    user_goal: >
      You will have surgery tomorrow. Listen to the instructions. Ask once whether you can take
      your blood pressure pill. When the robot asks you to say it in your own words, say it all
      correctly except the water: you believe water is allowed until 8 am. When it corrects you,
      say it back correctly.
    goal_items:
      - {id: question_pill, value: "whether you can take your blood pressure pill"}
      - {id: solid_food, value: "no solid food from midnight"}
      - {id: water, value: "clear water allowed until 8 am", then: "clear water allowed until 6 am"}
      - {id: pill, value: "take the blood pressure pill at 6 am with a sip of water"}
    expect:
      outcome: success
      understood: true

  - id: ex_bus
    strategy: explanation
    goal:
      task_description: "Explain how to get from the residence to the day centre by bus"
      dialog_mode: explanation
      domain: nursing home
      resources_json: >
        [{"name": "route", "description": "bus route",
          "content": "Take bus 23 at the stop in front of the residence. Get off at the fourth stop, Plaza Mayor. The day centre is the building with the green door, 50 metres to the left."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Take bus 23 at the stop in front of the residence\", \"Get off at the fourth stop, Plaza Mayor\", \"The day centre is the building with the green door, 50 metres to the left\"]}"}]
    user_goal: >
      You need to go to the day centre. The first time the robot explains it, say you did not
      quite follow which stop to get off at. When it explains again and asks you to say it back,
      say it all correctly.
    goal_items:
      - {id: clarification, value: "did not quite follow which stop to get off at"}
      - {id: bus, value: "take bus 23 at the stop in front of the residence"}
      - {id: stop, value: "get off at the fourth stop, Plaza Mayor"}
      - {id: building, value: "the day centre is the building with the green door, 50 metres to the left"}
    expect:
      outcome: success
      understood: true

  - id: qz_geography
    strategy: quiz
    goal:
      task_description: "Run a short geography quiz"
      dialog_mode: quiz
      resources_json: >
        [{"name": "questions", "description": "quiz bank",
          "content": "[{\"question\": \"What is the capital of Italy?\", \"answer\": \"Rome\"}, {\"question\": \"Which is the longest river in Africa?\", \"answer\": \"The Nile\"}, {\"question\": \"On which continent is Peru?\", \"answer\": \"South America\"}]"}]
    user_goal: >
      You are doing a quiz. Answer the first question correctly (Rome), the second one wrongly
      (say the Congo) and the third one correctly but in your own words (it is in South
      America).
    goal_items:
      - {id: q1, value: "Rome"}
      - {id: q2, value: "the Congo"}
      - {id: q3, value: "it is in South America"}
    expect:
      outcome: success
      quiz_correct: [true, false, true]

  - id: qz_memory
    strategy: quiz
    goal:
      task_description: "A memory exercise about this morning's activity"
      dialog_mode: quiz
      domain: day centre
      resources_json: >
        [{"name": "questions", "description": "quiz bank",
          "content": "[{\"question\": \"What did we plant this morning?\", \"answer\": \"tomatoes\"}, {\"question\": \"How many pots did we use?\", \"answer\": \"6\"}, {\"question\": \"What colour were the gloves?\", \"answer\": \"yellow\"}]"}]
    user_goal: >
      You took part in the gardening activity this morning: you planted tomatoes, in six pots,
      with yellow gloves. Answer the first question correctly, the second one wrongly (say
      eight pots), and the third correctly.
    goal_items:
      - {id: q1, value: "tomatoes"}
      - {id: q2, value: "eight pots"}
      - {id: q3, value: "yellow"}
    expect:
      outcome: success
      quiz_correct: [true, false, true]

  - id: pr_shoulder
    strategy: procedure
    goal:
      task_description: "Guide a short shoulder warm-up"
      dialog_mode: procedure
      domain: physiotherapy
      resources_json: >
        [{"name": "steps", "description": "warm-up steps",
          "content": "[\"Sit up straight with your feet flat on the floor\", {\"step\": \"Roll your shoulders back slowly five times\", \"check\": \"no pain\"}, \"Raise both arms to shoulder height and hold for five seconds\", \"Lower your arms slowly and breathe out\"]"}]
    user_goal: >
      You do the exercise. Do each step and say when you have done it. On the third step, say
      it hurts a little to raise your arms; after the robot's help, do it and say it is done.
    goal_items:
      - {id: step_1, value: "done"}
      - {id: step_2, value: "done"}
      - {id: step_3, value: "it hurts a little to raise the arms", then: "done"}
      - {id: step_4, value: "done"}
    expect:
      outcome: success
      step_status: [done, done, done, done]

  - id: pr_tea
    strategy: procedure
    goal:
      task_description: "Guide the user to prepare a cup of tea"
      dialog_mode: procedure
      domain: kitchen
      resources_json: >
        [{"name": "steps", "description": "recipe",
          "content": "[\"Fill the kettle with water and switch it on\", \"Put a tea bag in the cup\", \"Pour the hot water into the cup\", \"Wait three minutes and remove the tea bag\", \"Add milk or sugar if you like\"]"}]
    user_goal: >
      You are making tea. Do each step and say when you have done it. You do not take milk or
      sugar: when the last step comes, say you want to skip it.
    goal_items:
      - {id: step_1, value: "done"}
      - {id: step_2, value: "done"}
      - {id: step_3, value: "done"}
      - {id: step_4, value: "done"}
      - {id: step_5, value: "skip it"}
    expect:
      outcome: success
      step_status: [done, done, done, done, skipped]

  - id: rp_interview
    strategy: roleplay
    goal:
      task_description: "Practise a job interview"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "scene", "description": "roleplay scene",
          "content": "{\"scenario\": \"Interview for a job as a shop assistant in a bookshop\", \"role\": \"The bookshop manager: friendly but asks for concrete examples\", \"user_goal\": \"Get the job\", \"criteria\": [\"Answers clearly\", \"Gives concrete examples\", \"Shows motivation\"], \"max_exchanges\": 6}"}]
    user_goal: >
      You are practising a job interview for a bookshop. Answer as a candidate who loves books
      and worked two summers in a supermarket. Answer clearly and show you want the job, but never
      give a concrete example: always answer in general terms ("I am good with people"), even when
      you are asked for one. Keep going until the robot ends the practice.
    goal_items:
      - {id: loves_books, value: "loves books"}
      - {id: experience, value: "worked two summers in a supermarket"}
    expect:
      outcome: success
      criteria: ["Answers clearly", "Gives concrete examples", "Shows motivation"]
      weak_criterion: "Gives concrete examples"

  - id: rp_doctor
    strategy: roleplay
    goal:
      task_description: "Practise explaining your symptoms to a doctor in English"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "scene", "description": "roleplay scene",
          "content": "{\"scenario\": \"A visit to the general practitioner\", \"role\": \"The doctor: patient, asks one question at a time\", \"criteria\": [\"Describes the symptoms\", \"Answers the questions\"], \"max_exchanges\": 6}"}]
    user_goal: >
      You are practising a visit to the doctor. You have had a sore throat and a mild fever
      for three days. Describe your symptoms well, but do not answer the doctor's questions:
      when you are asked something, talk about something else. After three of your answers, say
      you would like to stop the practice now.
    goal_items:
      - {id: symptoms, value: "a sore throat and a mild fever for three days"}
      - {id: stop, value: "would like to stop the practice now"}
    expect:
      outcome: success
      criteria: ["Describes the symptoms", "Answers the questions"]
      weak_criterion: "Answers the questions"

  # ==== E1: more slot filling ====

  - id: sf_pizza
    strategy: slot_filling
    goal:
      task_description: "Take a pizza order for delivery or pick-up"
      dialog_mode: slot_filling
      domain: pizzeria
      frame_schema_json: >
        {"slots": [
          {"name": "size", "type": "str", "canonical_values": ["small", "medium", "large"]},
          {"name": "toppings", "type": "list_str",
           "canonical_values": ["cheese", "ham", "mushrooms", "olives", "pepperoni", "onion"]},
          {"name": "delivery", "type": "bool"},
          {"name": "address", "type": "str", "condition_slot": "delivery", "condition_value": "true"}]}
    user_goal: >
      You want a large pizza with mushrooms and olives, delivered to Calle Mayor 5. Confirm when
      the robot reads the order back and it is right; correct it if it is wrong.
    goal_items:
      - {id: size, value: "large"}
      - {id: toppings, value: "mushrooms and olives"}
      - {id: delivery, value: "yes"}
      - {id: address, value: "Calle Mayor 5"}
    expect:
      outcome: success
      frame: {size: large, toppings: [mushrooms, olives], delivery: true, address: Calle Mayor 5}

  - id: sf_taxi
    strategy: slot_filling
    goal:
      task_description: "Book a taxi for a resident of the care home"
      dialog_mode: slot_filling
      domain: care home reception
      frame_schema_json: >
        {"slots": [
          {"name": "destination", "type": "str",
           "canonical_values": ["hospital", "train station", "airport", "town centre"]},
          {"name": "hour", "type": "int", "minimum": 7, "maximum": 22},
          {"name": "passengers", "type": "int", "minimum": 1, "maximum": 4},
          {"name": "wheelchair", "type": "bool"}]}
    user_goal: >
      You need a taxi to the hospital at 17:00 (five in the afternoon) for two people, and one
      of you uses a wheelchair. Confirm when the robot reads it back and it is right.
    goal_items:
      - {id: destination, value: "hospital"}
      - {id: hour, value: 17}
      - {id: passengers, value: 2}
      - {id: wheelchair, value: "yes"}
    expect:
      outcome: success
      frame: {destination: hospital, hour: 17, passengers: 2, wheelchair: true}

  - id: sf_meal
    strategy: slot_filling
    goal:
      task_description: "Ask a resident what they want for lunch tomorrow"
      dialog_mode: slot_filling
      domain: nursing home
      frame_schema_json: >
        {"slots": [
          {"name": "main_course", "type": "str", "canonical_values": ["fish", "chicken", "vegetarian lasagne"]},
          {"name": "side", "type": "str", "canonical_values": ["rice", "salad", "potatoes"]},
          {"name": "dessert", "type": "str", "canonical_values": ["fruit", "yogurt", "none"]},
          {"name": "allergies", "type": "bool"},
          {"name": "allergy_detail", "type": "str", "condition_slot": "allergies", "condition_value": "true"}]}
    user_goal: >
      For lunch tomorrow you want chicken with salad and fruit for dessert. You have no food
      allergies. Confirm when the robot reads it back and it is right.
    goal_items:
      - {id: main_course, value: "chicken"}
      - {id: side, value: "salad"}
      - {id: dessert, value: "fruit"}
      - {id: allergies, value: "no"}
    expect:
      outcome: success
      frame: {main_course: chicken, side: salad, dessert: fruit, allergies: false}

  - id: sf_library
    strategy: slot_filling
    goal:
      task_description: "Register a new member of the municipal library"
      dialog_mode: slot_filling
      domain: library
      frame_schema_json: >
        {"slots": [
          {"name": "full_name", "type": "str"},
          {"name": "age", "type": "int", "minimum": 6, "maximum": 110},
          {"name": "card_type", "type": "str", "canonical_values": ["child", "adult", "senior"]},
          {"name": "newsletter", "type": "bool"}]}
    user_goal: >
      You are Carmen Vidal, 70 years old, and want a senior card. You do not want the
      newsletter. When asked your age, say 17 by mistake. When the robot asks you the next
      question, first say you made a mistake and you are 70, then answer that question. Confirm when the robot reads it back and it is right.
    goal_items:
      - {id: full_name, value: "Carmen Vidal"}
      - {id: age, value: 17, then: 70}
      - {id: card_type, value: "senior"}
      - {id: newsletter, value: "no"}
    expect:
      outcome: success
      frame: {full_name: Carmen Vidal, age: 70, card_type: senior, newsletter: false}

  - id: sf_survey
    strategy: slot_filling
    goal:
      task_description: "Ask a visitor about their satisfaction with today's activity"
      dialog_mode: slot_filling
      domain: day centre
      frame_schema_json: >
        {"slots": [
          {"name": "activity", "type": "str", "canonical_values": ["music", "gardening", "gym", "cinema"]},
          {"name": "satisfaction", "type": "int", "minimum": 1, "maximum": 5},
          {"name": "would_repeat", "type": "bool"}]}
    user_goal: >
      Today you did the gardening activity. You rate it 4 out of 5 and you would repeat it.
      Confirm when the robot reads it back and it is right.
    goal_items:
      - {id: activity, value: "gardening"}
      - {id: satisfaction, value: 4}
      - {id: would_repeat, value: "yes"}
    expect:
      outcome: success
      frame: {activity: gardening, satisfaction: 4, would_repeat: true}

  - id: sf_visit
    strategy: slot_filling
    goal:
      task_description: "Schedule a family visit to a resident"
      dialog_mode: slot_filling
      domain: nursing home
      frame_schema_json: >
        {"slots": [
          {"name": "resident_name", "type": "str"},
          {"name": "day", "type": "str", "canonical_values": ["saturday", "sunday"]},
          {"name": "visitors", "type": "int", "minimum": 1, "maximum": 3},
          {"name": "bring_pet", "type": "bool"}]}
    user_goal: >
      You want to visit your mother, Rosa Martín, on Sunday with your husband (two visitors),
      without pets. If the robot says something you did not say, correct it. Confirm when it is
      right.
    goal_items:
      - {id: resident_name, value: "Rosa Martín"}
      - {id: day, value: "sunday"}
      - {id: visitors, value: 2}
      - {id: bring_pet, value: "no"}
    expect:
      outcome: success
      frame: {resident_name: Rosa Martín, day: sunday, visitors: 2, bring_pet: false}

  # ==== E1: more explanations ====

  - id: ex_pills
    strategy: explanation
    goal:
      task_description: "Explain the new medication schedule"
      dialog_mode: explanation
      domain: nursing home
      resources_json: >
        [{"name": "schedule", "description": "medication",
          "content": "The white pill (enalapril) is taken at 8 in the morning with breakfast. The yellow pill (omeprazole) is taken at 8 in the morning, before breakfast, on an empty stomach. The small blue pill (simvastatin) is taken at 10 at night."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"The white pill (enalapril) at 8 in the morning, with breakfast\", \"The yellow pill (omeprazole) at 8 in the morning, before breakfast, on an empty stomach\", \"The small blue pill (simvastatin) at 10 at night\"]}"}]
    user_goal: >
      You must learn your new pills. Ask which one goes on an empty stomach. When the robot asks
      you to say it back, say the three pills correctly.
    goal_items:
      - {id: question_empty_stomach, value: "which pill goes on an empty stomach"}
      - {id: white_pill, value: "the white pill at 8 in the morning, with breakfast"}
      - {id: yellow_pill, value: "the yellow pill at 8 in the morning, before breakfast, on an empty stomach"}
      - {id: blue_pill, value: "the small blue pill at 10 at night"}
    expect:
      outcome: success
      understood: true

  - id: ex_fire
    strategy: explanation
    goal:
      task_description: "Explain what to do if the fire alarm goes off"
      dialog_mode: explanation
      domain: day centre
      resources_json: >
        [{"name": "evacuation", "description": "fire protocol",
          "content": "If the alarm sounds, stop what you are doing, do not use the lift, walk to the nearest emergency exit following the green signs, and wait at the meeting point in the garden next to the fountain until a staff member counts everyone."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Do not use the lift\", \"Walk to the nearest emergency exit following the green signs\", \"Wait at the meeting point in the garden, next to the fountain, until a staff member counts everyone\", {\"point\": \"Stop what you are doing\", \"critical\": false}]}"}]
    user_goal: >
      Listen to the instructions. You understand them at once. When the robot asks you to say them
      back, only say that you understood and there is no need. If it then asks you a direct
      question, answer it correctly; if it asks you again to say it back, say it all correctly.
    goal_items:
      - {id: declines, value: "only says they understood and there is no need"}
      - {id: lift, value: "do not use the lift"}
      - {id: exit, value: "walk to the nearest emergency exit following the green signs"}
      - {id: meeting_point, value: "wait at the meeting point in the garden, next to the fountain, until a staff member counts everyone"}
    expect:
      outcome: success
      understood: true

  - id: ex_tablet
    strategy: explanation
    goal:
      task_description: "Explain how to make a video call to the family with the tablet"
      dialog_mode: explanation
      domain: nursing home
      resources_json: >
        [{"name": "video call", "description": "how-to",
          "content": "Unlock the tablet by pressing the round button. Touch the green icon with a camera called Family Call. Touch the photo of the person you want to call. To end the call, touch the red button at the bottom."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Unlock the tablet by pressing the round button\", \"Touch the green camera icon called Family Call\", \"Touch the photo of the person to call\", \"End the call with the red button at the bottom\"]}"}]
    user_goal: >
      You are not good with technology. The first time, say you do not understand what "unlock"
      means. When it is explained in another way, ask how to end the call. When the robot asks you
      to say it back, say everything except how to end the call (you forget it). When it reminds
      you, say it back correctly.
    goal_items:
      - {id: clarification, value: "does not understand what unlock means"}
      - {id: question_end_call, value: "how to end the call"}
      - {id: unlock, value: "unlock the tablet by pressing the round button"}
      - {id: camera, value: "touch the green camera icon called Family Call"}
      - {id: photo, value: "touch the photo of the person to call"}
      - {id: end_call, value: "end the call with the red button at the bottom"}
    expect:
      outcome: success
      understood: true

  - id: ex_recycling
    strategy: explanation
    goal:
      task_description: "Explain the recycling rules of the residence"
      dialog_mode: explanation
      domain: residence
      resources_json: >
        [{"name": "recycling", "description": "rules",
          "content": "Plastic and cans go in the yellow bin. Paper and cardboard go in the blue bin. Glass goes in the green bin, never with the lids. Food leftovers go in the brown bin."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Plastic and cans go in the yellow bin\", \"Paper and cardboard go in the blue bin\", \"Glass goes in the green bin, never with the lids\", \"Food leftovers go in the brown bin\"]}"}]
    user_goal: >
      Listen. Ask where the bottle lids go. When the robot asks you to say it back, say it all
      correctly.
    goal_items:
      - {id: question_lids, value: "where the bottle lids go"}
      - {id: yellow_bin, value: "plastic and cans go in the yellow bin"}
      - {id: blue_bin, value: "paper and cardboard go in the blue bin"}
      - {id: green_bin, value: "glass goes in the green bin, never with the lids"}
      - {id: brown_bin, value: "food leftovers go in the brown bin"}
    expect:
      outcome: success
      understood: true

  - id: ex_walker
    strategy: explanation
    goal:
      task_description: "Explain how to use the walker safely"
      dialog_mode: explanation
      domain: physiotherapy
      resources_json: >
        [{"name": "walker", "description": "safety",
          "content": "Adjust the handles to the height of your wrists. Move the walker one step ahead, then step into it with the weaker leg first and then the stronger one. Never lean over the front bar. Use the brakes before sitting down."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Adjust the handles to the height of your wrists\", \"Move the walker one step ahead, then step into it with the weaker leg first\", \"Never lean over the front bar\", \"Use the brakes before sitting down\"]}"}]
    user_goal: >
      Each time the robot asks you to say it back, say everything correctly except the legs: you
      say that the stronger leg goes first. Never get the leg right, even after a correction.
    goal_items:
      - {id: handles, value: "adjust the handles to the height of your wrists"}
      - {id: legs, value: "move the walker one step ahead, then step into it with the stronger leg first"}
      - {id: front_bar, value: "never lean over the front bar"}
      - {id: brakes, value: "use the brakes before sitting down"}
    expect:
      outcome: failed
      understood: false

