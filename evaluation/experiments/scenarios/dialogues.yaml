          "content": "{\"scenario\": \"An electronics shop\", \"role\": \"The shop assistant: reluctant to give refunds, offers a voucher first\", \"user_goal\": \"Get the money back for a radio that does not work\", \"criteria\": [\"Explains the problem\", \"Stays polite but firm\", \"Asks for the refund\"], \"max_exchanges\": 6}"}]
