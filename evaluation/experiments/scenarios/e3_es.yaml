# The scenarios of E3 (robustness of the shared mechanisms) in Spanish (Spain): the Spanish version
# of e3.yaml, with the same ids, the same structure, the same events (same turns and kinds) and the
# same ground truth. Everything the robot or the user says or reads is translated; the slot names,
# the JSON keys and the ids of the goal items stay as they are (they are identifiers), and the
# canonical values, the expected frames, the options and the values of the goal items use the
# Spanish values. The lines of the events keep the purpose of each mechanism (key `mechanism`, in
# English): the two exact English stop commands of e3.yaml become exact Spanish stop commands
# ("Cancela.", "Para."), decided without the LLM as in English (the exact commands of each
# language are in its language file, config/languages/spanish.yaml; until 2026-10-30 the list
# was English only and the LLM decided them). The turns of the events, the silences, the keys
# and the experiment files are described at the top of e3.yaml.
# No experiment runs this file since 2026-10-30 (E3 runs in English only: the method does not
# depend on the language): it serves the test panel (its Spanish examples of the mechanisms,
# scripts/test_panel_examples.yaml) and the tests of the scenarios (analysis/test_strategy_checks.py,
# scripts/tests/test_test_panel.py).
scenarios:

  # ==== Cancellation: requests that must end as cancelled (with the confirmation) ====

  - id: c_taxi_exact_closed
    strategy: slot_filling
    goal:
      task_description: "Pedir un taxi"
      dialog_mode: slot_filling
      domain: compañía de taxis
      frame_schema_json: >
        {"slots": [
          {"name": "vehicle", "type": "str",
           "canonical_values": ["coche normal", "furgoneta", "coche adaptado para silla de ruedas"]},
          {"name": "pickup", "type": "str",
           "canonical_values": ["ahora", "dentro de una hora", "esta noche"]}]}
    user_goal: >
      Quieres un taxi adaptado para silla de ruedas ahora, pero cambias de opinión: después de tu
      primera respuesta pides cancelarlo y, cuando el robot te pregunte si quieres terminar, dices
      que sí.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 3, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "an exact stop command while a closed-choice slot is asked (strict mode), confirmed"
    events:
      - {turn: 1, kind: text, text: "Un coche adaptado para silla de ruedas, por favor."}
      - {turn: 2, kind: cancel, text: "Cancela."}
      - {turn: 3, kind: text, text: "Sí."}

  - id: c_optician_exact_open
    strategy: slot_filling
    goal:
      task_description: "Dar cita para una revisión de la vista en la óptica"
      dialog_mode: slot_filling
      domain: óptica
      frame_schema_json: >
        {"slots": [
          {"name": "customer_name", "type": "str"},
          {"name": "phone", "type": "str"}]}
    user_goal: >
      Quieres pedir cita para una revisión de la vista; te llamas Pablo Ortega. Después de tu
      primera respuesta pides parar y, cuando el robot te pregunte si quieres terminar, dices que sí.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 3, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "an exact stop command while an open slot is asked, confirmed"
    events:
      - {turn: 1, kind: text, text: "Me llamo Pablo Ortega."}
      - {turn: 2, kind: cancel, text: "Para."}
      - {turn: 3, kind: text, text: "Sí, por favor."}

  - id: c_gym_phrase_closed
    strategy: slot_filling
    goal:
      task_description: "Reservar plaza en una clase del polideportivo"
      dialog_mode: slot_filling
      domain: gimnasio
      frame_schema_json: >
        {"slots": [
          {"name": "class", "type": "str",
           "canonical_values": ["yoga", "spinning", "pilates", "aquagym"]},
          {"name": "day", "type": "str",
           "canonical_values": ["lunes", "miércoles", "viernes"]}]}
    user_goal: >
      Quieres una clase de spinning, pero después de tu primera respuesta decides dejar la reserva
      para otro día; cuando el robot te pregunte si quieres terminar, dices que sí.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 3, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "a request to stop in other words while a closed-choice slot is asked (strict mode, decided by the LLM), confirmed"
    events:
      - {turn: 1, kind: text, text: "Spinning, por favor."}
      - {turn: 2, kind: cancel, text: "Espera, espera, mejor lo dejo y reservo otro día."}
      - {turn: 3, kind: text, text: "Sí."}

  - id: c_quiz_phrase
    strategy: quiz
    goal:
      task_description: "Un pequeño juego de preguntas sobre ríos y montañas"
      dialog_mode: quiz
      resources_json: >
        [{"name": "preguntas", "description": "banco de preguntas",
          "content": "[{\"question\": \"¿Qué río es el más largo de España?\", \"answer\": \"el Tajo\"}, {\"question\": \"¿Cuál es la montaña más alta de Europa fuera del Cáucaso?\", \"answer\": \"el Mont Blanc\"}, {\"question\": \"¿En qué mar desemboca el Ebro?\", \"answer\": \"el Mediterráneo\"}]"}]
    user_goal: >
      Responde a la primera pregunta. Después te cansas y pides terminar el juego; cuando el robot
      te pregunte si quieres terminar, dices que sí.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 2, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "a request to stop in other words during a quiz, confirmed"
    events:
      - {turn: 2, kind: cancel, text: "Estoy cansado, ¿podemos acabar ya con las preguntas?"}
      - {turn: 3, kind: text, text: "Sí, por hoy ya está bien."}

  - id: c_procedure_phrase
    strategy: procedure
    goal:
      task_description: "Guiar al usuario para trasplantar una planta de interior"
      dialog_mode: procedure
      domain: jardinería
      resources_json: >
        [{"name": "pasos", "description": "trasplantar una planta",
          "content": "[\"Pon un poco de sustrato nuevo en el fondo de la maceta nueva\", \"Saca la planta de la maceta vieja sujetándola por la base\", \"Coloca la planta en la maceta nueva y rellena los lados con sustrato\", \"Riega un poco la planta\"]"}]
    user_goal: >
      Estás trasplantando una planta. Haz el primer paso y dilo. Después decides no seguir; cuando
      el robot te pregunte si quieres terminar, dices que sí.
    expect:
      mechanisms: {cancel_asked: 1, cancel_confirmed: 1, events_applied: 2, closing_said: true}
      outcome: cancelled
      ending: cancelled
    mechanism: "a request to stop in other words during a procedure, confirmed"
    events:
      - {turn: 2, kind: cancel, text: "Lo voy a dejar aquí, no me apetece seguir con esto."}
      - {turn: 3, kind: text, text: "Sí."}

  # ==== Cancellation: requests that do not end the conversation ====

  - id: c_explanation_denied
    strategy: explanation
    goal:
      task_description: "Explicar cómo renovar el carné de la biblioteca"
      dialog_mode: explanation
      domain: biblioteca pública
      resources_json: >
        [{"name": "instrucciones", "description": "renovar el carné",
          "content": "El carné de la biblioteca se renueva en el mostrador de información de la planta baja. Hay que traer un documento de identidad y el carné antiguo. La renovación es gratuita y el carné nuevo se entrega en el momento."},
         {"name": "puntos clave", "description": "lo que la persona debe poder contar", "content": "{\"key_points\": [\"Renovarlo en el mostrador de información de la planta baja\", \"Traer un documento de identidad y el carné antiguo\", {\"point\": \"Es gratis y se entrega en el momento\", \"critical\": false}]}"}]
    user_goal: >
      Quieres renovar el carné de la biblioteca. Después de la primera explicación del robot dudas
      y te planteas dejarlo; cuando el robot te pregunte si quieres terminar, dices que no y sigues.
      Cuando te pida que lo cuentes con tus palabras, cuéntalo todo bien.
    expect:
      mechanisms: {cancel_asked: 1, cancel_denied: 1, events_applied: 2, closing_said: true}
      outcome: success
      understood: true
      ending: completed
    mechanism: "an ambiguous request to stop, denied: the robot resumes with what it had asked"
    events:
      - {turn: 1, kind: cancel, text: "No sé... a lo mejor deberíamos dejarlo."}
      - {turn: 2, kind: text, text: "No, no, sigue, por favor."}

  - id: c_florist_content_kept
    strategy: slot_filling
    goal:
      task_description: "Tomar nota de un pedido de flores a domicilio"
      dialog_mode: slot_filling
      domain: floristería
      frame_schema_json: >
        {"slots": [
          {"name": "flowers", "type": "str",
           "canonical_values": ["rosas", "tulipanes", "girasoles"]},
          {"name": "recipient_name", "type": "str"}]}
    user_goal: >
      Quieres enviar tulipanes a Carmen Ruiz. Confirma el pedido cuando el robot te lo repita y
      esté bien; corrígelo si está mal.
    expect:
      mechanisms: {cancel_asked: 1, cancel_denied: 1, events_applied: 3, closing_said: true}
      outcome: success
      frame: {flowers: tulipanes, recipient_name: Carmen Ruiz}
      ending: completed
    mechanism: "an ambiguous request to stop whose confirmation is answered with the value asked: only a yes stops, so the robot resumes and asks again (since 2026-11-01)"
    events:
      - {turn: 1, kind: text, text: "Unos tulipanes, por favor."}
      - {turn: 2, kind: cancel, text: "Ay, igual debería olvidarme de todo esto..."}
      - {turn: 3, kind: text, text: "Son para Carmen Ruiz."}

  # ==== Apparent cancellations: cancel-like words that belong to the task ====

  - id: a_bank_cancel_value
    strategy: slot_filling
    goal:
      task_description: "Atender una petición en el mostrador del banco"
      dialog_mode: slot_filling
      domain: banco
      frame_schema_json: >
        {"slots": [
          {"name": "request", "type": "str",
           "canonical_values": ["abrir una cuenta", "cancelar una tarjeta", "cambiar la dirección"]},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      Has perdido tu tarjeta del banco y quieres cancelarla. Te llamas Javier Soto. Confirma cuando
      el robot te lo repita y esté bien; corrígelo si está mal.
    goal_items:
      - {id: customer_name, value: Javier Soto}
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 1, closing_said: true}
      outcome: success
      frame: {request: cancelar una tarjeta, customer_name: Javier Soto}
      ending: completed
    mechanism: "an apparent cancellation: the value of a closed-choice slot (strict mode)"
    events:
      - {turn: 1, kind: text, text: "Necesito cancelar mi tarjeta, la he perdido."}

  - id: a_newspaper_stop_value
    strategy: slot_filling
    goal:
      task_description: "Atender una petición para suspender el reparto del periódico"
      dialog_mode: slot_filling
      domain: quiosco de prensa
      frame_schema_json: >
        {"slots": [
          {"name": "days_paused", "type": "int", "minimum": 1, "maximum": 30},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      Te vas de viaje y quieres que suspendan el reparto del periódico durante diez días. Te llamas
      Elena Prieto. Confirma cuando el robot te lo repita y esté bien; corrígelo si está mal.
    goal_items:
      - {id: customer_name, value: Elena Prieto}
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 1, closing_said: true}
      outcome: success
      frame: {days_paused: 10, customer_name: Elena Prieto}
      ending: completed
    mechanism: "an apparent cancellation: a stop word inside the value of an open slot"
    events:
      - {turn: 1, kind: text, text: "Quiero parar el reparto del periódico diez días, que me voy de viaje."}

  - id: a_quiz_stop_answer
    strategy: quiz
    goal:
      task_description: "Un pequeño juego de preguntas sobre cómo moverse por la ciudad"
      dialog_mode: quiz
      resources_json: >
        [{"name": "preguntas", "description": "banco de preguntas",
          "content": "[{\"question\": \"¿Cómo se llama el sitio donde el autobús recoge a los pasajeros?\", \"answer\": \"una parada de autobús\"}, {\"question\": \"¿Qué necesitas para viajar en metro?\", \"answer\": \"un billete\"}, {\"question\": \"¿De qué color es un taxi en Nueva York?\", \"answer\": \"amarillo\"}]"}]
    user_goal: >
      Responde bien a todas las preguntas (una parada de autobús, un billete, amarillo).
    goal_items:
      - {id: q2, value: un billete}
      - {id: q3, value: amarillo}
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 1, closing_said: true}
      outcome: success
      quiz_correct: [true, true, true]
      ending: completed
    mechanism: "an apparent cancellation: a stop word as a quiz answer"
    events:
      - {turn: 1, kind: text, text: "Eso es una parada de autobús."}

  - id: a_microwave_cancel_step
    strategy: procedure
    goal:
      task_description: "Guiar al usuario para calentar un plato en el microondas"
      dialog_mode: procedure
      domain: cocina
      resources_json: >
        [{"name": "pasos", "description": "calentar un plato",
          "content": "[\"Mete el plato en el microondas y cierra la puerta\", \"Pulsa el botón de cancelar para borrar el tiempo anterior\", \"Pon dos minutos y pulsa el botón de inicio\", \"Saca el plato con cuidado, que estará caliente\"]"}]
    user_goal: >
      Estás calentando un plato. Haz cada paso y di cuándo lo has hecho.
    goal_items:
      - {id: step_1, value: hecho}
      - {id: step_3, value: hecho}
      - {id: step_4, value: hecho}
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 1, closing_said: true}
      outcome: success
      step_status: [done, done, done, done]
      ending: completed
    mechanism: "an apparent cancellation: a cancel word in the report of a step"
    events:
      - {turn: 2, kind: text, text: "Hecho, ya le he dado a cancelar."}

  # ==== Confirmation of the data: corrections and questions at the read-back ====

  - id: d_cinema_correct
    strategy: slot_filling
    goal:
      task_description: "Vender entradas de cine"
      dialog_mode: slot_filling
      domain: cine
      frame_schema_json: >
        {"slots": [
          {"name": "film", "type": "str",
           "canonical_values": ["El faro", "Lluvia de verano", "El último tren"]},
          {"name": "session", "type": "str", "canonical_values": ["17:00", "19:30", "22:00"]},
          {"name": "tickets", "type": "int", "minimum": 1, "maximum": 10}]}
    user_goal: >
      Quieres tres entradas para El faro a las 19:30. Confirma cuando el robot te repita el pedido
      y esté bien; corrígelo si está mal.
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 2, closing_said: true}
      outcome: success
      frame: {film: El faro, session: "19:30", tickets: 3}
      ending: completed
    mechanism: "a correction at the read-back (a number)"
    events:
      - {turn: 1, kind: text, text: "Dos entradas para El faro a las 19:30."}
      - {turn: 2, kind: text, text: "No, perdona, son tres entradas, no dos."}

  - id: d_bike_correct
    strategy: slot_filling
    goal:
      task_description: "Alquilar una bicicleta"
      dialog_mode: slot_filling
      domain: alquiler de bicicletas
      frame_schema_json: >
        {"slots": [
          {"name": "bike", "type": "str",
           "canonical_values": ["bici de paseo", "bici eléctrica", "tándem"]},
          {"name": "hours", "type": "int", "minimum": 1, "maximum": 8},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      Quieres una bici de paseo para tres horas; te llamas Lucía Vidal. Confirma cuando el robot te
      lo repita y esté bien; corrígelo si está mal.
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 2, closing_said: true}
      outcome: success
      frame: {bike: bici de paseo, hours: 3, customer_name: Lucía Vidal}
      ending: completed
    mechanism: "a correction at the read-back (a closed-choice value)"
    events:
      - {turn: 1, kind: text, text: "Una bici eléctrica para tres horas. Me llamo Lucía Vidal."}
      - {turn: 2, kind: text, text: "Ay, espera, eléctrica no: una bici de paseo."}

  - id: d_pool_list_correct
    strategy: slot_filling
    goal:
      task_description: "Reservar actividades en la piscina"
      dialog_mode: slot_filling
      domain: piscina
      frame_schema_json: >
        {"slots": [
          {"name": "activities", "type": "list_str",
           "canonical_values": ["clases de natación", "aquagym", "baño libre", "sauna"]},
          {"name": "day", "type": "str", "canonical_values": ["sábado", "domingo"]}]}
    user_goal: >
      Quieres baño libre y aquagym el sábado. Confirma cuando el robot te lo repita y esté bien;
      corrígelo si está mal.
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 2, closing_said: true}
      outcome: success
      frame: {activities: [baño libre, aquagym], day: sábado}
      ending: completed
    mechanism: "a correction at the read-back that removes and adds items of a list"
    events:
      - {turn: 1, kind: text, text: "Baño libre y la sauna el sábado."}
      - {turn: 2, kind: text, text: "Bueno, quita la sauna y pon aquagym en su lugar."}

  - id: d_post_question
    strategy: slot_filling
    goal:
      task_description: "Admitir un paquete en la ventanilla de correos"
      dialog_mode: slot_filling
      domain: oficina de correos
      frame_schema_json: >
        {"slots": [
          {"name": "destination", "type": "str", "canonical_values": ["nacional", "internacional"]},
          {"name": "weight_kg", "type": "float", "minimum": 0.1, "maximum": 30},
          {"name": "insured", "type": "bool"}]}
      resources_json: >
        [{"name": "plazos de entrega", "description": "lo que el robot puede responder",
          "content": "Los paquetes nacionales llegan en dos días laborables. Los paquetes internacionales llegan en un plazo de cinco a ocho días laborables."}]
    user_goal: >
      Envías un paquete internacional de 2 kilos, con seguro. Confirma cuando el robot te lo
      repita y esté bien; corrígelo si está mal.
    expect:
      mechanisms: {cancel_asked: 0, events_applied: 2, closing_said: true}
      outcome: success
      frame: {destination: internacional, weight_kg: 2, insured: true}
      ending: completed
    mechanism: "a question at the read-back: answered from the resources, then the confirmation asked again"
    events:
      - {turn: 1, kind: text, text: "Un paquete internacional de dos kilos, con seguro."}
      - {turn: 2, kind: text, text: "Espera, ¿y cuánto tarda en llegar?"}

  # ==== Recovery per element ====

  - id: r_sf_ladder
    strategy: slot_filling
    goal:
      task_description: "Registrar a una visita en la recepción de un edificio de oficinas"
      dialog_mode: slot_filling
      domain: recepción de oficinas
      frame_schema_json: >
        {"slots": [
          {"name": "visitor_name", "type": "str"},
          {"name": "company", "type": "str", "canonical_values": ["Norte Logistics", "Arco Design", "Vela Legal"]}]}
    user_goal: >
      Vienes de visita; te llamas Marta Gil. Cuando el robot te pregunte a qué empresa vienes, no
      eres capaz de responder. Confirma el registro cuando el robot te lo repita.
    expect:
      mechanisms: {events_applied: 5, closing_said: true}
      outcome: success
      frame: {visitor_name: Marta Gil}
      unanswered: [company]
      ending: partial
    mechanism: "the recovery ladder of a slot: asked again, asked as a closed question, left unanswered"
    events:
      - {turn: 1, kind: text, text: "Soy Marta Gil."}
      - {turn: 2, kind: text, text: "Ventana amarilla siete el río."}
      - {turn: 3, kind: text, text: "Mesa la de verde enfrente."}
      - {turn: 4, kind: text, text: "Sobre martes la luna papel."}
      - {turn: 5, kind: text, text: "Tetera junto al norte azul."}

  - id: r_quiz_unanswered
    strategy: quiz
    goal:
      task_description: "Un pequeño juego de preguntas sobre el cuerpo humano"
      dialog_mode: quiz
      resources_json: >
        [{"name": "preguntas", "description": "banco de preguntas",
          "content": "[{\"question\": \"¿Cuántos pulmones tiene una persona?\", \"answer\": \"dos\"}, {\"question\": \"¿Qué órgano bombea la sangre?\", \"answer\": \"el corazón\"}, {\"question\": \"¿Cuál es el hueso más grande del cuerpo?\", \"answer\": \"el fémur\"}]"}]
    user_goal: >
      Responde bien a la primera pregunta (dos). No consigues entender la segunda pregunta de
      ninguna manera. Responde bien a la tercera pregunta (el fémur).
    expect:
      mechanisms: {events_applied: 3, closing_said: true}
      outcome: success
      ending: partial
    mechanism: "the recovery ladder of a quiz question: literal repeat, simpler words, left unanswered"
    events:
      - {turn: 2, kind: text, text: "Perdona, ¿qué? No me he enterado."}
      - {turn: 3, kind: text, text: "Sigo sin entender qué me estás preguntando."}
      - {turn: 4, kind: text, text: "No, lo siento, no te sigo."}

  - id: r_questionnaire_between
    strategy: questionnaire
    goal:
      task_description: "Hacer a quien visita el jardín botánico la encuesta de satisfacción"
      dialog_mode: questionnaire
      domain: jardín botánico
      resources_json: '[{"name": "instrument", "description": "the questionnaire", "content": "{\"name\":
        \"Visita al jardín\", \"instructions\": \"Te voy a hacer tres preguntas cortas sobre tu visita.\",
        \"options\": [\"Nada\", \"Un poco\", \"Bastante\", \"Mucho\"], \"items\": [\"¿Cuánto te ha gustado
        el invernadero?\", \"¿Hasta qué punto eran claros los carteles de los caminos?\", \"¿Hasta qué punto
        es probable que vuelvas?\"]}"}]'
    user_goal: >
      Responde la encuesta: el invernadero te ha gustado mucho; en la segunda pregunta no consigues
      decidirte entre dos opciones; es bastante probable que vuelvas.
    expect:
      mechanisms: {events_applied: 3, closing_said: true}
      outcome: success
      answers: ["Mucho", null, "Bastante"]
      score: 7
      ending: partial
    mechanism: "the recovery ladder of a questionnaire item: answers between options, then the item without an answer"
    events:
      - {turn: 2, kind: text, text: "Yo diría que entre un poco y bastante."}
      - {turn: 3, kind: text, text: "No sé elegir entre esas dos."}
      - {turn: 4, kind: text, text: "La verdad, mitad una cosa y mitad la otra."}

  # ==== Communication breakdown: max_stalled turns in a row without progress ====

  - id: b_slot_filling
    strategy: slot_filling
    goal:
      task_description: "Reservar una mesa en el restaurante"
      dialog_mode: slot_filling
      domain: restaurante
      frame_schema_json: >
        {"slots": [
          {"name": "guests", "type": "int", "minimum": 1, "maximum": 12},
          {"name": "time", "type": "str", "canonical_values": ["13:30", "14:30", "21:00"]}]}
    user_goal: >
      Quieres una mesa para cuatro a las 21:00. Cuando el robot te lea la reserva, te confundes y
      no consigues responder.
    expect:
      mechanisms: {events_applied: 5, closing_said: true}
      outcome: failed
      ending: breakdown
    mechanism: "breakdown in slot filling: four unclear answers in a row to the read-back (while gathering, the ladder leaves the slot unanswered first, which is progress)"
    events:
      - {turn: 1, kind: text, text: "Una mesa para cuatro a las 21:00, por favor."}
      - {turn: 2, kind: text, text: "Ventana amarilla siete el río."}
      - {turn: 3, kind: text, text: "Mesa la de verde enfrente."}
      - {turn: 4, kind: text, text: "Sobre martes la luna papel."}
