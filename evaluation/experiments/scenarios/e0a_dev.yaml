# The development scenarios of E0a (phase B: whole dialogues of the finalist local models), in
# English; e0a_dev_es.yaml is the Spanish version (same ids, same structure, same ground truth).
# Three per strategy for the seven strategies, 21 in all. They are used only to choose the local
# model: their domains and content are disjoint from every scenario of E1-E4 (dialogues.yaml,
# dialogues_es.yaml, e4_es.yaml) and from the examples of the system's prompts, so that the model
# is not chosen on the material it is later evaluated on. Domains: bakery, hair salon, plumbing,
# laundrette, campsite, beach, astronomy, road safety, calendar, household repairs, sewing, paper
# crafts, neighbours, car repair garage, flea market, theatre, ski resort, amusement park, public
# parks, leisure habits, volunteering.
#
# Keys: as in dialogues.yaml (goal, user_goal, expect and its keys, events). The shared
# mechanisms are exercised through planned events, spread over the set: a cancel request that the
# user then denies (sf_dev_hair), two silences (qz_dev_road, pr_dev_lamp) and two requests to
# repeat (qz_dev_calendar, pr_dev_boat); and, through the user's goal, a request to repeat an
# answer (qa_dev_ski), a request for clarification (ex_dev_campsite, qn_dev_parks), an answer
# between two options (qn_dev_hobbies), a declined item (qn_dev_parks), a step the user gets stuck
# on (pr_dev_button), an optional step skipped (pr_dev_boat), a request for help (rp_dev_mechanic)
# and a request to stop a role play (rp_dev_market).
#
# goal_items: what the simulated user must say, for the adherence check of the simulated user
# (simulation/interaction_sim/interaction_sim/goal_items.py, analysis/adherence.py); user_goal says
# the same in free text. A list, in the planned order (answers, steps, questions, items), of:
#   id     short, unique within the scenario (the same in both languages)
#   value  what the user says, in the language of the file: a slot value (slot filling, where the
#          id is the slot name), an answer (quiz), the report of a step (procedure), a fact or act
#          of the user's part (role play), the topic of a question (grounded QA), the chosen option
#          or the refusal of a declined item (questionnaire), a key point said back (explanation)
#   then   optional: the value the user gives afterwards in place of `value` (a planned
#          correction; in an explanation, the corrected restatement after a planned misconception)
# The lines fixed by events are injected by code and are not goal items. What the user must not do
# (the weak criterion of a role play) is in user_goal and expect only.

scenarios:

  # ==== Slot filling ====

  - id: sf_dev_cake
    strategy: slot_filling
    goal:
      task_description: "Take an order for a celebration cake"
      dialog_mode: slot_filling
      domain: bakery
      frame_schema_json: >
        {"slots": [
          {"name": "flavour", "type": "str",
           "canonical_values": ["chocolate", "lemon", "carrot", "almond"]},
          {"name": "portions", "type": "int", "minimum": 6, "maximum": 30},
          {"name": "pickup_day", "type": "str", "canonical_values": ["friday", "saturday", "sunday"]},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      You want a cake for 12 people, to pick it up on Saturday. Your name is Julia Moreno. When
      you are asked the flavour, say lemon. When the robot asks you the next question, first say
      you have changed your mind and want almond instead of lemon, then answer that question.
      Confirm the order when the robot reads it back and it is right; correct it if it is wrong.
    goal_items:
      - {id: flavour, value: lemon, then: almond}
      - {id: portions, value: 12}
      - {id: pickup_day, value: saturday}
      - {id: customer_name, value: Julia Moreno}
    expect:
      outcome: success
      frame: {flavour: almond, portions: 12, pickup_day: saturday, customer_name: Julia Moreno}

  - id: sf_dev_hair
    strategy: slot_filling
    goal:
      task_description: "Book an appointment at the hair salon"
      dialog_mode: slot_filling
      domain: hair salon
      frame_schema_json: >
        {"slots": [
          {"name": "service", "type": "str",
           "canonical_values": ["haircut", "colour", "wash and blow-dry", "beard trim"]},
          {"name": "day", "type": "str",
           "canonical_values": ["tuesday", "wednesday", "thursday", "friday", "saturday"]},
          {"name": "hour", "type": "int", "minimum": 9, "maximum": 19},
          {"name": "customer_name", "type": "str"}]}
    user_goal: >
      You want a haircut on Wednesday at 11 in the morning. Your name is Andrés Gil. Confirm when
      the robot reads it back and it is right; correct it if it is wrong. If the robot asks
      whether you want to stop, say no and go on with the booking.
    goal_items:
      - {id: service, value: haircut}
      - {id: day, value: wednesday}
      - {id: hour, value: 11}
      - {id: customer_name, value: Andrés Gil}
    expect:
      outcome: success
      frame: {service: haircut, day: wednesday, hour: 11, customer_name: Andrés Gil}
    # A cancel request, then denied: the booking must go on with what was already given
    events:
      - {turn: 2, kind: cancel, text: "Wait, stop."}
      - {turn: 3, kind: text, text: "No, no, let's go on with the booking."}

  - id: sf_dev_plumber
    strategy: slot_filling
    goal:
      task_description: "Book a visit from the plumber"
      dialog_mode: slot_filling
      domain: plumbing
      frame_schema_json: >
        {"slots": [
          {"name": "problem", "type": "str",
           "canonical_values": ["leak", "blocked drain", "no hot water"]},
          {"name": "leak_place", "type": "str", "canonical_values": ["bathroom", "ceiling", "wall"],
           "condition_slot": "problem", "condition_value": "leak"},
          {"name": "urgent", "type": "bool"},
          {"name": "contact_name", "type": "str"}]}
    user_goal: >
      You have a leak: water is dripping from the ceiling. It is urgent. Your name is Elena
      Sanz. Confirm when the robot reads it back and it is right; correct it if it is wrong.
    goal_items:
      - {id: problem, value: leak}
      - {id: leak_place, value: ceiling}
      - {id: urgent, value: "yes"}
      - {id: contact_name, value: Elena Sanz}
    expect:
      outcome: success
      frame: {problem: leak, leak_place: ceiling, urgent: true, contact_name: Elena Sanz}

  # ==== Explanation (each with one planned misconception, corrected after the robot's repair) ====

  - id: ex_dev_laundrette
    strategy: explanation
    goal:
      task_description: "Explain how to wash a duvet at the self-service laundrette"
      dialog_mode: explanation
      domain: laundrette
      resources_json: >
        [{"name": "instructions", "description": "how to use the laundrette",
          "content": "Duvets and blankets go in the large machines, numbers 4 and 5. Pay at the central machine: choose the number of your machine and insert 5 euros. Wash coloured clothes at 40 degrees. When the wash ends, leave the door open so that the drum dries."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Duvets and blankets go in the large machines, numbers 4 and 5\", \"Pay at the central machine: choose the machine number and insert 5 euros\", \"Wash coloured clothes at 40 degrees\", {\"point\": \"Leave the door open when the wash ends\", \"critical\": false}]}"}]
    user_goal: >
      You want to wash a coloured duvet. Listen to the instructions and ask once how much a wash
      costs. When the robot asks you to say it in your own words, say it all correctly except
      the temperature: you believe coloured clothes are washed at 60 degrees. When it corrects
      you, say it back correctly.
    goal_items:
      - {id: question_price, value: how much a wash costs}
      - {id: machines, value: "the duvet goes in the large machines, 4 or 5"}
      - {id: payment, value: pay 5 euros at the central machine choosing the machine number}
      - {id: temperature, value: coloured clothes at 60 degrees, then: coloured clothes at 40 degrees}
    expect:
      outcome: success
      understood: true

  - id: ex_dev_campsite
    strategy: explanation
    goal:
      task_description: "Explain the rules of the campsite to a new guest"
      dialog_mode: explanation
      domain: campsite
      resources_json: >
        [{"name": "rules", "description": "campsite rules",
          "content": "Quiet hours are from 11 at night to 8 in the morning. Barbecues are only allowed in the barbecue area next to reception. Campfires are not allowed anywhere on the site. The showers work with tokens sold at reception."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Quiet hours are from 11 at night to 8 in the morning\", \"Barbecues only in the barbecue area next to reception\", \"No campfires anywhere on the site\", {\"point\": \"Shower tokens are sold at reception\", \"critical\": false}]}"}]
    user_goal: >
      You have just arrived at the campsite. The first time the robot explains the rules, say
      you did not catch when the quiet hours are. When the robot asks you to say the rules back,
      say them all correctly except the quiet hours: you believe they start at midnight. When it
      corrects you, say them back correctly.
    goal_items:
      - {id: clarification, value: did not catch when the quiet hours are}
      - {id: quiet_hours, value: quiet hours from midnight to 8 in the morning, then: quiet hours from 11 at night to 8 in the morning}
      - {id: barbecues, value: barbecues only in the area next to reception}
      - {id: campfires, value: no campfires anywhere}
    expect:
      outcome: success
      understood: true

  - id: ex_dev_beach_flags
    strategy: explanation
    goal:
      task_description: "Explain what the lifeguard flags on the beach mean"
      dialog_mode: explanation
      domain: beach
      resources_json: >
        [{"name": "flags", "description": "lifeguard flags",
          "content": "A green flag means that swimming is allowed. A yellow flag means that you may swim with caution, staying close to the shore. A red flag means that swimming is forbidden. A purple flag means that there are jellyfish in the water."},
         {"name": "key points", "description": "what the person must be able to say back", "content": "{\"key_points\": [\"Green flag: swimming is allowed\", \"Yellow flag: swim with caution, close to the shore\", \"Red flag: swimming is forbidden\", {\"point\": \"Purple flag: there are jellyfish in the water\", \"critical\": false}]}"}]
    user_goal: >
      You are at the beach with your grandchildren. Listen to the explanation. When the robot
      asks you to say it back, say it all correctly except the yellow flag: you believe it means
      that swimming is forbidden. When it corrects you, say the yellow flag correctly.
    goal_items:
      - {id: green, value: "green flag: swimming is allowed"}
      - {id: yellow, value: "yellow flag: swimming is forbidden", then: "yellow flag: swim with caution, close to the shore"}
      - {id: red, value: "red flag: swimming is forbidden"}
    expect:
      outcome: success
      understood: true

  # ==== Quiz ====

  - id: qz_dev_planets
    strategy: quiz
    goal:
      task_description: "A short quiz about the planets"
      dialog_mode: quiz
      domain: astronomy club
      resources_json: >
        [{"name": "questions", "description": "quiz bank",
          "content": "[{\"question\": \"Which planet is closest to the Sun?\", \"answer\": \"Mercury\"}, {\"question\": \"How many moons does Mars have?\", \"answer\": \"2\"}, {\"question\": \"Which planet is famous for its large rings?\", \"answer\": \"Saturn\"}]"}]
    user_goal: >
      You are doing a quiz. Answer the first question correctly (Mercury), the second one wrongly
      (say one moon) and the third one correctly (Saturn).
    goal_items:
      - {id: q1, value: Mercury}
      - {id: q2, value: one}
      - {id: q3, value: Saturn}
    expect:
      outcome: success
      quiz_correct: [true, false, true]

  - id: qz_dev_road
    strategy: quiz
    goal:
      task_description: "A road safety quiz"
      dialog_mode: quiz
      domain: road safety class
      resources_json: >
        [{"name": "questions", "description": "quiz bank",
          "content": "[{\"question\": \"What colour is a stop sign?\", \"answer\": \"Red\"}, {\"question\": \"What shape is a give way sign?\", \"answer\": \"An upside-down triangle\"}, {\"question\": \"On which side of the road do people drive in the United Kingdom?\", \"answer\": \"On the left\"}]"}]
    user_goal: >
      Answer the first question wrongly (say yellow), the second one correctly in your own words
      (a triangle pointing down) and the third one correctly (on the left).
    goal_items:
      - {id: q1, value: yellow}
      - {id: q2, value: a triangle pointing down}
      - {id: q3, value: on the left}
    expect:
      outcome: success
      quiz_correct: [false, true, true]
    # A silence (the user thinking): the robot must wait or prompt, not move on or end
    events:
      - {turn: 2, kind: silence}

  - id: qz_dev_calendar
    strategy: quiz
    goal:
      task_description: "A quiz about the calendar and the time"
      dialog_mode: quiz
      resources_json: >
        [{"name": "questions", "description": "quiz bank",
          "content": "[{\"question\": \"How many days are there in a leap year?\", \"answer\": \"366\"}, {\"question\": \"Which month has the fewest days?\", \"answer\": \"February\"}, {\"question\": \"How many hours are there in two days?\", \"answer\": \"48\"}]"}]
    user_goal: >
      Answer the first question correctly (366), the second one correctly (February) and the
      third one wrongly (say forty).
    goal_items:
      - {id: q1, value: "366"}
      - {id: q2, value: February}
      - {id: q3, value: forty}
    expect:
      outcome: success
      quiz_correct: [true, true, false]
    # A request to repeat: the robot must repeat the question, not grade it as an answer
    events:
      - {turn: 2, kind: text, text: "Sorry, could you repeat the question?"}

  # ==== Procedure ====

  - id: pr_dev_lamp
    strategy: procedure
    goal:
      task_description: "Guide the user to change the bulb of a table lamp"
      dialog_mode: procedure
      domain: household repairs
      resources_json: >
        [{"name": "steps", "description": "changing a bulb",
          "content": "[\"Switch off the lamp and unplug it\", {\"step\": \"Wait for the old bulb to cool down\", \"duration_s\": 90}, \"Unscrew the old bulb anticlockwise\", {\"step\": \"Screw in the new bulb clockwise until it is firm\", \"check\": \"the bulb does not wobble\"}, \"Plug the lamp in and switch it on\"]"}]
    user_goal: >
      You are changing the bulb of your table lamp. Do each step and say when you have done it.
      When the robot tells you to wait for the bulb to cool down, wait until it speaks to you
      again, and then say that the bulb is cool.
    goal_items:
      - {id: step_1, value: done}
      - {id: step_2, value: the bulb is cool}
      - {id: step_3, value: done}
      - {id: step_4, value: done}
      - {id: step_5, value: done}
    expect:
      outcome: success
      step_status: [done, done, done, done, done]
    # A silence during a step with a declared duration. 90 s, longer than E0a's wait_timeout
    # (60 s), so that the grace is exercised (skills/common.py, silence: a wait is silent and
    # uncounted while waited + wait <= duration): the first wait (60 s) falls inside it, the
    # second (120 s) does not and the robot speaks (until 2026-10-30 30 s, shorter than one
    # wait: the robot prompted at once and the grace was never used)
    events:
      - {turn: 2, kind: silence}

  - id: pr_dev_button
    strategy: procedure
    goal:
      task_description: "Guide the user to sew a button back on a shirt"
      dialog_mode: procedure
      domain: sewing
      resources_json: >
        [{"name": "steps", "description": "sewing a button",
          "content": "[\"Thread the needle and tie a knot at the end of the thread\", \"Push the needle up through the fabric and through one hole of the button\", \"Push the needle down through the opposite hole\", \"Wind the thread three times around the stitches under the button\", \"Tie a knot on the back of the fabric and cut the thread\"]"}]
    user_goal: >
      You are sewing a button back on your shirt. Do each step and say when it is done. On the
      fourth step, say that you cannot wind the thread under the button, three times in a row
      (even after the help). Then go on with the last step and finish.
    goal_items:
      - {id: step_1, value: done}
      - {id: step_2, value: done}
      - {id: step_3, value: done}
      - {id: step_4, value: cannot wind the thread under the button (three times)}
      - {id: step_5, value: done}
    expect:
      outcome: success
      step_status: [done, done, done, stuck, done]

  - id: pr_dev_boat
    strategy: procedure
    goal:
      task_description: "Guide the user to fold a paper boat"
      dialog_mode: procedure
      domain: paper crafts
      resources_json: >
        [{"name": "steps", "description": "paper boat",
          "content": "[\"Fold the sheet of paper in half from top to bottom\", \"Fold the two top corners down to the centre line\", \"Fold the bottom strips up on both sides to make a paper hat\", \"Pull the two sides of the hat gently apart to open the boat\", {\"step\": \"Decorate the boat with coloured pens\", \"optional\": true}]"}]
    user_goal: >
      You are folding a paper boat. Do each step and say when it is done. You do not want to
      decorate it: when the last step comes, say you want to skip it.
    goal_items:
      - {id: step_1, value: done}
      - {id: step_2, value: done}
      - {id: step_3, value: done}
      - {id: step_4, value: done}
      - {id: step_5, value: skip it}
    expect:
      outcome: success
      step_status: [done, done, done, done, skipped]
    # A request to repeat: the robot must repeat the step, not mark it done
    events:
      - {turn: 2, kind: text, text: "Sorry, could you say that again?"}

  # ==== Role play ====

  - id: rp_dev_neighbour
    strategy: roleplay
    goal:
      task_description: "Practise asking a neighbour to turn down their television at night"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "scene", "description": "roleplay scene",
          "content": "{\"scenario\": \"You knock on the door of your upstairs neighbour, who has the television very loud late at night\", \"role\": \"The neighbour: a bit defensive at first, but reasonable\", \"user_goal\": \"Agree on quieter evenings\", \"criteria\": [\"Explains the problem calmly\", \"Proposes a solution\"], \"max_exchanges\": 6}"}]
    user_goal: >
      You live below a neighbour who has the television very loud after midnight, and you cannot
      sleep.
      Explain the problem calmly and politely, but never propose a solution or an arrangement:
      only say again that the noise is a problem and wait for the neighbour to suggest something.
      Go on until the robot ends the practice.
    goal_items:
      - {id: problem, value: the television very loud after midnight}
      - {id: effect, value: you cannot sleep}
    expect:
      outcome: success
      criteria: ["Explains the problem calmly", "Proposes a solution"]
      weak_criterion: "Proposes a solution"

  - id: rp_dev_mechanic
    strategy: roleplay
    goal:
      task_description: "Practise leaving your car at the garage for a repair"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "scene", "description": "roleplay scene",
          "content": "{\"scenario\": \"A car repair garage on a Monday morning\", \"role\": \"The mechanic: busy, answers briefly\", \"user_goal\": \"Leave the car to be repaired\", \"criteria\": [\"Describes the problem\", \"Asks for the price\", \"Asks when the car will be ready\"], \"max_exchanges\": 6}"}]
    user_goal: >
      Since last week your car makes a grinding noise when you brake. Describe the problem
      clearly and ask how much the repair will cost, but never ask when the car will be ready:
      if the mechanic mentions it, just say "fine". In the middle of the practice ask the robot
      for help once ("what should I say now?"), then go on until the end.
    goal_items:
      - {id: problem, value: a grinding noise when braking}
      - {id: since, value: since last week}
      - {id: price, value: asks how much the repair will cost}
      - {id: help, value: asks for help once}
    expect:
      outcome: success
      criteria: ["Describes the problem", "Asks for the price", "Asks when the car will be ready"]
      weak_criterion: "Asks when the car will be ready"

  - id: rp_dev_market
    strategy: roleplay
    goal:
      task_description: "Practise buying something at a flea market"
      dialog_mode: roleplay
      resources_json: >
        [{"name": "scene", "description": "roleplay scene",
          "content": "{\"scenario\": \"A stall at a flea market on a Sunday morning\", \"role\": \"The seller of an old wooden chair: friendly, asks 40 euros but is ready to lower the price\", \"user_goal\": \"Buy the chair for less\", \"criteria\": [\"Greets the seller\", \"Makes a counter-offer\", \"Closes the deal politely\"], \"max_exchanges\": 6}"}]
    user_goal: >
      You like an old wooden chair. Greet the seller and ask the price. Do not bargain: accept
      the first price at once, without any counter-offer, and close the deal politely. After
      three of your answers, say you would like to stop the practice now.
    goal_items:
      - {id: greeting, value: greets the seller}
      - {id: price, value: asks the price of the chair}
      - {id: accept, value: accepts the first price}
      - {id: stop, value: would like to stop the practice}
    expect:
      outcome: success
      criteria: ["Greets the seller", "Makes a counter-offer", "Closes the deal politely"]
      weak_criterion: "Makes a counter-offer"

  # ==== Grounded question answering (answered: in the material; abstained: within the task,
  # not in the material; declined: outside the task) ====

  - id: qa_dev_theatre
    strategy: grounded_qa
    goal:
      task_description: Answer the audience's questions in the theatre foyer
      dialog_mode: grounded_qa
      domain: theatre
      resources_json: '[{"name": "information", "description": "what the robot may answer from", "content":
        "The play The Lighthouse Keeper is on from Thursday to Sunday at 20:00, with an extra performance
        on Sundays at 17:00. Tickets cost 18 euros in the stalls and 12 euros in the balcony. The interval
        lasts 20 minutes. Coats can be left at the cloakroom for free."}, {"name": "handover", "description":
        "who can help", "content": "The ushers can help you with
        that."}]'
    user_goal: You are going to the theatre. Ask at what time the play starts on Sunday afternoon. Then
      ask whether the actors sign autographs after the performance. Then ask the robot which football
      team it supports. Then say you have no more questions.
    goal_items:
      - {id: q1, value: the start time on Sunday afternoon}
      - {id: q2, value: autographs from the actors after the performance}
      - {id: q3, value: the robot's football team}
    expect:
      outcome: success
      qa_resolutions:
      - answered
      - abstained
      - declined
      # The key facts each answered question must state (score_runs.py; null: not answered)
      qa_facts:
      - ["17:00"]
      - null
      - null

  - id: qa_dev_ski
    strategy: grounded_qa
    goal:
      task_description: Answer the skiers' questions at the ski resort
      dialog_mode: grounded_qa
      domain: ski resort
      resources_json: '[{"name": "information", "description": "what the robot may answer from", "content":
        "The ski lifts open every day from 9:00 to 16:30. A day pass costs 45 euros for adults and 30 euros
        for children under 12. The ski school takes children from 4 years old. Skis and boots can be hired
        at the shop next to the main lift."}, {"name": "handover", "description": "who can help", "content":
        "The staff at the ticket windows can help you with that."}]'
    user_goal: First ask the robot whether you should invest your savings in shares. Then ask how much
      a day pass costs for a child of eight, and when the robot answers, ask it to repeat the answer.
      Then ask whether there is a first-aid post on the slopes. Then say you have no more questions.
    goal_items:
      - {id: q1, value: investing your savings in shares}
      - {id: q2, value: the price of a day pass for a child of eight}
      - {id: repeat, value: asks to repeat the answer}
      - {id: q3, value: a first-aid post on the slopes}
    expect:
      outcome: success
      qa_resolutions:
      - declined
      - answered
      - abstained
      # The key facts each answered question must state (score_runs.py; null: not answered)
      qa_facts:
      - null
      - ["30 euros"]
      - null

  - id: qa_dev_funfair
    strategy: grounded_qa
    goal:
      task_description: Answer the visitors' questions at the amusement park
      dialog_mode: grounded_qa
      domain: amusement park
      resources_json: '[{"name": "information", "description": "what the robot may answer from", "content":
        "The park opens from 11:00 to 23:00 in summer. Children must be at least 1.20 metres tall to ride
        the big roller coaster. A ride on the Ferris wheel costs 4 euros per person.
        Food from outside is not allowed inside the park."}, {"name": "handover", "description": "who can
        help", "content": "The staff at the information point can help you with that."}]'
    user_goal: Ask the robot to help you choose a present for your niece. Then ask how tall a child must
      be to ride the big roller coaster. Then ask how much a ride on the Ferris wheel costs. Then say goodbye.
    goal_items:
      - {id: q1, value: choosing a present for your niece}
      - {id: q2, value: the height needed for the big roller coaster}
      - {id: q3, value: the price of a ride on the Ferris wheel}
    expect:
      outcome: success
      qa_resolutions:
      - declined
      - answered
      - answered
      # The key facts each answered question must state (score_runs.py; null: not answered)
      qa_facts:
      - null
      - ["1.20 metres|120 cm|120 centimetres"]
      - ["4 euros"]

  # ==== Questionnaire (null: the user declines the item) ====

  - id: qn_dev_parks
    strategy: questionnaire
    goal:
      task_description: Ask the resident the survey about the town's parks
      dialog_mode: questionnaire
      domain: public parks
      resources_json: '[{"name": "instrument", "description": "the questionnaire", "content": "{\"name\":
        \"Park users survey\", \"instructions\": \"I am going to read you three statements about the park
        near your home. For each one, tell me how often it is true.\", \"options\": [\"Never\", \"Sometimes\",
        \"Often\", \"Always\"], \"items\": [\"The paths of the park are clean\", {\"text\": \"I feel safe
