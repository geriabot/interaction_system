# The GPU server for the system, and this computer's own GPU (small, ~4 GB) for a small open
# simulated user: the GPU server is left whole to the system (e.g. a routing with two 14B
# models resident). A ~4B simulator is for development and smoke tests only: small simulators
# are incoherent, never use it for reported results.
#
# The local Ollama: OLLAMA_HOST=127.0.0.1:11435 ollama serve (its own models directory).
# See single_gpu.yaml for the meaning of each key.
name: gpu_and_laptop
servers:
  gpu: {host: 127.0.0.1, port: 11434, memory_gb: 24, ssh: "${GPU_SERVER_SSH}"}
  laptop: {host: 127.0.0.1, port: 11435, memory_gb: 4}
open_simulator: gemma3:4b     # development only
lanes:
  local: {system: gpu, simulator: laptop, models: local, ros_domain_id: 74}
  cloud: {system: gpu, simulator: laptop, models: cloud, ros_domain_id: 75}
