# Two GPU servers, each running half of the local system models (and its own simulated user):
# for experiments with several local models (the candidates of E0a), in half the time. Each
# server needs the memory of its system model and of the open simulator.
# See single_gpu.yaml for the meaning of each key.
name: two_gpus_split
servers:
  gpu: {host: 127.0.0.1, port: 11434, memory_gb: 24, ssh: "${GPU_SERVER_SSH}"}
  second: {host: 127.0.0.1, port: 11436, memory_gb: 24, ssh: "${SECOND_GPU_SSH}"}
open_simulator: gemma3:12b
lanes:
  first: {system: gpu, simulator: gpu, models: local, shard: [0, 2], ros_domain_id: 74}
  second: {system: second, simulator: second, models: local, shard: [1, 2], ros_domain_id: 76}
  cloud: {system: gpu, simulator: gpu, models: cloud, ros_domain_id: 75}
