# E3, the shared mechanisms without noise: each mechanism against its ablation, everything else
# equal, and the mechanisms with no reasonable ablation against their specification (and, for
# recovery and breakdown, against the LLM-led conversation, B). The scenarios (scenarios/e3.yaml)
# provoke each mechanism with events at fixed turns, the same in every condition. The method runs
# every scenario; each ablation runs only the scenarios of its mechanism (scenario_ids of the
# condition), since elsewhere it is the method (decided 2026-10-30, instead of every condition on
# every scenario: the GPU time goes to the comparisons, not to repeating the method).
#
#   cancellation (c_, a_):  bounded against no_cancel_confirmation, llm_only_cancel, keywords_only_cancel
#   confirmation (d_):      bounded against no_confirmation
#   recovery (r_, b_, n_):  bounded against its specification and against B (llm_led)
#   silence, endings (s_, t_): bounded against its specification
#   the strategies' own mechanisms (m_): bounded against its specification (no ablation
#     removes them, and B's question here is recovery and breakdown: the method only;
#     analysis/strategy_checks.py, added 2026-10-30)
#
# English only (decided 2026-10-30: the method does not depend on the language; the Spanish run
# was dropped, and the Spanish scenarios, scenarios/e3_es.yaml, serve the test panel and the
# tests). The noise and the failures of the model are separate files (e3_noise.yaml,
# e3_failures.yaml). Not yet here (to be implemented): the urgency mechanism with its comparisons. Not run, because their result is
# fixed by construction in simulation (doc/EXPERIMENTS.md, E3, "Ablations not run"): the yes/no
# reading of the cancel confirmation and the self-report check of the explanation.
#
# Paid calls (the simulated user only): run_experiment.py --dry-run counts them; the run needs
# --allow-cloud.
name: e3_mechanisms
scenarios: scenarios/e3.yaml
personas_file: personas.yaml
# The events decide the mechanism; the personas vary the rest of the dialogue. None of them stops
# or falls silent on its own (uncooperative would: a cancel not planned)
personas: [cooperative, terse, older_adult]
repetitions: 3
language: English
# The local model (provisional until E0a chooses the model (one model for every question, no routes))
models: [qwen3:8b]
conditions:
  # The method: the Behavior Trees with the default parameters (no routes: one model)
  bounded: {}
  no_cancel_confirmation:
    ablation: no_cancel_confirmation
    skill_modules: ["interaction_ablations.skills"]
    scenario_ids: &cancel [c_taxi_exact_closed, c_optician_exact_open, c_gym_phrase_closed,
                           c_quiz_phrase, c_procedure_phrase, c_explanation_denied,
                           c_florist_content_kept, a_bank_cancel_value, a_newspaper_stop_value,
                           a_quiz_stop_answer, a_microwave_cancel_step]
  llm_only_cancel:
    ablation: llm_only_cancel
    skill_modules: ["interaction_ablations.skills"]
    scenario_ids: *cancel
  keywords_only_cancel:
    ablation: keywords_only_cancel
    skill_modules: ["interaction_ablations.skills"]
    scenario_ids: *cancel
  no_confirmation:
    ablation: no_confirmation
    scenario_ids: [d_cinema_correct, d_bike_correct, d_pool_list_correct, d_post_question]
  # B: the LLM handles misunderstandings itself, with the same rules and material
  llm_led:
    ablation: monolithic
    skill_modules: ["interaction_ablations.skills"]
    scenario_ids: [r_sf_ladder, r_quiz_unanswered, r_questionnaire_between, b_slot_filling,
                   b_explanation, b_procedure, b_roleplay, b_grounded_qa, b_questionnaire,
                   n_procedure_reset]
simulator:
  # As in E1: another family than the system's (Qwen)
  provider: gemini
  # gemini-2.5-flash-lite: the most faithful user simulator among the Gemini models still served,
  # by Zhou et al. 2026 (COLM, Table 4, User-Sim Index: 69.6, against 62.4 for gemini-3-flash and
  # 61.9 for gemini-2.5-flash). The first choice, gemini-2.0-flash (74.7), is no longer served
  # (checked 2026-10-29); capability does not predict fidelity, so the newer Flash models, not in
  # the table, are not preferred
  model: gemini-2.5-flash-lite
  temperature: 0.7
ollama: {host: 127.0.0.1, port: 11434, timeout: 120.0}
# The defaults of the system, as in the real sessions: the silence events are planned on them
# (one event: a prompt; four in a row: user_silent at max_silence)
limits: {wait_timeout: 15.0, max_silence: 90.0}
dialogue_timeout: 900
max_turns: 25
