# What each scenario of e3_es.yaml and e4_es.yaml provokes (from its `mechanism`, its events and
# its expected ending). Every scenario must be here, and every mechanism here must have an example
provokes:
  e3_es.yaml:
    c_taxi_exact_closed: [C8, C1, C4, C5, O4]
    c_optician_exact_open: [C1, C4, C5, O4]
    c_gym_phrase_closed: [C8, C2, C4, C5, O4]
    c_quiz_phrase: [C2, C4, C5, O4]
    c_procedure_phrase: [C2, C4, C5, O4]
    c_explanation_denied: [C2, C4, C6]
    c_florist_content_kept: [C2, C4, C7]
    a_bank_cancel_value: [C3]
    a_newspaper_stop_value: [C3]
    a_quiz_stop_answer: [C3]
    a_microwave_cancel_step: [C3]
    d_cinema_correct: [SF3]
    d_bike_correct: [SF3]
    d_pool_list_correct: [SF3, SF10]
    d_post_question: [SF4]
    r_sf_ladder: [SF12, O2]
    r_quiz_unanswered: [Q2, Q3, Q4, O2]
    r_questionnaire_between: [QN4, QN5, O2]
    b_slot_filling: [N1, O6]
    b_explanation: [N1, O6]
    b_procedure: [N1, O6]
    b_roleplay: [R7, R8, N1, O6]
    b_grounded_qa: [G8, N1, O6]
    b_questionnaire: [N1, O6]
    n_procedure_reset: [N2, P11]
    s_one_wait: [S1]
    s_three_waits: [S1, S2]
    s_user_silent: [S3, O5]
    s_step_duration: [S4, P10]
    t_turn_limit: [O7]
