# The ready examples of the test panel (test_panel.py; doc/TEST_PANEL.md): one scenario per
# strategy and one per shared or strategy mechanism that a scenario provokes on purpose, to try
# each by voice. They are scenarios of experiments/scenarios/ (no scenario is written for the
# panel): the Spanish files first (the real sessions are in Spanish); `file` names the file,
# `scenario` its id, `condition` the condition selected (bounded unless said otherwise). For the
# scenarios of e3_es.yaml the panel also offers the English twin (e3.yaml, same ids and events).
#
# Mechanism ids: C cancellation, S silence, O endings, N breakdown (no progress), SF slot filling,
# Q quiz, P procedure, EX explanation (teach-back), R role play, G grounded question answering,
# QN questionnaire, SYS staying in the task. `provokes` lists, for every scenario of e3_es.yaml and
# e4_es.yaml, the mechanisms its `mechanism`, `events` and expected ending provoke (the tests check
# that every one has an example); when several scenarios provoke the same mechanism, the example is
# the shortest (fewest events and turns). Some mechanisms are provoked only by the role of a
# scenario of dialogues_es.yaml (its user_goal, not an event at a fixed turn): those examples say
# so in their note. topic_chat and the urgency escalation are not implemented: they have no
# example.

mechanisms:
  C1: "An exact stop command (the local list of the language) cancels without the LLM"
  C2: "A request to stop in other words, detected by the LLM"
  C3: "Apparent cancellation: cancel or stop words that belong to the task"
  C4: "The robot asks whether you want to stop before cancelling"
  C5: "Cancel confirmed: the conversation ends as cancelled"
  C6: "Cancel denied: the robot resumes with what it had asked"
  C7: "The confirmation answered with the value asked: no cancel, the robot asks again"
  C8: "Strict mode while a closed-choice option is asked: a one-word stop command"
  S1: "One silence: the robot says it is waiting, and the conversation goes on"
  S2: "A long silence: waiting, the question repeated, quiet, \"whenever you're ready\""
  S3: "Silence up to max_silence: ends as user_silent with a closing line"
  S4: "Silence during a step with a declared duration: no prompt for the duration"
  O2: "Ending partial: an element left unfinished or unanswered"
  O4: "Ending cancelled"
  O5: "Ending user_silent"
  O6: "Ending breakdown"
  O3: "Ending failed"
  O7: "Ending turn_limit (the request's own turn limit)"
  N1: "Breakdown: max_stalled turns in a row without progress"
  N2: "The count without progress is reset by a turn with progress"
  SF3: "A correction at the read-back"
  SF4: "A question at the read-back, answered, then the confirmation asked again"
  SF6: "A number out of range: not recorded, the range said, asked again"
  SF7: "A value the task does not allow"
  SF10: "A list slot: an item removed and another added"
  SF11: "A slot the user does not give (left unanswered)"
  SF12: "The recovery ladder of a slot: asked again, closed question, unanswered"
  SF13: "Slot filling without a schema: the frame designed by the LLM, audited against the resources"
  SF17: "A slot conditioned on an unanswered slot is not asked"
  Q2: "A quiz question not answered: repeated word for word"
  Q3: "Not answered again: rephrased in simpler words, without the answer"
  Q4: "A quiz question left unanswered (not graded wrong)"
  P3: "A problem with a step: help"
  P4: "Problems with a step up to max_attempts: the step stuck, ending partial"
  P5: "A step that is not optional skipped: ending partial"
  P6: "An optional step skipped (the procedure is still complete)"
  P7: "A request to repeat the step: said again word for word"
  P8: "Back to the previous step"
  P9: "A report that contradicts the step's check: a problem, not done"
  P10: "The silence grace of a step with a duration"
  P11: "An unclear report: a reminder of the step, no progress"
  EX2: "Teach-back with a key point wrong: only that point repaired"
  EX4: "Declining the teach-back (\"I got it\"): a targeted direct question"
  EX5: "Not understood: the whole topic explained again"
  EX6: "Teach-back never right: gives up after max_attempts, ending failed"
  EX7: "No key points in the request: the LLM lists them, teach-back checks them"
  R3: "A request for help in a role play: a hint out of character"
  R4: "The user ends the practice: evaluated"
  R5: "The scene's natural end"
  R7: "Requests to repeat in a role play (not exchanges)"
  R8: "Repeats up to max_stalled in a role play: breakdown, no evaluation"
  R9: "A spoken cancel inside a scene"
  G2: "Abstention within the topic, with the handover"
  G3: "A request outside the task declined"
  G5: "A comment not recorded as a question"
  G6: "The last answer repeated"
  G8: "Turns not understood in question answering: breakdown"
  QN1: "Items read word for word"
  QN3: "A question about the meaning of an item, from the instrument"
  QN4: "An answer between two options: the options again, nothing suggested"
  QN5: "Answers between options until the item is left without an answer"
  QN6: "An item declined: refused, ending partial"
  QN7: "A request to repeat an item"
  QN9: "The score is never said"
  SYS2: "A detour (off-task question, request to decline, value not allowed): stays in the task"

by_strategy:
  - {strategy: slot_filling, file: e4_es.yaml, scenario: sf_coffee, title: "Ordering at the café (E4)"}
  - {strategy: quiz, file: e4_es.yaml, scenario: qz_geography, title: "Geography quiz (E4)"}
  - {strategy: procedure, file: e4_es.yaml, scenario: pr_tea, title: "Making a tea (E4)"}
  - {strategy: explanation, file: e4_es.yaml, scenario: ex_bus, title: "Bus route, with teach-back (E4)"}
  - {strategy: grounded_qa, file: e4_es.yaml, scenario: qa_museum, title: "Questions at the museum (E4)"}
  - {strategy: questionnaire, file: e4_es.yaml, scenario: qn_museum_satisfaction, title: "Museum satisfaction survey (E4)"}
  - {strategy: roleplay, file: e4_es.yaml, scenario: rp_interview, title: "Job interview practice (E4)"}

