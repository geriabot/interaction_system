<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de revisión</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d232b;--muted:#5d6875;--line:#d9dee5;--accent:#2563eb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}
@media (prefers-color-scheme: dark){:root{--bg:#14181d;--card:#1d232b;--ink:#e6eaef;--muted:#9aa5b1;--line:#333c47;--accent:#60a5fa;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
header{padding:10px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0 12px 0 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:14px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
h4{font-size:15px;margin:12px 0 4px}
.spacer{flex:1}
main{max-width:1400px;margin:0 auto;padding:16px 24px 60px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px}
main.single{grid-template-columns:minmax(0,820px);justify-content:center}
@media (max-width:1050px){main{grid-template-columns:1fr}}
section,aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
aside{font-size:14px;max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:12px}
aside table{font-size:13px}aside .hl{outline:3px solid var(--accent)}
button{margin:4px 8px 4px 0;padding:9px 16px;font-size:16px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.big{display:block;width:100%;text-align:left;padding:14px 18px;font-size:18px;margin:8px 0;border-width:2px}
button.big small{display:block;font-size:14px;color:var(--muted)}
button.choice{min-width:120px;font-size:18px;border-width:2px}
button.sel{border-color:var(--accent);background:#2563eb1c;font-weight:600}
button.yes{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--bad);color:var(--bad)}button.maybe{border-color:var(--warn);color:var(--warn)}
button.yes.on{background:var(--ok);color:#fff}button.no.on{background:var(--bad);color:#fff}button.maybe.on{background:var(--warn);color:#fff}
button.run{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.link{border:none;background:none;color:var(--accent);padding:0 4px;text-decoration:underline;font-size:15px;margin:0}
kbd{font:13px monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
input[type=text],textarea,select{width:100%;padding:9px 11px;font-size:17px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{font-family:monospace;font-size:13px;min-height:70px}
label{display:block;margin:10px 0 4px;color:var(--muted);font-size:15px}
.small{color:var(--muted);font-size:14px}.tech{color:var(--muted);font-size:12px;font-family:monospace}
#msg{color:var(--bad);min-height:1.2em;white-space:pre-wrap;font-weight:600;margin-bottom:6px}
#toast{color:var(--ok);font-size:14px;min-width:90px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;border:1px solid var(--line);margin-right:4px;vertical-align:middle}
.pill.trap{color:var(--warn);border-color:var(--warn)}
.box{border-radius:9px;padding:9px 13px;margin:6px 0;white-space:pre-wrap;background:#2563eb10;border-left:4px solid var(--accent)}
.box.user{background:#15803d14;border-left-color:var(--ok);font-size:20px}.box.robot{font-size:20px}
.box.plain{background:transparent;border-left-color:var(--line)}
.box.warn{background:#b4530914;border-left-color:var(--warn)}
.notsent{opacity:.8}
.q{border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}.q.focus{border-color:var(--accent)}
.q .qt{font-size:19px;font-weight:600}.q .qh{color:var(--muted);font-size:14px;margin:2px 0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto;font-size:13px;white-space:pre-wrap;margin:4px 0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;width:220px}.bar>i{display:block;height:100%;background:var(--accent)}
#strip{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px}#strip i{width:10px;height:10px;border-radius:2px;background:var(--line)}
#strip i.go{cursor:pointer}#strip i.ok,#strip i.done{background:var(--ok)}#strip i.wrong{background:var(--bad)}#strip i.unsure,#strip i.partial{background:var(--warn)}#strip i.stale{background:#7c3aed}
#strip i.cur{outline:2px solid var(--ink)}
.chat{display:flex;flex-direction:column;gap:6px}
.said{max-width:85%;padding:7px 11px;border-radius:10px;white-space:pre-wrap}.said.robot{background:#2563eb14;align-self:flex-start}.said.user{background:#15803d14;align-self:flex-end}
.said b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.chip{display:inline-block;margin:4px 4px 0 0;padding:3px 9px;border-radius:8px;border:2px solid var(--line);font-size:14px;cursor:pointer;background:var(--card);white-space:normal}
.chip.focus,.aitem.focus{outline:3px solid var(--accent)}.chip.correct,.aitem.correct{border-color:var(--ok)}
.chip.incorrect,.aitem.incorrect{border-color:var(--bad)}.chip.unsure,.aitem.unsure{border-color:var(--warn)}
.aitem{border:2px solid var(--line);border-radius:9px;padding:7px 11px;margin:6px 0;cursor:pointer}
.flag{color:var(--warn);font-size:12px}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.howto li{margin:6px 0}.right{color:var(--ok);font-weight:600}.wrongans{color:var(--bad);font-weight:600}
dl.sum{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:18px}dl.sum dt{color:var(--muted)}dl.sum dd{margin:0;font-weight:600}
</style></head><body>

<button id="b_lang" onclick="toggleLang()"></button></header>
<main id="main"><section id="content">…</section></main>

const answered=i=>st&&DONE[TASK].includes(st.statuses[i]);
const firstOpen=()=>{const i=st.statuses.findIndex((s,k)=>!answered(k));return i;};

async function go(i){if(!st||i<0||i>=st.total)return;if(!canGo(i)){msg(T('answer_first'));return;}
 cur=i;item=await api('/api/item?i='+i);if(item.error){msg(errText(item));return;}focusQ=0;focusKey=null;formOpen=false;screen='work';draw();window.scrollTo(0,0);}

 main.className=single?'single':'';
 let side='';

 main.innerHTML=`<section id="content"><div id="msg"></div>${({start:startHtml,confirm:confirmHtml,howto:howtoHtml,tutorial:tutorialHtml,work:workHtml,review:reviewHtml,done:doneHtml}[screen])()}</section>`+(side&&!single?`<aside id="side">${side}</aside>`:'');

 const nm=$('f_name');if(nm){nm.addEventListener('input',()=>{F.name=nm.value;});if(!F.name)nm.focus();}

 if(CFG.adjudication)tasks.push(['adjudicate',T('t_adjudicate'),T('t_adjudicate_sub')]);
 if(CFG.experiments.length||P.task=='adherence')tasks.push(['adherence',T('t_adherence'),T('t_adherence_sub')]);

 if(F.task=='adherence'&&!P.experiment){h+=`<h3>${T('which_exp')}</h3>`+CFG.experiments.map(e=>opt('experiment',e.name,esc(e.name),T('dialogues',{n:e.dialogues}))).join('');}
 if(F.task=='dataset'){const c=CFG.cases,sum=k=>F.case_language?c[k][F.case_language]:c[k].en+c[k].es;
  h+=`<h3>${T('which_scope')}</h3>`+opt('scope','traps',T('scope_traps',{n:sum('traps')}))+opt('scope','all',T('scope_all',{n:sum('all')}));}
 if(F.task=='dataset'||F.task=='adjudicate'){h+=`<h3>${T('case_lang')}</h3><div>`+[['',T('both')],['es',T('lang_es')],['en',T('lang_en')]].map(([v,t])=>

function body(){const b={name:(($('f_name')||{}).value||F.name||'').trim(),task:F.task,lang:F.lang||'',sheet:F.sheet||'',experiment:F.experiment||'',scope:F.scope||'traps',case_language:F.case_language||''};

// Blind first (author, 2026-11-01): the reviewer answers the case's question without seeing the
// case's answer; a match is accepted (its details, if any, are then checked), a mismatch asks which
// one is right. Saying yes to a "no" was too error-prone.
let BLIND=null;
const filled=v=>!(v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v=='object'&&!Array.isArray(v)&&!Object.keys(v).length));

// did not answer (it is false by convention)
const shownRest=()=>item.fields.filter(f=>!f.main&&(f.kind=='bool'||filled(item.expected[f.name]))
 &&!(item.stem=='quiz_grading'&&f.name=='ground_truth_correct'&&item.expected.expected_kind=='repeat'));

 const r=item.review,v=r&&item.status!='stale'?r.verdict:'';if(v||item.status=='stale'||formOpen||!mf||!mf.choices)return null;
 if(!BLIND||BLIND.id!=item.case.id)return 'pick';

function blindPick(i){const mf=item.fields.find(f=>f.main),val=mf.choices[i].value;BLIND={id:item.case.id,value:val};
 if(JSON.stringify(val)===JSON.stringify(item.expected[mf.name])&&!shownRest().length)return verdict('ok');draw();}

 setForm(mf.name,mf.choices.findIndex(ch=>JSON.stringify(ch.value)===JSON.stringify(BLIND.value)));

  let chips='';for(const _ of (e.revealed||[])){const it=item.items.find(x=>x.key=='d'+k);k++;if(!it)continue;
   chips+=`<span class="chip ${cls(it.key)}" onclick="focusKey='${it.key}';draw()">${esc(T('h_declared',{id:it.id,value:it.value}))}${it.off_script?` <span class="flag">${T('h_flag_off')}</span>`:''}${it.flagged?` <span class="flag">${T('h_flag_words')}</span>`:''}${ans(it.key)}</span>`;}
  h+=`<div class="said user"><b>${T('h_user')}${e.event?' ('+esc(e.event)+')':''}</b>${esc(e.text)}${e.heard&&e.heard!=e.text?`<div class="small">${T('h_heard')}: ${esc(e.heard)}</div>`:''}<div>${chips||`<span class="small">${T('h_nodecl')}</span>`}</div></div>`;}
 h+=`</div><details><summary class="small">${T('h_whole')}</summary><div class="chat">${item.transcript.map(t=>`<div class="said ${t.role=='user'?'user':'robot'}"><b>${t.role=='user'?T('h_user'):T('h_robot')}</b>${esc(t.text)}</div>`).join('')}</div></details>`;
 for(const it of item.items.filter(i=>i.kind!='declared'))h+=`<div class="aitem ${cls(it.key)}" onclick="focusKey='${it.key}';draw()">${it.kind=='unrevealed'?esc(T('h_unrev_item',{id:it.id,value:it.value})):esc(T('h_verdict_item',{v:verdictText(it)}))}${ans(it.key)}</div>`;
 const f=item.items.find(i=>i.key==focusKey),fa=marks[focusKey]=='correct'?'yes':marks[focusKey]=='incorrect'?'no':marks[focusKey];
 const qt=f.kind=='declared'?T('h_q_declared',{value:f.value,id:f.id}):f.kind=='unrevealed'?T('h_q_unrev',{value:f.value,id:f.id}):T('h_q_verdict',{v:verdictText(f)});
 const qh=T(f.kind=='declared'?'h_help_declared':f.kind=='unrevealed'?'h_help_unrev':'h_help_verdict');
 const left=keys.filter(k=>!marks[k]).length;
 h+=`<div class="q focus" style="position:sticky;bottom:0;background:var(--card)"><div class="qt">${esc(qt)}</div><div class="qh">${esc(qh)}</div>
 ${f.kind=='declared'?`<div class="box user" style="font-size:16px">${esc(f.text)}</div>`:''}
 ${yn("adhMark('correct')","adhMark('incorrect')",fa,"adhMark('unsure')")}<div class="small">${left?T('h_pending_items',{n:left}):''} ${T('keys_adherence')}</div></div>`;
 h+=noteHtml(item.note);return h;}
async function adhMark(m){const j=await api('/api/mark',{run:item.run,key:focusKey,mark:m,note:($('note')||{}).value??item.note});
 if(!after(j,()=>{item.marks=Object.assign({},item.marks);if(m)item.marks[focusKey]=m;else delete item.marks[focusKey];}))return;
 const nxt=item.items.map(i=>i.key).find(k=>!item.marks[k]);if(nxt)focusKey=nxt;draw();}
function moveFocus(d){const keys=item.items.map(i=>i.key);const i=keys.indexOf(focusKey);focusKey=keys[Math.max(0,Math.min(keys.length-1,i+d))];draw();}
// ---------------------------------------------------------------- keys
document.addEventListener('keydown',e=>{const t=e.target.tagName;
 if(t=='INPUT'||t=='TEXTAREA'||t=='SELECT'){if(e.key=='Escape')e.target.blur();
  else if(e.key=='Enter'&&formOpen&&(t!='TEXTAREA'||e.ctrlKey)){e.preventDefault();submitForm();}
  else if(e.key=='Enter'&&e.target.id=='f_name'){e.preventDefault();}return;}
 if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
 if(screen=='howto'&&(k=='enter'||k=='escape')){e.preventDefault();leaveHowto();return;}
 if(screen!='work'||!item)return;
 if(k=='arrowright'){e.preventDefault();next();return;}if(k=='arrowleft'){e.preventDefault();go(cur-1);return;}
 if(k=='/'){const n=$('note');if(n){e.preventDefault();n.focus();}return;}if(k=='?'){showHowto();return;}
 const yes=k=='s'||k=='y',no=k=='n',maybe=k=='d';
 if(TASK=='annotate'){if(yes||no||k=='1'||k=='0'){e.preventDefault();setLabel(focusQ,(yes||k=='1')?'1':'0');return;}
  if(k=='tab'){e.preventDefault();focusQ=1-focusQ;draw();return;}return;}
 if(TASK=='adherence'){if(yes){adhMark('correct');return;}if(no){adhMark('incorrect');return;}if(maybe){adhMark('unsure');return;}
  if(k=='arrowdown'||k=='j'){e.preventDefault();moveFocus(1);return;}if(k=='arrowup'||k=='k'){e.preventDefault();moveFocus(-1);return;}return;}
 if(formOpen){if(k=='escape'){formOpen=false;draw();return;}if(k=='enter'){e.preventDefault();submitForm();return;}
  const n=parseInt(k);const main=item.fields.find(f=>f.main);if(n>=1&&n<=main.choices.length){setForm(main.name,n-1);return;}return;}
 const bs=blindStage(),num=parseInt(k);
 if(bs=='pick'){const mf=item.fields.find(f=>f.main);if(num>=1&&num<=mf.choices.length){blindPick(num-1);return;}if(maybe){verdict('unsure');return;}}
 else if(bs=='same'){if(yes){verdict('ok');return;}if(no){openForm();return;}if(maybe){verdict('unsure');return;}}
 else if(bs=='differ'){if(k=='1'){keepMine();return;}if(k=='2'){verdict('ok');return;}if(maybe){verdict('unsure');return;}}
 else{if(yes){verdict('ok');return;}if(no){openForm();return;}if(maybe){verdict('unsure');return;}}
 if(k=='p'){const d=$('pdet');if(d)d.open=!d.open;return;}});
// ---------------------------------------------------------------- start
(async()=>{CFG=await (await fetch('/api/config')).json();const P=CFG.preset||{},U=new URLSearchParams(location.search);
 let last='';try{last=localStorage.getItem('rp_name')||'';}catch(e){}
 F={name:P.name||U.get('name')||last,task:P.task||U.get('task')||'',lang:P.lang||U.get('lang')||'',sheet:P.sheet||U.get('sheet')||'',
  experiment:P.experiment||U.get('experiment')||'',scope:P.scope||U.get('scope')||'traps',case_language:P.case_language||U.get('case_language')||''};
 CFG.preset_csv=P.task=='annotate'&&P.locked&&!P.sheet;
 if(P.locked){const j=await api('/api/check',body());if(!j.error){SUM=j.summary;screen='confirm';}else{screen='start';draw();msg(errText(j));return;}}
 draw();})();
